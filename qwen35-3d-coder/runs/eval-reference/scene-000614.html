<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cycle Works — Bicycle Service Workshop</title>
  <style>
    :root {
      color-scheme: dark;
      --cream: #f4eee2;
      --muted: rgba(244, 238, 226, 0.62);
      --accent: #ef704c;
      --line: rgba(255, 255, 255, 0.14);
      --glass: rgba(15, 21, 23, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101719;
      color: var(--cream);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #app canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #app canvas:active {
      cursor: grabbing;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 52% 47%, transparent 48%, rgba(3, 7, 8, 0.35) 100%),
        linear-gradient(180deg, rgba(4, 8, 9, 0.15), transparent 25%, transparent 78%, rgba(4, 8, 9, 0.25));
      z-index: 2;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .brand {
      position: absolute;
      top: 28px;
      left: 30px;
      max-width: 420px;
      text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 25px;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 14px rgba(239, 112, 76, 0.7);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 56px);
      line-height: 0.98;
      font-weight: 850;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    .actions {
      position: absolute;
      top: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 15px;
      color: var(--cream);
      background: var(--glass);
      backdrop-filter: blur(14px);
      font: inherit;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    button:hover {
      background: rgba(239, 112, 76, 0.17);
      border-color: rgba(239, 112, 76, 0.55);
      transform: translateY(-1px);
    }

    .bay {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent);
      background: var(--glass);
      backdrop-filter: blur(14px);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    .hint {
      position: absolute;
      left: 30px;
      bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .hint span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    kbd {
      min-width: 25px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--cream);
      background: rgba(8, 12, 13, 0.52);
      box-shadow: inset 0 -1px rgba(0, 0, 0, 0.3);
      font: inherit;
      font-size: 10px;
      text-align: center;
    }

    .caption {
      position: absolute;
      right: 28px;
      bottom: 27px;
      color: rgba(244, 238, 226, 0.38);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #101719;
      transition: opacity 500ms ease, visibility 500ms ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      display: grid;
      justify-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 850ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 700px) {
      .brand {
        top: 19px;
        left: 19px;
      }

      .subtitle,
      .caption {
        display: none;
      }

      .actions {
        top: 18px;
        right: 18px;
      }

      .actions button {
        display: none;
      }

      .hint {
        left: 19px;
        right: 19px;
        bottom: 18px;
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>

  <div class="hud">
    <header class="brand">
      <div class="eyebrow">Precision bicycle service</div>
      <h1>Cycle Works</h1>
      <div class="subtitle">A compact service bay built for frame repairs, wheel truing, and the tools that keep riders moving.</div>
    </header>

    <div class="actions">
      <div class="bay">04</div>
      <button id="resetView" type="button">Reset view</button>
    </div>

    <div class="hint">
      <span><kbd>Drag</kbd> orbit</span>
      <span><kbd>Scroll</kbd> zoom</span>
      <span><kbd>Shift</kbd> + drag to pan</span>
      <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> move</span>
    </div>

    <div class="caption">Service bay / north wall / 18:42</div>
  </div>

  <div id="loading">
    <div class="loader">
      <div class="spinner"></div>
      <span>Opening the workshop</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const app = document.getElementById("app");
    const loading = document.getElementById("loading");

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
      });
    } catch (error) {
      loading.innerHTML = '<div class="loader">WebGL is required to open this workshop.</div>';
      throw error;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x11191b);
    scene.fog = new THREE.Fog(0x11191b, 10, 19);

    const camera = new THREE.PerspectiveCamera(
      window.innerWidth < 700 ? 58 : 48,
      window.innerWidth / window.innerHeight,
      0.05,
      45
    );

    const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
    const standard = (color, roughness = 0.65, metalness = 0) =>
      new THREE.MeshStandardMaterial({ color, roughness, metalness });

    function canvasTexture(canvas, repeatX = 1, repeatY = 1) {
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(repeatX, repeatY);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function makeConcreteTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 512;
      const ctx = canvas.getContext("2d");
      const image = ctx.createImageData(512, 512);

      for (let i = 0; i < image.data.length; i += 4) {
        const value = 91 + Math.random() * 28;
        image.data[i] = value;
        image.data[i + 1] = value + 2;
        image.data[i + 2] = value;
        image.data[i + 3] = 255;
      }

      ctx.putImageData(image, 0, 0);
      ctx.strokeStyle = "rgba(40,45,44,0.12)";
      ctx.lineWidth = 1;

      for (let i = 0; i < 45; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.random() * 40 - 20, y + Math.random() * 10 - 5);
        ctx.stroke();
      }

      return canvasTexture(canvas, 3, 5);
    }

    function makeWoodTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      const gradient = ctx.createLinearGradient(0, 0, 0, 256);
      gradient.addColorStop(0, "#9a6743");
      gradient.addColorStop(0.5, "#815237");
      gradient.addColorStop(1, "#a16b45");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 1024, 256);

      for (let i = 0; i < 180; i++) {
        const y = Math.random() * 256;
        ctx.strokeStyle = `rgba(55,27,15,${0.03 + Math.random() * 0.11})`;
        ctx.lineWidth = 0.5 + Math.random() * 2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(
          260,
          y + Math.random() * 18 - 9,
          680,
          y + Math.random() * 18 - 9,
          1024,
          y + Math.random() * 8 - 4
        );
        ctx.stroke();
      }

      for (let i = 0; i < 5; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 256;
        ctx.strokeStyle = "rgba(46,22,12,0.18)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(x, y, 22 + Math.random() * 18, 5 + Math.random() * 4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      return canvasTexture(canvas, 2, 1);
    }

    function makePegboardTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 512;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ad8158";
      ctx.fillRect(0, 0, 512, 512);

      for (let y = 16; y < 512; y += 32) {
        for (let x = 16; x < 512; x += 32) {
          ctx.fillStyle = "#493729";
          ctx.beginPath();
          ctx.arc(x, y + 1.5, 3.1, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "rgba(255,225,185,0.25)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(x, y, 3.7, Math.PI * 0.1, Math.PI * 0.9);
          ctx.stroke();
        }
      }

      return canvasTexture(canvas);
    }

    function makeSignTexture(title, subtitle, accent = "#ef704c", background = "#233033") {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 320;
      const ctx = canvas.getContext("2d");

      const gradient = ctx.createLinearGradient(0, 0, 1024, 320);
      gradient.addColorStop(0, background);
      gradient.addColorStop(1, "#111a1c");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 1024, 320);

      ctx.fillStyle = accent;
      ctx.fillRect(0, 0, 28, 320);

      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 3;
      ctx.strokeRect(50, 38, 938, 244);

      ctx.fillStyle = "#f5eee2";
      ctx.textAlign = "center";
      ctx.font = "900 92px Arial, sans-serif";
      ctx.fillText(title, 512, 150);

      ctx.fillStyle = accent;
      ctx.font = "700 30px Arial, sans-serif";
      ctx.letterSpacing = "8px";
      ctx.fillText(subtitle, 512, 220);

      return canvasTexture(canvas);
    }

    const concreteTexture = makeConcreteTexture();
    const woodTexture = makeWoodTexture();
    const pegboardTexture = makePegboardTexture();

    const M = {
      wall: standard(0x59635d, 0.94),
      wallLower: standard(0x34413e, 0.9),
      wallDark: standard(0x3e4946, 0.92),
      trim: standard(0x252e2d, 0.75),
      beam: standard(0x2a3332, 0.72, 0.2),
      floor: new THREE.MeshStandardMaterial({
        map: concreteTexture,
        color: 0xffffff,
        roughness: 0.97
      }),
      wood: new THREE.MeshStandardMaterial({
        map: woodTexture,
        color: 0xffffff,
        roughness: 0.72
      }),
      frame: standard(0x594333, 0.72),
      pegboard: new THREE.MeshStandardMaterial({
        map: pegboardTexture,
        color: 0xffffff,
        roughness: 0.9
      }),
      metal: standard(0xbec7c7, 0.25, 0.82),
      darkMetal: standard(0x202a2c, 0.38, 0.68),
      chrome: standard(0xd7dedd, 0.18, 0.92),
      rubber: standard(0x15191a, 0.92),
      tire: standard(0x171b1c, 0.96),
      tread: standard(0x0d1011, 0.98),
      spoke: standard(0x9ca7a8, 0.34, 0.72),
      bike: standard(0xe45e43, 0.3, 0.35),
      bikeDark: standard(0xa83d2d, 0.38, 0.28),
      blue: standard(0x2f6170, 0.43, 0.3),
      blueDark: standard(0x1c3c45, 0.52, 0.3),
      orange: standard(0xda713f, 0.58),
      cream: standard(0xd8d0bc, 0.72),
      white: standard(0xe9e7dd, 0.78),
      red: standard(0xc74832, 0.48),
      green: standard(0x56745e, 0.68),
      mat: standard(0x1b3034, 0.98),
      matLine: standard(0x315158, 0.95),
      lamp: new THREE.MeshStandardMaterial({
        color: 0xfff0c8,
        emissive: 0xffd99b,
        emissiveIntensity: 2.7,
        roughness: 0.4
      })
    };

    function addMesh(geometry, material, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(w, h, d, material, x, y, z, parent = scene) {
      const object = addMesh(new THREE.BoxGeometry(w, h, d), material, parent);
      object.position.set(x, y, z);
      return object;
    }

    function cylinder(rt, rb, h, material, x, y, z, parent = scene, segments = 16) {
      const object = addMesh(
        new THREE.CylinderGeometry(rt, rb, h, segments),
        material,
        parent
      );
      object.position.set(x, y, z);
      return object;
    }

    function torus(radius, thickness, material, x, y, z, parent = scene, radial = 10, tubular = 40) {
      const object = addMesh(
        new THREE.TorusGeometry(radius, thickness, radial, tubular),
        material,
        parent
      );
      object.position.set(x, y, z);
      return object;
    }

    function tube(a, b, radius, material, parent = scene, segments = 10) {
      const start = Array.isArray(a) ? V(...a) : a.clone();
      const end = Array.isArray(b) ? V(...b) : b.clone();
      const direction = new THREE.Vector3().subVectors(end, start);
      const object = addMesh(
        new THREE.CylinderGeometry(radius, radius, direction.length(), segments),
        material,
        parent
      );
      object.position.copy(start).add(end).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(V(0, 1, 0), direction.normalize());
      return object;
    }

    function textPlane(width, height, texture, x, y, z, parent = scene, rotationY = 0) {
      const material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.86,
        metalness: 0
      });
      const plane = addMesh(new THREE.PlaneGeometry(width, height), material, parent);
      plane.position.set(x, y, z);
      plane.rotation.y = rotationY;
      plane.castShadow = false;
      return plane;
    }

    // ------------------------------------------------------------------
    // Narrow workshop shell
    // ------------------------------------------------------------------

    const floor = box(6.5, 0.16, 12.3, M.floor, 0, -0.08, 0);
    floor.castShadow = false;

    box(0.18, 4.15, 12.25, M.wall, -3.25, 2.0, 0);
    box(6.5, 4.15, 0.18, M.wall, 0, 2.0, -6.08);
    box(0.18, 0.72, 12.25, M.wallLower, 3.25, 0.36, 0);

    box(0.045, 1.02, 12.1, M.wallLower, -3.145, 0.51, 0);
    box(6.34, 1.02, 0.045, M.wallLower, 0, 0.51, -5.97);

    box(0.09, 0.18, 12.1, M.trim, -3.11, 0.09, 0);
    box(6.34, 0.18, 0.09, M.trim, 0, 0.09, -5.93);
    box(0.09, 0.18, 12.1, M.trim, 3.11, 0.09, 0);

    for (let z = -5; z <= 5; z += 2) {
      box(0.025, 3.4, 0.025, M.wallDark, -3.145, 2.05, z);
      box(6.25, 0.015, 0.018, M.wallDark, 0, 0.012, z);
    }

    for (const z of [-4.25, -0.55]) {
      box(6.45, 0.11, 0.14, M.beam, 0, 4.03, z);
    }

    const pipe = cylinder(0.045, 0.045, 6.15, M.darkMetal, -3.06, 3.52, -0.25);
    pipe.rotation.x = Math.PI / 2;

    const serviceMat = box(4.35, 0.022, 3.35, M.mat, -0.05, 0.014, -1.15);
    serviceMat.castShadow = false;

    for (let x = -1.8; x <= 1.8; x += 0.6) {
      box(0.012, 0.005, 3.15, M.matLine, x, 0.028, -1.15);
    }
    for (let z = -2.55; z <= 0.35; z += 0.6) {
      box(4.15, 0.005, 0.012, M.matLine, -0.05, 0.028, z);
    }

    // ------------------------------------------------------------------
    // Workbench and drawer unit
    // ------------------------------------------------------------------

    const benchTop = box(1.28, 0.16, 5.8, M.wood, -2.46, 1.04, -0.45);
    benchTop.receiveShadow = true;

    box(0.08, 0.19, 5.82, M.frame, -1.80, 1.02, -0.45);
    box(1.08, 0.08, 5.35, M.wood, -2.48, 0.27, -0.45);

    for (const x of [-2.93, -2.02]) {
      for (const z of [-2.95, -0.45, 2.02]) {
        box(0.11, 0.92, 0.11, M.darkMetal, x, 0.55, z);
        box(0.16, 0.06, 0.16, M.rubber, x, 0.04, z);
      }
    }

    box(0.10, 0.12, 4.95, M.darkMetal, -2.94, 0.91, -0.45);
    box(0.10, 0.12, 4.95, M.darkMetal, -2.02, 0.91, -0.45);

    box(0.92, 0.70, 1.42, M.blueDark, -2.49, 0.68, -2.28);
    for (let i = 0; i < 3; i++) {
      const y = 0.47 + i * 0.21;
      box(0.045, 0.18, 1.32, M.blue, -2.01, y, -2.28);
      const handle = cylinder(0.018, 0.018, 0.30, M.metal, -1.965, y, -2.28);
      handle.rotation.x = Math.PI / 2;
    }

    // Bench vise.
    box(0.34, 0.12, 0.38, M.blueDark, -2.12, 1.17, 1.35);
    box(0.16, 0.23, 0.34, M.blue, -2.27, 1.31, 1.35);
    box(0.16, 0.23, 0.34, M.blue, -1.98, 1.31, 1.35);
    const viseScrew = cylinder(0.034, 0.034, 0.47, M.chrome, -1.93, 1.28, 1.35);
    viseScrew.rotation.z = Math.PI / 2;
    const viseHandle = cylinder(0.018, 0.018, 0.34, M.metal, -1.68, 1.28, 1.35);
    viseHandle.rotation.x = Math.PI / 2;

    // Bench clutter.
    box(0.46, 0.18, 0.56, M.red, -2.62, 1.22, -1.23);
    box(0.48, 0.035, 0.58, M.darkMetal, -2.62, 1.325, -1.23);
    box(0.19, 0.035, 0.03, M.metal, -2.62, 1.27, -0.94);

    cylinder(0.105, 0.095, 0.22, M.cream, -2.72, 1.23, 0.25);
    cylinder(0.083, 0.083, 0.012, standard(0x34251d, 0.6), -2.72, 1.346, 0.25);
    torus(0.078, 0.022, M.cream, -2.60, 1.25, 0.25);

    cylinder(0.065, 0.075, 0.29, M.green, -2.78, 1.27, 0.65);
    cylinder(0.028, 0.028, 0.12, M.darkMetal, -2.78, 1.47, 0.65);

    const benchDriver = cylinder(0.055, 0.055, 0.25, M.orange, -2.13, 1.18, 0.25);
    benchDriver.rotation.x = Math.PI / 2;
    const benchDriverShaft = cylinder(0.017, 0.017, 0.30, M.chrome, -2.13, 1.18, 0.53);
    benchDriverShaft.rotation.x = Math.PI / 2;

    box(0.42, 0.025, 0.34, standard(0x657b84, 0.96), -2.37, 1.135, -0.18);

    // ------------------------------------------------------------------
    // Pegboard panels and hand tools
    // ------------------------------------------------------------------

    const panelCenters = [-2.38, -0.45, 1.48];

    for (const z of panelCenters) {
      const panel = addMesh(new THREE.PlaneGeometry(1.78, 1.56), M.pegboard);
      panel.position.set(-3.14, 2.25, z);
      panel.rotation.y = Math.PI / 2;
      panel.castShadow = false;
    }

    for (const z of [-3.31, -1.42, 0.52, 2.42]) {
      box(0.085, 1.68, 0.055, M.frame, -3.105, 2.25, z);
    }
    box(0.085, 0.06, 5.8, M.frame, -3.105, 3.06, -0.45);
    box(0.085, 0.06, 5.8, M.frame, -3.105, 1.44, -0.45);

    function hangingWrench(z, y, scale = 1) {
      const group = new THREE.Group();
      group.position.set(-2.92, y, z);
      group.rotation.y = Math.PI / 2;
      group.scale.setScalar(scale);
      scene.add(group);

    const view = {

    function updateCamera() {
      const sinPhi = Math.sin(view.phi);
      camera.position.set(
        view.target.x + view.radius * sinPhi * Math.sin(view.theta),
        view.target.y + view.radius * Math.cos(view.phi),
        view.target.z + view.radius * sinPhi * Math.cos(view.theta)
      );
      camera.lookAt(view.target);
    }

    function clampView() {
      view.radius = THREE.MathUtils.clamp(view.radius, 5.0, 8.0);
      view.theta = THREE.MathUtils.clamp(view.theta, -0.28, 0.52);
      view.phi = THREE.MathUtils.clamp(view.phi, 0.95, 1.42);
      view.target.x = THREE.MathUtils.clamp(view.target.x, -1.8, 1.8);
      view.target.y = THREE.MathUtils.clamp(view.target.y, 0.75, 2.35);
      view.target.z = THREE.MathUtils.clamp(view.target.z, -4.2, 0.4);
    }

    function resetView() {
      view.target.set(-0.25, 1.28, -1.55);
      view.radius = 7.25;
      view.theta = 0.40;
      view.phi = 1.29;
      updateCamera();
    }

    let drag = null;

    renderer.domElement.addEventListener("contextmenu", event => event.preventDefault());

    renderer.domElement.addEventListener("pointerdown", event => {
      drag = {
        x: event.clientX,
        y: event.clientY,
        pan: event.shiftKey || event.button === 2
      };
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", event => {
      if (!drag) return;

      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      drag.x = event.clientX;
      drag.y = event.clientY;

      if (drag.pan) {
        const right = V().setFromMatrixColumn(camera.matrix, 0);
        const up = V().setFromMatrixColumn(camera.matrix, 1);
        const scale = view.radius * 0.00125;

        view.target.addScaledVector(right, -dx * scale);
        view.target.addScaledVector(up, dy * scale);
      } else {
        view.theta -= dx * 0.0046;
        view.phi -= dy * 0.0038;
      }

      clampView();
      updateCamera();
    });

    function endDrag(event) {
      drag = null;
      if (event.pointerId !== undefined && renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointercancel", endDrag);

    renderer.domElement.addEventListener(
      "wheel",
      event => {
        event.preventDefault();
        view.radius *= Math.exp(event.deltaY * 0.001);
        clampView();
        updateCamera();
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("dblclick", resetView);

    window.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      let handled = true;

      if (key === "arrowleft") view.theta += 0.045;
      else if (key === "arrowright") view.theta -= 0.045;
      else if (key === "arrowup") view.phi -= 0.035;
      else if (key === "arrowdown") view.phi += 0.035;
      else if (key === "+" || key === "=") view.radius -= 0.25;
      else if (key === "-" || key === "_") view.radius += 0.25;
      else if (key === "r") resetView();
      else handled = false;

      if (handled) {
        event.preventDefault();
        clampView();
        updateCamera();
      }
    });

    document.getElementById("resetView").addEventListener("click", resetView);

    function onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.fov = width < 700 ? 58 : 48;
      camera.updateProjectionMatrix();
      updateCamera();
    }

    window.addEventListener("resize", onResize);

    // ------------------------------------------------------------------
    // Render loop
    // ------------------------------------------------------------------

    const clock = new THREE.Clock();

    function animate() {
      const elapsed = clock.getElapsedTime();
      dust.rotation.y = Math.sin(elapsed * 0.055) * 0.018;
      dust.position.y = Math.sin(elapsed * 0.18) * 0.035;
      renderer.render(scene, camera);
    }

    updateCamera();
    renderer.render(scene, camera);
    renderer.setAnimationLoop(animate);

    requestAnimationFrame(() => {
      loading.classList.add("hidden");
      setTimeout(() => loading.remove(), 600);
    });
  </script>
</body>
</html>
