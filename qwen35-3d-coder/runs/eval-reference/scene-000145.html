<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adventurer's Kite Shield</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090d10;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 44%, transparent 35%, rgba(0, 0, 0, 0.42) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.18), transparent 35%);
    }

    .title-card {
      position: fixed;
      top: clamp(20px, 4vw, 48px);
      left: clamp(20px, 4vw, 56px);
      max-width: 360px;
      padding: 18px 20px;
      border: 1px solid rgba(213, 171, 87, 0.3);
      border-radius: 12px;
      color: #eee3cd;
      background: linear-gradient(145deg, rgba(15, 21, 23, 0.82), rgba(20, 15, 11, 0.68));
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #c79b4b;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 4vw, 38px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: rgba(235, 225, 204, 0.65);
      font-size: 12px;
      line-height: 1.5;
    }

    .controls {
      position: fixed;
      right: clamp(18px, 3vw, 40px);
      bottom: clamp(18px, 3vw, 34px);
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(241, 231, 210, 0.7);
      font-size: 11px;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    .controls span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .controls i {
      width: 7px;
      height: 7px;
      border: 1px solid #c99a48;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(201, 154, 72, 0.5);
    }

    button {
      padding: 9px 13px;
      border: 1px solid rgba(216, 174, 91, 0.38);
      border-radius: 7px;
      color: #e7d6b7;
      background: rgba(18, 21, 22, 0.78);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    button:hover {
      border-color: rgba(231, 185, 99, 0.85);
      background: rgba(54, 40, 23, 0.82);
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 2px solid #d6aa5b;
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .title-card {
        max-width: calc(100vw - 40px);
        padding: 14px 16px;
      }

      .subtitle {
        display: none;
      }

      .controls {
        left: 20px;
        right: auto;
      }
    }
  </style>
</head>

<body>
  <div class="title-card">
    <p class="eyebrow">Armory Exhibit · III</p>
    <h1>Adventurer's Kite Shield</h1>
    <p class="subtitle">
      Lacquered field, gilded cross, reinforced steel boss, and a leather-lined reverse.
    </p>
  </div>

  <div class="vignette"></div>

  <div class="controls">
    <span><i></i> Drag to orbit · Scroll to zoom</span>
    <button id="reset" type="button">Reset view</button>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer, scene, and camera
    // -------------------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1114);
    scene.fog = new THREE.FogExp2(0x0b1114, 0.038);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      80
    );

    const target = new THREE.Vector3(0, 1.78, 0);
    const defaultView = {
      yaw: 0.19,
      pitch: 0.055,
      distance: 6.35
    };

    let yaw = defaultView.yaw;
    let pitch = defaultView.pitch;
    let distance = defaultView.distance;
    let dragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    function updateCamera() {
      const horizontalDistance = Math.cos(pitch) * distance;

      camera.position.set(
        target.x + Math.sin(yaw) * horizontalDistance,
        target.y + Math.sin(pitch) * distance,
        target.z + Math.cos(yaw) * horizontalDistance
      );

      camera.lookAt(target);
    }

    updateCamera();

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    const hemisphere = new THREE.HemisphereLight(0x9ebed0, 0x26170d, 1.15);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffe3b0, 4.2);
    keyLight.position.set(4.2, 7.5, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -4;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.bias = -0.00035;
    scene.add(keyLight);

    const coolRim = new THREE.DirectionalLight(0x6fa8c5, 2.8);
    coolRim.position.set(-4, 4, -3.5);
    scene.add(coolRim);

    const frontFill = new THREE.PointLight(0xffd49b, 20, 9, 2);
    frontFill.position.set(0, 3.2, 4.5);
    scene.add(frontFill);

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    const tealMaterial = new THREE.MeshStandardMaterial({
      color: 0x17464b,
      metalness: 0.12,
      roughness: 0.62
    });

    const darkTealMaterial = new THREE.MeshStandardMaterial({
      color: 0x0e2d32,
      metalness: 0.1,
      roughness: 0.72
    });

    const goldMaterial = new THREE.MeshStandardMaterial({
      color: 0xc39445,
      metalness: 0.82,
      roughness: 0.28
    });

    const brightGoldMaterial = new THREE.MeshStandardMaterial({
      color: 0xe0b765,
      metalness: 0.9,
      roughness: 0.2
    });

    const steelMaterial = new THREE.MeshStandardMaterial({
      color: 0x9ba8aa,
      metalness: 0.92,
      roughness: 0.24
    });

    const darkSteelMaterial = new THREE.MeshStandardMaterial({
      color: 0x30383a,
      metalness: 0.8,
      roughness: 0.38
    });

    const leatherMaterial = new THREE.MeshStandardMaterial({
      color: 0x4a2818,
      metalness: 0.02,
      roughness: 0.88
    });

    const leatherEdgeMaterial = new THREE.MeshStandardMaterial({
      color: 0x25140e,
      metalness: 0.02,
      roughness: 0.96
    });

    const woodMaterial = new THREE.MeshStandardMaterial({
      color: 0x503020,
      metalness: 0,
      roughness: 0.9,
      side: THREE.DoubleSide
    });

    const stoneMaterial = new THREE.MeshStandardMaterial({
      color: 0x32383a,
      metalness: 0.04,
      roughness: 0.94
    });

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x171c1d,
      metalness: 0.04,
      roughness: 0.92
    });

    // -------------------------------------------------------------------------
    // Shield silhouette
    // -------------------------------------------------------------------------

    function createKiteShape() {
      const shape = new THREE.Shape();

      shape.moveTo(-1.04, 1.5);
      shape.quadraticCurveTo(-1.18, 1.49, -1.18, 1.29);
      shape.lineTo(-1.08, -0.34);
      shape.quadraticCurveTo(-0.88, -1.09, 0, -1.75);
      shape.quadraticCurveTo(0.88, -1.09, 1.08, -0.34);
      shape.lineTo(1.18, 1.29);
      shape.quadraticCurveTo(1.18, 1.49, 1.04, 1.5);
      shape.closePath();

      return shape;
    }

    function polygonShape(points) {
      const shape = new THREE.Shape();
      shape.moveTo(points[0][0], points[0][1]);

      for (let i = 1; i < points.length; i++) {
        shape.lineTo(points[i][0], points[i][1]);
      }

      shape.closePath();
      return shape;
    }

    const shieldGroup = new THREE.Group();
    shieldGroup.position.set(0, 1.95, 0);
    scene.add(shieldGroup);

    const kiteShape = createKiteShape();

    // Main thick shield body.
    const bodyGeometry = new THREE.ExtrudeGeometry(kiteShape, {
      depth: 0.16,
      bevelEnabled: true,
      bevelThickness: 0.04,
      bevelSize: 0.045,
      bevelSegments: 4,
      curveSegments: 48,
      steps: 1
    });
    bodyGeometry.translate(0, 0, -0.08);

    const body = new THREE.Mesh(bodyGeometry, tealMaterial);
    body.castShadow = true;
    body.receiveShadow = true;
    shieldGroup.add(body);

    // Gilded border underlayer.
    const borderGeometry = new THREE.ExtrudeGeometry(kiteShape, {
      depth: 0.03,
      bevelEnabled: true,
      bevelThickness: 0.012,
      bevelSize: 0.018,
      bevelSegments: 2,
      curveSegments: 48
    });
    borderGeometry.scale(0.94, 0.94, 1);
    borderGeometry.translate(0, 0, 0.112);

    const border = new THREE.Mesh(borderGeometry, goldMaterial);
    border.castShadow = true;
    border.receiveShadow = true;
    shieldGroup.add(border);

    // Recessed teal face.
    const fieldGeometry = new THREE.ExtrudeGeometry(kiteShape, {
      depth: 0.025,
      bevelEnabled: true,
      bevelThickness: 0.01,
      bevelSize: 0.012,
      bevelSegments: 2,
      curveSegments: 48
    });
    fieldGeometry.scale(0.895, 0.895, 1);
    fieldGeometry.translate(0, 0, 0.136);

    const field = new THREE.Mesh(fieldGeometry, darkTealMaterial);
    field.castShadow = true;
    field.receiveShadow = true;
    shieldGroup.add(field);

    // Raised steel rim following the complete silhouette.
    const outlinePoints = kiteShape.getPoints(100);
    if (
      outlinePoints.length > 1 &&
      outlinePoints[0].distanceTo(outlinePoints[outlinePoints.length - 1]) < 0.001
    ) {
      outlinePoints.pop();
    }

    const rimCurve = new THREE.CatmullRomCurve3(
      outlinePoints.map((point) => new THREE.Vector3(point.x, point.y, 0.095)),
      true,
      "catmullrom",
      0.18
    );

    const rim = new THREE.Mesh(
      new THREE.TubeGeometry(rimCurve, 260, 0.047, 10, true),
      steelMaterial
    );
    rim.castShadow = true;
    rim.receiveShadow = true;
    shieldGroup.add(rim);

    // Heraldic cross.
    const verticalBlade = new THREE.ShapeGeometry(
      polygonShape([
        [-0.065, 1.13],
        [0.065, 1.13],
        [0.055, -0.96],
        [0, -1.16],
        [-0.055, -0.96]
      ])
    );
    verticalBlade.translate(0, 0, 0.177);

    const crossBlade = new THREE.Mesh(verticalBlade, goldMaterial);
    crossBlade.castShadow = true;
    shieldGroup.add(crossBlade);

    const horizontalBlade = new THREE.ShapeGeometry(
      polygonShape([
        [-0.48, 0.38],
        [0.48, 0.38],
        [0.48, 0.57],
        [-0.48, 0.57]
      ])
    );
    horizontalBlade.translate(0, 0, 0.178);

    const crossBar = new THREE.Mesh(horizontalBlade, goldMaterial);
    crossBar.castShadow = true;
    shieldGroup.add(crossBar);

    // Central hammered-steel boss made with a lathed profile.
    const bossProfile = [
      new THREE.Vector2(0.0, -0.10),
      new THREE.Vector2(0.09, -0.10),
      new THREE.Vector2(0.16, -0.075),
      new THREE.Vector2(0.225, -0.025),
      new THREE.Vector2(0.255, 0.04),
      new THREE.Vector2(0.235, 0.105),
      new THREE.Vector2(0.18, 0.16),
      new THREE.Vector2(0.09, 0.215),
      new THREE.Vector2(0.0, 0.23)
    ];

    const bossGeometry = new THREE.LatheGeometry(bossProfile, 72);
    bossGeometry.rotateX(Math.PI / 2);

    const boss = new THREE.Mesh(bossGeometry, steelMaterial);
    boss.position.set(0, 0.18, 0.145);
    boss.castShadow = true;
    boss.receiveShadow = true;
    shieldGroup.add(boss);

    // Gilded ring around the boss.
    const bossRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.272, 0.021, 10, 72),
      brightGoldMaterial
    );
    bossRing.position.set(0, 0.18, 0.185);
    bossRing.castShadow = true;
    shieldGroup.add(bossRing);

    // Small central cap.
    const cap = new THREE.Mesh(
      new THREE.SphereGeometry(0.078, 28, 18),
      brightGoldMaterial
    );
    cap.scale.set(1, 1, 0.55);
    cap.position.set(0, 0.18, 0.366);
    cap.castShadow = true;
    shieldGroup.add(cap);

    // Rivets around the boss.
    const rivetGeometry = new THREE.SphereGeometry(0.034, 14, 10);
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + Math.PI / 8;
      const rivet = new THREE.Mesh(rivetGeometry, brightGoldMaterial);
      rivet.position.set(
        Math.cos(angle) * 0.405,
        0.18 + Math.sin(angle) * 0.405,
        0.183
      );
      rivet.scale.z = 0.55;
      rivet.castShadow = true;
      shieldGroup.add(rivet);
    }

    // Outer perimeter rivets.
    const perimeterRivetGeometry = new THREE.SphereGeometry(0.027, 12, 8);
    for (let i = 0; i < outlinePoints.length; i += 6) {
      const point = outlinePoints[i];
      const rivet = new THREE.Mesh(perimeterRivetGeometry, steelMaterial);
      rivet.position.set(point.x * 0.967, point.y * 0.967, 0.142);
      rivet.scale.z = 0.5;
      rivet.castShadow = true;
      shieldGroup.add(rivet);
    }

    // -------------------------------------------------------------------------
    // Reverse side: wooden liner, leather straps, and grip
    // -------------------------------------------------------------------------

    const backPanelGeometry = new THREE.ShapeGeometry(kiteShape, 48);
    backPanelGeometry.scale(0.945, 0.945, 1);
    backPanelGeometry.translate(0, 0, -0.126);

    const backPanel = new THREE.Mesh(backPanelGeometry, woodMaterial);
    backPanel.receiveShadow = true;
    shieldGroup.add(backPanel);

    const verticalStrapGeometry = new THREE.BoxGeometry(0.17, 2.15, 0.065);

    for (const x of [-0.5, 0.5]) {
      const strap = new THREE.Mesh(verticalStrapGeometry, leatherMaterial);
      strap.position.set(x, 0.22, -0.19);
      strap.castShadow = true;
      shieldGroup.add(strap);

      const strapEdge = new THREE.Mesh(
        new THREE.BoxGeometry(0.19, 2.18, 0.025),
        leatherEdgeMaterial
      );
      strapEdge.position.set(x, 0.22, -0.225);
      strapEdge.castShadow = true;
      shieldGroup.add(strapEdge);
    }

    const grip = new THREE.Mesh(
      new THREE.BoxGeometry(1.14, 0.22, 0.15),
      leatherMaterial
    );
    grip.position.set(0, 0.16, -0.285);
    grip.castShadow = true;
    shieldGroup.add(grip);

    const gripRivetGeometry = new THREE.SphereGeometry(0.035, 12, 8);
    for (const x of [-0.5, 0.5]) {
      const rivet = new THREE.Mesh(gripRivetGeometry, steelMaterial);
      rivet.position.set(x, 0.16, -0.365);
      rivet.scale.z = 0.5;
      shieldGroup.add(rivet);
    }

    // -------------------------------------------------------------------------
    // Display plinth
    // -------------------------------------------------------------------------

    const plinth = new THREE.Mesh(
      new THREE.CylinderGeometry(2.05, 2.28, 0.22, 64),
      stoneMaterial
    );
    plinth.position.y = 0.11;
    plinth.receiveShadow = true;
    plinth.castShadow = true;
    scene.add(plinth);

    const upperPlinth = new THREE.Mesh(
      new THREE.CylinderGeometry(1.64, 1.82, 0.12, 64),
      stoneMaterial
    );
    upperPlinth.position.y = 0.28;
    upperPlinth.receiveShadow = true;
    upperPlinth.castShadow = true;
    scene.add(upperPlinth);

    const plinthRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.65, 0.025, 8, 96),
      goldMaterial
    );
    plinthRing.rotation.x = Math.PI / 2;
    plinthRing.position.y = 0.345;
    scene.add(plinthRing);

    // Support visible from the rear.
    const support = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.065, 0.9, 16),
      darkSteelMaterial
    );
    support.position.set(0, 0.72, -0.3);
    support.castShadow = true;
    scene.add(support);

    // -------------------------------------------------------------------------
    // Floor and ruined stone backdrop
    // -------------------------------------------------------------------------

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(36, 36),
      floorMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const blockGeometry = new THREE.BoxGeometry(1.08, 0.72, 0.92);

    for (const side of [-1, 1]) {
      for (let i = 0; i < 6; i++) {
        const color = new THREE.Color().setHSL(
          0.52,
          0.06,
          0.17 + Math.random() * 0.055
        );

        const material = new THREE.MeshStandardMaterial({
          color,
          roughness: 0.96,
          metalness: 0.02
        });

        const block = new THREE.Mesh(blockGeometry, material);
        block.position.set(
          side * (2.75 + Math.sin(i * 0.8) * 0.06),
          0.36 + i * 0.72,
          -2.85 + Math.cos(i * 0.8) * 0.05
        );
        block.rotation.y = side * 0.035 * (i % 2 ? 1 : -1);
        block.castShadow = true;
        block.receiveShadow = true;
        scene.add(block);
      }
    }

    const lintel = new THREE.Mesh(
      new THREE.BoxGeometry(6.8, 0.65, 1.0),
      stoneMaterial
    );
    lintel.position.set(0, 4.55, -2.85);
    lintel.castShadow = true;
    lintel.receiveShadow = true;
    scene.add(lintel);

    // -------------------------------------------------------------------------
    // Torches and animated flames
    // -------------------------------------------------------------------------

    const flames = [];

    function createTorch(x) {
      const group = new THREE.Group();
      group.position.set(x, 0, -0.55);

      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.055, 0.08, 1.2, 12),
        darkSteelMaterial
      );
      post.position.y = 0.6;
      post.castShadow = true;
      group.add(post);

      const bowl = new THREE.Mesh(
        new THREE.CylinderGeometry(0.23, 0.1, 0.19, 24),
        darkSteelMaterial
      );
      bowl.position.y = 1.25;
      bowl.castShadow = true;
      group.add(bowl);

      const flameGroup = new THREE.Group();
      flameGroup.position.y = 1.47;

      const outerFlame = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.19, 2),
        new THREE.MeshBasicMaterial({ color: 0xff681f })
      );
      outerFlame.scale.set(0.72, 1.75, 0.72);
      flameGroup.add(outerFlame);

      const innerFlame = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.12, 2),
        new THREE.MeshBasicMaterial({ color: 0xffdc78 })
      );
      innerFlame.scale.set(0.65, 1.35, 0.65);
      innerFlame.position.y = -0.035;
      flameGroup.add(innerFlame);

      const light = new THREE.PointLight(0xff8a36, 16, 7, 2);
      light.position.y = 1.48;
      group.add(light);

      flames.push({
        group: flameGroup,
        outer: outerFlame,
        inner: innerFlame,
        light,
        phase: Math.random() * Math.PI * 2
      });

      scene.add(group);
    }

    createTorch(-2.05);
    createTorch(2.05);

    // -------------------------------------------------------------------------
    // Floating dust
    // -------------------------------------------------------------------------

    const dustCount = 320;
    const dustPositions = new Float32Array(dustCount * 3);

    for (let i = 0; i < dustCount; i++) {
      dustPositions[i * 3] = (Math.random() - 0.5) * 10;
      dustPositions[i * 3 + 1] = Math.random() * 5.5 + 0.15;
      dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 7;
    }

    const dustGeometry = new THREE.BufferGeometry();
    dustGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(dustPositions, 3)
    );

    const dust = new THREE.Points(
      dustGeometry,
      new THREE.PointsMaterial({
        color: 0xe4c08c,
        size: 0.024,
        transparent: true,
        opacity: 0.36,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    scene.add(dust);

    // -------------------------------------------------------------------------
    // Custom camera controls
    // -------------------------------------------------------------------------

    const canvas = renderer.domElement;

    canvas.addEventListener("pointerdown", (event) => {
      dragging = true;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const deltaX = event.clientX - lastPointerX;
      const deltaY = event.clientY - lastPointerY;

      lastPointerX = event.clientX;
      lastPointerY = event.clientY;

      yaw -= deltaX * 0.006;
      pitch += deltaY * 0.005;
      pitch = THREE.MathUtils.clamp(pitch, -0.48, 0.58);

      updateCamera();
    });

    function endDrag(event) {
      dragging = false;

      if (event.pointerId !== undefined && canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    }

    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);
    canvas.addEventListener("contextmenu", (event) => event.preventDefault());

    canvas.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        distance = THREE.MathUtils.clamp(
          distance + event.deltaY * 0.0035,
          4.25,
          9.5
        );
        updateCamera();
      },
      { passive: false }
    );

    function resetView() {
      yaw = defaultView.yaw;
      pitch = defaultView.pitch;
      distance = defaultView.distance;
      updateCamera();
    }

    document.getElementById("reset").addEventListener("click", resetView);
    canvas.addEventListener("dblclick", resetView);

    // -------------------------------------------------------------------------
    // Resize and animation
    // -------------------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();

    function animate() {
      const elapsed = clock.getElapsedTime();

      for (const flame of flames) {
        const flicker = Math.sin(elapsed * 11 + flame.phase) * 0.07;
        const pulse = Math.sin(elapsed * 7.3 + flame.phase * 1.7) * 0.045;

        flame.outer.scale.y = 1.75 + flicker;
        flame.outer.rotation.y = elapsed * 0.6 + flame.phase;
        flame.inner.scale.y = 1.35 + pulse;
        flame.inner.rotation.y = -elapsed * 0.9 + flame.phase;
        flame.group.position.x = Math.sin(elapsed * 2.2 + flame.phase) * 0.012;
        flame.light.intensity = 15 + Math.sin(elapsed * 13 + flame.phase) * 2.2;
      }

      dust.rotation.y = elapsed * 0.012;
      dust.position.y = Math.sin(elapsed * 0.18) * 0.055;

      // A nearly imperceptible living movement in the exhibit.
      shieldGroup.rotation.y = Math.sin(elapsed * 0.38) * 0.012;
      shieldGroup.rotation.z = Math.sin(elapsed * 0.27) * 0.003;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
