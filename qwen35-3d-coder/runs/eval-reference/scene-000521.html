<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Level Crossing</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #a9c7d5;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    #interface {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .panel {
      pointer-events: auto;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 24, 32, 0.82);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
    }

    #information {
      position: absolute;
      top: 18px;
      left: 18px;
      width: min(340px, calc(100vw - 36px));
      padding: 17px 18px 16px;
    }

    .eyebrow {
      color: #93a9b9;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 5px 0 14px;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    #status-row {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 26px;
    }

    #status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
      transition: background 180ms, box-shadow 180ms;
    }

    #status {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.07em;
    }

    #details {
      margin-top: 7px;
      color: #aebdc8;
      font-size: 12px;
      line-height: 1.45;
    }

    .track {
      position: relative;
      height: 4px;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.11);
    }

    #cycle-progress {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
    }

    #legend {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #7f95a5;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #controls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: calc(100vw - 36px);
      padding: 8px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      padding: 10px 13px;
      color: #eaf2f7;
      background: rgba(255, 255, 255, 0.08);
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: background 150ms, border-color 150ms, transform 150ms;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.24);
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(14, 116, 144, 0.65);
    }

    button.active {
      border-color: rgba(74, 222, 128, 0.5);
      color: #bbf7d0;
      background: rgba(22, 101, 52, 0.58);
    }

    #hint {
      position: absolute;
      left: 18px;
      bottom: 18px;
      padding: 9px 12px;
      color: rgba(235, 244, 250, 0.72);
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      color: #dceaf2;
      background: #17232c;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: opacity 300ms;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 650px) {
      #information {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        padding: 14px;
      }

      h1 {
        margin-bottom: 10px;
        font-size: 19px;
      }

      #hint {
        display: none;
      }

      #controls {
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
      }

      button {
        padding: 9px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <div id="loading">Loading level crossing…</div>

  <div id="interface">
    <section id="information" class="panel" aria-live="polite">
      <div class="eyebrow">Railway Systems · Crossing 07</div>
      <h1>Animated Level Crossing</h1>

      <div id="status-row">
        <span id="status-dot"></span>
        <span id="status">CLEAR</span>
      </div>

      <div id="details">Road traffic may proceed.</div>

      <div class="track">
        <div id="cycle-progress"></div>
      </div>

      <div id="legend">
        <span>24 second cycle</span>
        <span id="barrier-state">Barriers raised</span>
      </div>
    </section>

    <div id="hint" class="panel">
      Drag to orbit · Scroll to zoom
    </div>

    <nav id="controls" class="panel" aria-label="Simulation controls">
      <button id="test-crossing" class="primary" type="button">Run crossing</button>
      <button id="bell-button" type="button" aria-pressed="false">Enable bell</button>
      <button id="pause-button" type="button">Pause</button>
      <button id="camera-button" type="button">Reset camera</button>
    </nav>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer and scene
    // -------------------------------------------------------------------------

    const loading = document.querySelector("#loading");

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaecbd8);
    scene.fog = new THREE.Fog(0xaecbd8, 62, 145);

    const camera = new THREE.PerspectiveCamera(
      46,
      window.innerWidth / window.innerHeight,
      0.1,
      250
    );

    const hemisphere = new THREE.HemisphereLight(0xc9e7ff, 0x53633c, 2.15);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0xfff1d5, 3.1);
    sun.position.set(-30, 48, 26);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -65;
    sun.shadow.camera.right = 65;
    sun.shadow.camera.top = 52;
    sun.shadow.camera.bottom = -52;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 130;
    sun.shadow.bias = -0.00035;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x7fa9d0, 0.65);
    fill.position.set(35, 18, -32);
    scene.add(fill);

    // -------------------------------------------------------------------------
    // Reusable geometry helpers
    // -------------------------------------------------------------------------

    function makeBox(parent, width, height, depth, material, x = 0, y = 0, z = 0) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function makeCylinder(
      parent,
      radiusTop,
      radiusBottom,
      height,
      material,
      x = 0,
      y = 0,
      z = 0,
      segments = 16
    ) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          segments
        ),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function makeSphere(parent, radius, material, x = 0, y = 0, z = 0) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 16, 12),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function makeCanvasTexture(text) {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 128;

      const context = canvas.getContext("2d");
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#17212a";
      context.font = "900 58px Arial";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(
        8,
        renderer.capabilities.getMaxAnisotropy()
      );
      return texture;
    }

    function makeGlowTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;

      const context = canvas.getContext("2d");
      const gradient = context.createRadialGradient(
        64, 64, 3,
        64, 64, 62
      );

      gradient.addColorStop(0, "rgba(255,255,255,1)");
      gradient.addColorStop(0.18, "rgba(255,255,255,0.85)");
      gradient.addColorStop(0.48, "rgba(255,255,255,0.25)");
      gradient.addColorStop(1, "rgba(255,255,255,0)");

      context.fillStyle = gradient;
      context.fillRect(0, 0, 128, 128);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const glowTexture = makeGlowTexture();

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    const materials = {
      grass: new THREE.MeshStandardMaterial({
        color: 0x627b42,
        roughness: 1
      }),
      road: new THREE.MeshStandardMaterial({
        color: 0x333a3d,
        roughness: 0.96
      }),
      roadLine: new THREE.MeshStandardMaterial({
        color: 0xe5e3d7,
        roughness: 0.85
      }),
      ballast: new THREE.MeshStandardMaterial({
        color: 0x686762,
        roughness: 1
      }),
      sleeper: new THREE.MeshStandardMaterial({
        color: 0x514237,
        roughness: 0.96
      }),
      rail: new THREE.MeshStandardMaterial({
        color: 0x9ca4a5,
        metalness: 0.82,
        roughness: 0.28
      }),
      rubber: new THREE.MeshStandardMaterial({
        color: 0x171b1c,
        roughness: 0.9
      }),
      concrete: new THREE.MeshStandardMaterial({
        color: 0xb9b8ae,
        roughness: 0.9
      }),
      barrierRed: new THREE.MeshStandardMaterial({
        color: 0xd72828,
        roughness: 0.58,
        metalness: 0.12
      }),
      barrierWhite: new THREE.MeshStandardMaterial({
        color: 0xf3f1df,
        roughness: 0.56
      }),
      dark: new THREE.MeshStandardMaterial({
        color: 0x1c252b,
        roughness: 0.7,
        metalness: 0.28
      }),
      yellow: new THREE.MeshStandardMaterial({
        color: 0xf5b92f,
        roughness: 0.62
      }),
      metal: new THREE.MeshStandardMaterial({
        color: 0xb9c2c5,
        metalness: 0.72,
        roughness: 0.32
      }),
      trainTeal: new THREE.MeshStandardMaterial({
        color: 0x0e5866,
        metalness: 0.34,
        roughness: 0.48
      }),
      trainRoof: new THREE.MeshStandardMaterial({
        color: 0x25363d,
        metalness: 0.4,
        roughness: 0.48
      }),
      window: new THREE.MeshStandardMaterial({
        color: 0x91c7d9,
        metalness: 0.2,
        roughness: 0.2,
        emissive: 0x163947,
        emissiveIntensity: 0.25
      }),
      treeTrunk: new THREE.MeshStandardMaterial({
        color: 0x60432c,
        roughness: 1
      }),
      treeLeaf: new THREE.MeshStandardMaterial({
        color: 0x385b35,
        roughness: 1
      })
    };

    // -------------------------------------------------------------------------
    // Landscape, road, and railway
    // -------------------------------------------------------------------------

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(180, 130),
      materials.grass
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.025;
    ground.receiveShadow = true;
    scene.add(ground);

    // The road runs north/south along Z. The rails run east/west along X.
    makeBox(scene, 12, 0.08, 120, materials.road, 0, 0.035, 0);

    // Road edge lines, interrupted around the railway crossing.
    for (const x of [-5.65, 5.65]) {
      for (const z of [-33.15, 33.15]) {
        makeBox(
          scene,
          0.12,
          0.018,
          53.7,
          materials.roadLine,
          x,
          0.087,
          z
        );
      }
    }

    // Center dashes.
    for (let z = -58; z <= 58; z += 4.2) {
      const nearTrack = Math.abs(Math.abs(z) - 4.5) < 3.0;
      if (!nearTrack) {
        makeBox(
          scene,
          0.13,
          0.018,
          2.15,
          materials.roadLine,
          0,
          0.088,
          z
        );
      }
    }

    // Stop bars on the two road approaches.
    for (const z of [-7.15, 7.15]) {
      makeBox(
        scene,
        10.9,
        0.022,
        0.32,
        materials.roadLine,
        0,
        0.094,
        z
      );
    }

    const trackZ = [-4.5, 4.5];
    const railGauge = 1.44;

    for (const z of trackZ) {
      // Ballast exists outside the road crossing.
      for (const side of [-1, 1]) {
        makeBox(
          scene,
          79,
          0.13,
          3.25,
          materials.ballast,
          side * 45.5,
          0.105,
          z
        );
      }

      // Sleepers are hidden by the crossing panels within the roadway.
      for (let x = -84; x <= 84; x += 1.38) {
        if (Math.abs(x) < 6.3) continue;

        makeBox(
          scene,
          0.23,
          0.14,
          2.55,
          materials.sleeper,
          x,
          0.17,
          z
        );
      }

      // Continuous running rails.
      for (const offset of [-railGauge / 2, railGauge / 2]) {
        makeBox(
          scene,
          170,
          0.14,
          0.12,
          materials.rail,
          0,
          0.29,
          z + offset
        );
      }

      // Rubber/asphalt crossing panel between the rails.
      makeBox(
        scene,
        12.15,
        0.045,
        1.23,
        materials.rubber,
        0,
        0.125,
        z
      );

      // Narrow flangeway panels outside each rail.
      for (const offset of [-1.04, 1.04]) {
        makeBox(
          scene,
          12.15,
          0.032,
          0.44,
          materials.rubber,
          0,
          0.106,
          z + offset
        );
      }
    }

    // Low rolling hills in the distance.
    const hillMaterial = new THREE.MeshStandardMaterial({
      color: 0x718256,
      roughness: 1
    });

    [
      [-64, -9, -42, 17, 5, 11],
      [52, -10, -48, 21, 6, 13],
      [-74, -11, 45, 18, 5, 12],
      [70, -10, 48, 23, 6, 15]
    ].forEach(([x, y, z, sx, sy, sz]) => {
      const hill = new THREE.Mesh(
        new THREE.SphereGeometry(1, 20, 12),
        hillMaterial
      );
      hill.position.set(x, y, z);
      hill.scale.set(sx, sy, sz);
      hill.receiveShadow = true;
      scene.add(hill);
    });

    // Deterministic decorative trees.
    let randomSeed = 90517;
    function random() {
      randomSeed = (randomSeed * 16807) % 2147483647;
      return (randomSeed - 1) / 2147483646;
    }

    for (let i = 0; i < 28; i++) {
      const x = (random() - 0.5) * 154;
      const z = (random() - 0.5) * 108;

      if (Math.abs(x) < 11 || Math.abs(z) < 8.5) continue;

      const tree = new THREE.Group();
      tree.position.set(x, 0, z);

      const scale = 0.75 + random() * 0.65;
      tree.scale.setScalar(scale);

      makeCylinder(
        tree,
        0.13,
        0.2,
        1.8,
        materials.treeTrunk,
        0,
        0.9,
        0,
        8
      );

      const crown = new THREE.Mesh(
        new THREE.ConeGeometry(1.05, 3.15, 9),
        materials.treeLeaf
      );
      crown.position.y = 2.65;
      crown.castShadow = true;
      crown.receiveShadow = true;
      tree.add(crown);

      scene.add(tree);
    }

    // -------------------------------------------------------------------------
    // Four barrier pedestals with twin half-barriers
    // -------------------------------------------------------------------------

    const barrierArms = [];

    function createBarrierPedestal(x, z, pointsInward) {
      const pedestal = new THREE.Group();
      pedestal.position.set(x, 0, z);
      scene.add(pedestal);

      makeBox(
        pedestal,
        1.08,
        0.24,
        1.02,
        materials.concrete,
        0,
        0.12,
        0
      );

      makeBox(
        pedestal,
        0.88,
        0.17,
        0.82,
        materials.yellow,
        0,
        0.315,
        0
      );

      makeBox(
        pedestal,
        0.67,
        1.02,
        0.67,
        materials.barrierRed,
        0,
        0.91,
        0
      );

      makeBox(
        pedestal,
        0.72,
        0.12,
        0.72,
        materials.barrierWhite,
        0,
        1.47,
        0
      );

      makeBox(
        pedestal,
        0.42,
        0.56,
        0.035,
        materials.dark,
        0,
        0.94,
        0.351
      );

      // A small amber indicator on the pedestal.
      const indicatorMaterial = new THREE.MeshStandardMaterial({
        color: 0xffb51b,
        emissive: 0xff8500,
        emissiveIntensity: 0.15,
        roughness: 0.35
      });

      makeSphere(
        pedestal,
        0.095,
        indicatorMaterial,
        0,
        1.2,
        0.39
      );

      const mount = new THREE.Group();
      mount.position.set(0, 1.42, 0);
      pedestal.add(mount);

      // Point the local +X boom toward the center of the road.
      if (!pointsInward) {
        mount.rotation.y = Math.PI;
      }

      const pivot = new THREE.Group();
      mount.add(pivot);

      const pivotCap = makeCylinder(
        pivot,
        0.23,
        0.23,
        0.32,
        materials.dark,
        0,
        0,
        0,
        18
      );
      pivotCap.rotation.x = Math.PI / 2;

      const segmentLength = 0.57;
      const segmentCount = 10;

      for (let i = 0; i < segmentCount; i++) {
        makeBox(
          pivot,
          segmentLength - 0.012,
          0.18,
          0.18,
          i % 2 === 0 ? materials.barrierRed : materials.barrierWhite,
          (i + 0.5) * segmentLength,
          0,
          0
        );
      }

      // Reflective tip and lower counterweight.
      makeBox(
        pivot,
        0.12,
        0.205,
        0.205,
        materials.barrierRed,
        segmentCount * segmentLength,
        0,
        0
      );

      makeBox(
        pivot,
        0.42,
        0.3,
        0.3,
        materials.dark,
        -0.22,
        0,
        0
      );

      barrierArms.push(pivot);
    }

    // One pair closes each road approach.
    createBarrierPedestal(-6.25, -8.55, true);
    createBarrierPedestal(6.25, -8.55, false);
    createBarrierPedestal(-6.25, 8.55, true);
    createBarrierPedestal(6.25, 8.55, false);

    // -------------------------------------------------------------------------
    // Two signal masts, each with crossbuck, two lamps, and bell housing
    // -------------------------------------------------------------------------

    const signalLamps = [];
    const bellHousings = [];

    const railroadTexture = makeCanvasTexture("RAILROAD");
    const crossingTexture = makeCanvasTexture("CROSSING");

    function addCrossbuckBoard(parent, angle, texture) {
      const boardPivot = new THREE.Group();
      boardPivot.rotation.z = angle;
      parent.add(boardPivot);

      makeBox(
        boardPivot,
        2.28,
        0.31,
        0.13,
        materials.barrierWhite,
        0,
        0,
        0
      );

      const front = new THREE.Mesh(
        new THREE.PlaneGeometry(1.9, 0.235),
        new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthWrite: false
        })
      );
      front.position.z = 0.071;
      boardPivot.add(front);

      const back = new THREE.Mesh(
        new THREE.PlaneGeometry(1.9, 0.235),
        new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthWrite: false
        })
      );
      back.position.z = -0.071;
      back.rotation.y = Math.PI;
      boardPivot.add(back);
    }

    function createSignalMast(x, z, rotationY) {
      const mast = new THREE.Group();
      mast.position.set(x, 0, z);
      mast.rotation.y = rotationY;
      scene.add(mast);

      makeBox(
        mast,
        0.72,
        0.18,
        0.72,
        materials.concrete,
        0,
        0.09,
        0
      );

      makeCylinder(
        mast,
        0.095,
        0.13,
        5.45,
        materials.metal,
        0,
        2.77,
        0,
        12
      );

      // Alternating red lamps.
      for (let i = 0; i < 2; i++) {
        const lampMaterial = new THREE.MeshStandardMaterial({
          color: 0x4b0909,
          emissive: 0xff1010,
          emissiveIntensity: 0.03,
          roughness: 0.22,
          metalness: 0.05
        });

        const lampX = i === 0 ? -0.47 : 0.47;
        const lamp = makeSphere(
          mast,
          0.215,
          lampMaterial,
          lampX,
          2.12,
          0.21
        );

        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.255, 0.052, 8, 20),
          materials.dark
        );
        ring.position.set(lampX, 2.12, 0.205);
        mast.add(ring);

        const haloMaterial = new THREE.SpriteMaterial({
          map: glowTexture,
          color: 0xff1717,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const halo = new THREE.Sprite(haloMaterial);
        halo.position.set(lampX, 2.12, 0.27);
        halo.scale.set(1.25, 1.25, 1.25);
        mast.add(halo);

        signalLamps.push({
          mesh: lamp,
          material: lampMaterial,
          halo,
          haloMaterial,
          index: i
        });
      }

      // Crossbuck above the lamps.
      const crossbuck = new THREE.Group();
      crossbuck.position.y = 4.02;
      mast.add(crossbuck);

      addCrossbuckBoard(crossbuck, Math.PI / 4, railroadTexture);
      addCrossbuckBoard(crossbuck, -Math.PI / 4, crossingTexture);

      // Bell housing.
      const bell = new THREE.Group();
      bell.position.set(0, 5.02, 0.08);
      mast.add(bell);

      makeCylinder(
        bell,
        0.34,
        0.39,
        0.2,
        materials.dark,
        0,
        0,
        0,
        18
      );

      const dome = makeSphere(
        bell,
        0.34,
        materials.metal,
        0,
        0.2,
        0
      );
      dome.scale.y = 0.62;

      makeBox(
        bell,
        0.48,
        0.07,
        0.28,
        materials.barrierRed,
        0,
        0.43,
        0
      );

      bellHousings.push(bell);

      const warningLight = new THREE.PointLight(0xff1111, 0, 6, 2);
      warningLight.position.set(0, 2.12, 0.55);
      mast.add(warningLight);

      signalLamps[signalLamps.length - 2].warningLight = warningLight;
      signalLamps[signalLamps.length - 1].warningLight = warningLight;
    }

    // The north-facing and south-facing assemblies serve the two approaches.
    createSignalMast(-7.65, -8.85, Math.PI);
    createSignalMast(7.65, 8.85, 0);

    // -------------------------------------------------------------------------
    // Train
    // -------------------------------------------------------------------------

    const train = new THREE.Group();
    train.position.z = -4.5;
    train.visible = false;
    scene.add(train);

    const trainWheels = [];

    function addWheel(parent, x, y, z, radius) {
      const holder = new THREE.Group();
      holder.position.set(x, y, z);
      holder.rotation.x = Math.PI / 2;
      parent.add(holder);

      const wheel = makeCylinder(
        holder,
        radius,
        radius,
        0.22,
        materials.dark,
        0,
        0,
        0,
        14
      );
      wheel.castShadow = true;

      const hub = makeCylinder(
        holder,
        radius * 0.38,
        radius * 0.38,
        0.235,
        materials.metal,
        0,
        0,
        0,
        12
      );
      hub.castShadow = true;

      trainWheels.push(wheel);
    }

    // Locomotive.
    makeBox(
      train,
      8.3,
      0.46,
      2.35,
      materials.dark,
      0,
      1.04,
      0
    );

    makeBox(
      train,
      4.7,
      1.72,
      2.18,
      materials.trainTeal,
      -1.45,
      2.08,
      0
    );

    makeBox(
      train,
      2.25,
      2.25,
      2.25,
      materials.trainTeal,
      1.38,
      2.35,
      0
    );

    makeBox(
      train,
      2.5,
      0.2,
      2.48,
      materials.trainRoof,
      1.35,
      3.57,
      0
    );

    makeBox(
      train,
      0.2,
      1.7,
      2.2,
      materials.yellow,
      3.47,
      2.25,
      0
    );

    // Cab windows on both sides.
    for (const z of [-1.135, 1.135]) {
      makeBox(
        train,
        1.5,
        0.83,
        0.045,
        materials.window,
        1.4,
        2.77,
        z
      );
    }

    // Hood vents.
    for (let i = 0; i < 5; i++) {
      makeBox(
        train,
        0.12,
        0.72,
        0.05,
        materials.dark,
        -3.2 + i * 0.62,
        2.25,
        1.11
      );
    }

    // Front light.
    const headlightMaterial = new THREE.MeshStandardMaterial({
      color: 0xfff7ca,
      emissive: 0xffd66b,
      emissiveIntensity: 1.8
    });
    makeSphere(
      train,
      0.16,
      headlightMaterial,
      3.59,
      2.62,
      0
    );

    for (const x of [-2.6, -0.65, 2.25]) {
      addWheel(train, x, 0.64, 1.02, 0.43);
      addWheel(train, x, 0.64, -1.02, 0.43);
    }

    // Freight wagons.
    const wagonCenters = [-10, -20, -30];

    for (let index = 0; index < wagonCenters.length; index++) {
      const x = wagonCenters[index];

      makeBox(
        train,
        8.8,
        0.42,
        2.25,
        materials.dark,
        x,
        1.0,
        0
      );

      makeBox(
        train,
        8.25,
        1.75,
        2.18,
        index === 1 ? 0x7a3428 : 0x49544d,
        x,
        2.05,
        0
      );

      for (let rib = 0; rib < 7; rib++) {
        makeBox(
          train,
          0.09,
          1.58,
          2.24,
          materials.dark,
          x - 3.4 + rib * 1.12,
          2.05,
          0
        );
      }

      // Top rail.
      makeBox(
        train,
        8.35,
        0.09,
        2.28,
        materials.metal,
        x,
        2.98,
        0
      );

      // Couplers.
      makeBox(
        train,
        1.0,
        0.18,
        0.28,
        materials.dark,
        x + 4.7,
        0.94,
        0
      );

      for (const wheelX of [x - 2.7, x + 2.7]) {
        addWheel(train, wheelX, 0.63, 1.0, 0.4);
        addWheel(train, wheelX, 0.63, -1.0, 0.4);
      }
    }

    // -------------------------------------------------------------------------
    // Direct camera controls: orbit and zoom
    // -------------------------------------------------------------------------

    const cameraState = {
      target: new THREE.Vector3(0, 1.55, 0),
      radius: 43,
      theta: 0.67,
      phi: 0.91,
      dragging: false,
      lastX: 0,
      lastY: 0
    };

    const initialCamera = {
      radius: 43,
      theta: 0.67,
      phi: 0.91
    };

    function updateCamera() {
      const { target, radius, theta, phi } = cameraState;
      const horizontal = radius * Math.sin(phi);

      camera.position.set(
        target.x + horizontal * Math.sin(theta),
        target.y + radius * Math.cos(phi),
        target.z + horizontal * Math.cos(theta)
      );

      camera.lookAt(target);
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      cameraState.dragging = true;
      cameraState.lastX = event.clientX;
      cameraState.lastY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!cameraState.dragging) return;

      const deltaX = event.clientX - cameraState.lastX;
      const deltaY = event.clientY - cameraState.lastY;

      cameraState.theta -= deltaX * 0.006;
      cameraState.phi = THREE.MathUtils.clamp(
        cameraState.phi - deltaY * 0.005,
        0.38,
        1.38
      );

      cameraState.lastX = event.clientX;
      cameraState.lastY = event.clientY;
      updateCamera();
    });

    function endCameraDrag(event) {
      cameraState.dragging = false;
      if (renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", endCameraDrag);
    renderer.domElement.addEventListener("pointercancel", endCameraDrag);

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        cameraState.radius = THREE.MathUtils.clamp(
          cameraState.radius * Math.exp(event.deltaY * 0.001),
          18,
          82
        );
        updateCamera();
      },
      { passive: false }
    );

    updateCamera();

    // -------------------------------------------------------------------------
    // Optional synthesized bell
    // -------------------------------------------------------------------------

    let audioEnabled = false;
    let audioContext = null;

    function ringBell() {
      if (!audioEnabled) return;

      if (!audioContext) {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const now = audioContext.currentTime;

      for (const frequency of [720, 1080]) {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, now);
        oscillator.frequency.exponentialRampToValueAtTime(
          frequency * 0.96,
          now + 0.55
        );

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(
          frequency === 720 ? 0.13 : 0.055,
          now + 0.012
        );
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(now + 0.72);
      }
    }

    // -------------------------------------------------------------------------
    // UI and crossing state
    // -------------------------------------------------------------------------

    const statusElement = document.querySelector("#status");
    const detailsElement = document.querySelector("#details");
    const statusDot = document.querySelector("#status-dot");
    const barrierState = document.querySelector("#barrier-state");
    const progressElement = document.querySelector("#cycle-progress");

    const testButton = document.querySelector("#test-crossing");
    const bellButton = document.querySelector("#bell-button");
    const pauseButton = document.querySelector("#pause-button");
    const cameraButton = document.querySelector("#camera-button");

    const CYCLE_DURATION = 24;
    let cycleTime = 0;
    let paused = false;
    let lastBellIndex = -1;

    testButton.addEventListener("click", () => {
      cycleTime = 3.65;
      lastBellIndex = -1;
      if (audioEnabled) ringBell();
    });

    bellButton.addEventListener("click", () => {
      audioEnabled = !audioEnabled;

      bellButton.textContent = audioEnabled ? "Bell enabled" : "Enable bell";
      bellButton.classList.toggle("active", audioEnabled);
      bellButton.setAttribute("aria-pressed", String(audioEnabled));

      if (audioEnabled) ringBell();
    });

    pauseButton.addEventListener("click", () => {
      paused = !paused;
      pauseButton.textContent = paused ? "Resume" : "Pause";
      pauseButton.classList.toggle("active", paused);
    });

    cameraButton.addEventListener("click", () => {
      cameraState.radius = initialCamera.radius;
      cameraState.theta = initialCamera.theta;
      cameraState.phi = initialCamera.phi;
      updateCamera();
    });

    function smoothStep(min, max, value) {
      const x = THREE.MathUtils.clamp((value - min) / (max - min), 0, 1);
      return x * x * (3 - 2 * x);
    }

    function updateCrossing(delta) {
      if (!paused) {
        cycleTime = (cycleTime + delta) % CYCLE_DURATION;
      }

      const t = cycleTime;
      let barrierAmount = 0;
      let warning = false;
      let title = "CLEAR";
      let detail = "Road traffic may proceed.";

      if (t >= 3.8 && t < 19.2) {
        warning = true;
      }

      if (t < 4) {
        barrierAmount = 0;
      } else if (t < 7) {
        barrierAmount = smoothStep(4, 7, t);
        title = "BARRIERS CLOSING";
        detail = "Warning lamps and bell are active.";
      } else if (t < 15) {
        barrierAmount = 1;
        title = t < 10.5 ? "TRAIN APPROACHING" : "TRAIN CROSSING";
        detail = "Keep the crossing clear. Gates remain locked down.";
      } else if (t < 19) {
        barrierAmount = 1 - smoothStep(15, 19, t);
        title = "BARRIERS OPENING";
        detail = "The train has passed. Half-barriers are rising.";
      } else {
        barrierAmount = 0;
        title = "CLEAR";
        detail = "Road traffic may proceed.";
      }

      // Smooth, mechanically convincing barrier rotation.
      for (const arm of barrierArms) {
        arm.rotation.z = barrierAmount * Math.PI * 0.5;
      }

      // Train movement.
      if (t >= 6.7 && t < 14.8) {
        const progress = (t - 6.7) / (14.8 - 6.7);
        train.position.x = THREE.MathUtils.lerp(-42, 45, progress);
        train.visible = true;
      } else {
        train.visible = false;
      }

      for (const wheel of trainWheels) {
        wheel.rotation.y -= delta * 12;
      }

      // Alternating red lamps. Every mast uses the same synchronized pair.
      const flashIndex = Math.floor(Math.max(0, t - 3.8) / 0.43) % 2;

      for (const lamp of signalLamps) {
        const isOn = warning && lamp.index === flashIndex;

        lamp.material.emissiveIntensity = isOn ? 5.5 : 0.025;
        lamp.material.color.setHex(isOn ? 0xff1717 : 0x4b0909);
        lamp.haloMaterial.opacity = isOn ? 0.88 : 0;
        lamp.halo.scale.setScalar(isOn ? 1.45 : 0.8);

        if (lamp.warningLight) {
          lamp.warningLight.intensity = isOn ? 5.5 : 0;
        }
      }

      // Bell housing vibration.
      const bellPhase = warning ? (t - 3.8) % 1.15 : 0;
      const bellMotion = warning
        ? Math.sin(bellPhase * Math.PI * 12) * Math.exp(-bellPhase * 5)
        : 0;

      for (const bell of bellHousings) {
        bell.rotation.z = bellMotion * 0.055;
        bell.position.y = 5.02 + Math.abs(bellMotion) * 0.025;
      }

      // Audio bell pulses.
      if (warning) {
        const bellIndex = Math.floor((t - 3.8) / 1.15);
        if (bellIndex !== lastBellIndex) {
          lastBellIndex = bellIndex;
          ringBell();
        }
      } else {
        lastBellIndex = -1;
      }

      // UI.
      statusElement.textContent = title;
      detailsElement.textContent = detail;

      const warningColor = warning ? "#ef4444" : "#4ade80";
      statusDot.style.background = warningColor;
      statusDot.style.boxShadow = `0 0 13px ${warningColor}`;

      barrierState.textContent =
        barrierAmount > 0.985
          ? "Barriers lowered"
          : barrierAmount < 0.015
            ? "Barriers raised"
            : "Barriers moving";

      progressElement.style.width = `${(t / CYCLE_DURATION) * 100}%`;
    }

    // -------------------------------------------------------------------------
    // Resize and animation loop
    // -------------------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.05);
      updateCrossing(delta);
      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(animate);

    loading.classList.add("hidden");
    setTimeout(() => loading.remove(), 350);
  </script>
</body>
</html>
