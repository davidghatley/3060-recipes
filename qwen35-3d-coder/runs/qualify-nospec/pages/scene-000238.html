<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folding Clothes Drying Rack</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e8eef1;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    #scene canvas:active {
      cursor: grabbing;
    }

    .info {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      max-width: min(360px, calc(100vw - 44px));
      padding: 17px 19px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 16px;
      background: rgba(250, 252, 253, 0.76);
      box-shadow: 0 12px 36px rgba(35, 52, 60, 0.12);
      backdrop-filter: blur(14px);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #718087;
      font-size: 0.7rem;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #263238;
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      font-weight: 720;
      letter-spacing: -0.035em;
    }

    .info p:last-child {
      margin: 8px 0 0;
      color: #65747a;
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10;
      display: flex;
      gap: 9px;
      padding: 9px;
      transform: translateX(-50%);
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 14px;
      background: rgba(250, 252, 253, 0.82);
      box-shadow: 0 12px 36px rgba(35, 52, 60, 0.14);
      backdrop-filter: blur(14px);
    }

    button {
      appearance: none;
      border: 1px solid rgba(104, 124, 132, 0.16);
      border-radius: 9px;
      padding: 10px 13px;
      color: #34434a;
      background: rgba(255, 255, 255, 0.88);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease, color 150ms ease;
    }

    button:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button.primary {
      color: white;
      border-color: transparent;
      background: #64757d;
    }

    button.primary:hover {
      background: #53666e;
    }

    .hint {
      position: fixed;
      right: 20px;
      bottom: 24px;
      z-index: 10;
      color: rgba(55, 72, 79, 0.62);
      font-size: 0.72rem;
      pointer-events: none;
    }

    @media (max-width: 650px) {
      .info {
        top: 12px;
        left: 12px;
        padding: 13px 15px;
      }

      .info p:last-child {
        display: none;
      }

      .controls {
        bottom: 12px;
        width: calc(100vw - 24px);
      }

      button {
        flex: 1;
        padding: 10px 7px;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main id="scene" aria-label="Interactive 3D folding clothes drying rack"></main>

  <section class="info">
    <p class="eyebrow">Laundry Storage</p>
    <h1>Folding Drying Rack</h1>
    <p>
      Flat wooden A-frames, three notched drying rails, and a lower shelf
      that pivots outward on visible metal hinges.
    </p>
  </section>

  <nav class="controls" aria-label="Rack controls">
    <button id="shelfButton" class="primary" type="button">Close lower shelf</button>
    <button id="resetButton" type="button">Reset view</button>
  </nav>

  <div class="hint">Drag to orbit · Scroll or pinch to zoom</div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const container = document.getElementById("scene");

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.domElement.setAttribute(
      "aria-label",
      "Three-dimensional folding clothes drying rack"
    );
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe8eef1);
    scene.fog = new THREE.Fog(0xe8eef1, 8, 18);

    const camera = new THREE.PerspectiveCamera(
      36,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    const target = new THREE.Vector3(0, 1.45, 0);
    const spherical = new THREE.Spherical(5.5, 1.37, 0.72);

    function updateCamera() {
      camera.position.setFromSpherical(spherical).add(target);
      camera.lookAt(target);
    }

    updateCamera();

    // Procedural wood texture: no external image assets.
    function createWoodTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#c78a4d");
      gradient.addColorStop(0.5, "#b9783f");
      gradient.addColorStop(1, "#ca9258");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 170; i++) {
        const baseY = Math.random() * canvas.height;
        const amplitude = 1 + Math.random() * 7;
        const frequency = 0.006 + Math.random() * 0.012;
        const phase = Math.random() * Math.PI * 2;

        ctx.beginPath();
        for (let x = 0; x <= canvas.width; x += 12) {
          const y =
            baseY +
            Math.sin(x * frequency + phase) * amplitude +
            Math.sin(x * frequency * 0.37 + phase) * amplitude * 0.45;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.strokeStyle = `rgba(83, 39, 15, ${0.035 + Math.random() * 0.08})`;
        ctx.lineWidth = 0.5 + Math.random() * 1.5;
        ctx.stroke();
      }

      for (let i = 0; i < 8; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const radius = 8 + Math.random() * 22;

        for (let ring = 0; ring < 4; ring++) {
          ctx.beginPath();
          ctx.ellipse(
            x,
            y,
            radius + ring * 5,
            (radius + ring * 5) * 0.28,
            Math.random() * 0.2,
            0,
            Math.PI * 2
          );
          ctx.strokeStyle = `rgba(78, 35, 12, ${0.12 - ring * 0.02})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1.2, 1.2);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const woodTexture = createWoodTexture();

    const wood = new THREE.MeshStandardMaterial({
      map: woodTexture,
      color: 0xffffff,
      roughness: 0.68,
      metalness: 0
    });

    const darkWood = new THREE.MeshStandardMaterial({
      map: woodTexture,
      color: 0x9c6338,
      roughness: 0.72,
      metalness: 0
    });

    const metal = new THREE.MeshStandardMaterial({
      color: 0x707b80,
      roughness: 0.3,
      metalness: 0.82
    });

    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x3c484d,
      roughness: 0.38,
      metalness: 0.75
    });

    const boltMaterial = new THREE.MeshStandardMaterial({
      color: 0xb7bec0,
      roughness: 0.24,
      metalness: 0.9
    });

    function addBox(parent, size, position, material, rotation = null) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        material
      );
      mesh.position.copy(position);
      if (rotation) mesh.rotation.set(rotation.x, rotation.y, rotation.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Creates a rounded rectangular prism.
    function roundedRectShape(width, depth, radius) {
      const w = width / 2;
      const d = depth / 2;
      const r = Math.min(radius, w, d);
      const shape = new THREE.Shape();

      shape.moveTo(-w + r, -d);
      shape.lineTo(w - r, -d);
      shape.quadraticCurveTo(w, -d, w, -d + r);
      shape.lineTo(w, d - r);
      shape.quadraticCurveTo(w, d, w - r, d);
      shape.lineTo(-w + r, d);
      shape.quadraticCurveTo(-w, d, -w, d - r);
      shape.lineTo(-w, -d + r);
      shape.quadraticCurveTo(-w, -d, -w + r, -d);
      return shape;
    }

    function roundedPrismGeometry(width, depth, height, radius = 0.08) {
      const shape = roundedRectShape(width, depth, radius);
      const bevel = Math.min(0.025, height * 0.2);

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: height,
        steps: 1,
        curveSegments: 10,
        bevelEnabled: true,
        bevelSegments: 3,
        bevelSize: bevel,
        bevelThickness: bevel
      });

      geometry.rotateX(Math.PI / 2);
      geometry.translate(0, height / 2, 0);
      geometry.computeVertexNormals();
      return geometry;
    }

    // Creates a rail with genuine U-shaped notches cut into the top.
    function createNotchedRailGeometry(length, height, depth, notchCount) {
      const halfLength = length / 2;
      const halfDepth = depth / 2;
      const spacing = (length - depth) / notchCount;
      const shape = new THREE.Shape();

      shape.moveTo(-halfDepth, -height / 2);
      shape.lineTo(halfDepth, -height / 2);
      shape.lineTo(halfDepth, height / 2);

      // Traverse the top edge from right to left, forming each notch.
      for (let i = notchCount - 1; i >= 0; i--) {
        const centerX = (i - (notchCount - 1) / 2) * spacing;
        const notchRadius = depth / 2;

        shape.lineTo(centerX + notchRadius, height / 2);
        shape.lineTo(centerX, height / 2 - depth / 2);
        shape.quadraticCurveTo(
          centerX,
          height / 2 - depth,
          centerX + notchRadius,
          height / 2 - depth / 2
        );
        shape.lineTo(centerX - notchRadius, height / 2);
      }

      shape.lineTo(-halfDepth, height / 2);
      shape.closePath();

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.12,
        steps: 1,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: 0.008,
        bevelThickness: 0.008
      });

      geometry.rotateY(Math.PI / 2);
      geometry.translate(-0.06, 0, 0);
      geometry.computeVertexNormals();
      return geometry;
    }

    function beamBetween(start, end, thickness, width, material) {
      const direction = end.clone().sub(start);
      const length = direction.length();
      const geometry = new THREE.BoxGeometry(thickness, length, width);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function cylinderAlongX(radius, length, material, radialSegments = 20) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radius,
          radius,
          length,
          radialSegments
        ),
        material
      );
      mesh.rotation.z = Math.PI / 2;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // Ground.
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xdde5e7,
        roughness: 0.93,
        metalness: 0
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.015;
    floor.receiveShadow = true;
    scene.add(floor);

    // Lighting.
    scene.add(new THREE.HemisphereLight(0xf4fbff, 0x8a7257, 2.15));

    const keyLight = new THREE.DirectionalLight(0xfff6e9, 3.5);
    keyLight.position.set(4.5, 7, 4.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -4;
    keyLight.shadow.camera.right = 4;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -2;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 15;
    keyLight.shadow.bias = -0.0003;
    keyLight.shadow.normalBias = 0.025;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc8e1ef, 1.35);
    fillLight.position.set(-4, 3.5, -3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.1);
    rimLight.position.set(1, 4, -5);
    scene.add(rimLight);

    // Two flat-wood A-frame side supports.
    const rack = new THREE.Group();
    scene.add(rack);

    const frameX = 1.04;
    const top = new THREE.Vector3(0, 2.86, 0);
    const footFront = new THREE.Vector3(0, 0.13, 0.84);
    const footBack = new THREE.Vector3(0, 0.13, -0.84);

    for (const side of [-1, 1]) {
      const x = side * frameX;

      const leftSlat = beamBetween(
        new THREE.Vector3(x, 0.13, -0.84),
        top,
        0.145,
        0.19,
        wood
      );
      const rightSlat = beamBetween(
        new THREE.Vector3(x, 0.13, 0.84),
        top,
        0.145,
        0.19,
        wood
      );

      rack.add(leftSlat, rightSlat);

      addBox(
        rack,
        new THREE.Vector3(0.22, 0.18, 0.23),
        new THREE.Vector3(x, 0.08, 0.84),
        darkWood
      );
      addBox(
        rack,
        new THREE.Vector3(0.22, 0.18, 0.23),
        new THREE.Vector3(x, 0.08, -0.84),
        darkWood
      );

      addBox(
        rack,
        new THREE.Vector3(0.21, 0.18, 0.23),
        new THREE.Vector3(x, 2.86, 0),
        darkWood
      );

      // Visible bolt heads on the outside of each slat.
      for (const t of [0.22, 0.78]) {
        const point = new THREE.Vector3().lerpVectors(footFront, top, t);
        const bolt = cylinderAlongX(
          0.035,
          0.055,
          boltMaterial,
          6
        );
        bolt.position.set(side * (frameX + 0.095), point.y, point.z);
        rack.add(bolt);
      }
    }

    // Three slender rounded drying rails.
    const railHeights = [1.96, 1.32, 0.69];

    for (const y of railHeights) {
      const rail = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.06, 1.62, 6, 12),
        wood
      );
      rail.rotation.z = Math.PI / 2;
      rail.scale.x = 1.15;
      rail.position.set(0, y, 0);
      rail.castShadow = true;
      rail.receiveShadow = true;
      rack.add(rail);

      for (const side of [-1, 1]) {
        addBox(
          rack,
          new THREE.Vector3(0.13, 0.2, 0.31),
          new THREE.Vector3(side * 0.99, y, 0),
          darkMetal
        );
      }
    }

    // Lower hinged shelf.
    const shelfPivot = new THREE.Group();
    shelfPivot.position.set(0, 0.43, -0.72);
    scene.add(shelfPivot);

    const shelf = new THREE.Mesh(
      roundedPrismGeometry(1.84, 1.45, 0.1, 0.085),
      wood
    );
    shelf.position.z = 0.725;
    shelf.castShadow = true;
    shelf.receiveShadow = true;
    shelfPivot.add(shelf);

    // A folded towel on the lower shelf helps communicate its use.
    const towel = new THREE.Mesh(
      roundedPrismGeometry(1.12, 0.76, 0.11, 0.065),
      new THREE.MeshStandardMaterial({
        color: 0x7899a5,
        roughness: 0.95,
        metalness: 0
      })
    );
    towel.position.set(0, 0.115, 0.83);
    towel.rotation.y = -0.025;
    towel.castShadow = true;
    towel.receiveShadow = true;
    shelfPivot.add(towel);

    const towelFold = new THREE.Mesh(
      roundedPrismGeometry(0.68, 0.49, 0.055, 0.05),
      new THREE.MeshStandardMaterial({
        color: 0xd7d2c4,
        roughness: 0.96,
        metalness: 0
      })
    );
    towelFold.position.set(-0.08, 0.195, 0.83);
    towelFold.rotation.y = 0.018;
    towelFold.castShadow = true;
    shelfPivot.add(towelFold);

    // Two hinge assemblies with small plates and visible pins.
    for (const side of [-1, 1]) {
      const x = side * 0.72;

      addBox(
        rack,
        new THREE.Vector3(0.045, 0.27, 0.32),
        new THREE.Vector3(x, 0.43, -0.72),
        metal
      );

      const pin = cylinderAlongX(0.043, 0.29, boltMaterial);
      pin.position.set(side * 0.76, 0.43, -0.72);
      rack.add(pin);

      for (const y of [0.355, 0.43, 0.505]) {
        const knuckle = cylinderAlongX(0.047, 0.19, metal);
        knuckle.position.set(side * 0.73, y, -0.72);
        rack.add(knuckle);
      }
    }

    // Custom orbit controls implemented directly, without Three.js addons.
    const pointers = new Map();
    let lastPinchDistance = 0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    function pointerDistance() {
      const values = [...pointers.values()];
      if (values.length < 2) return 0;
      return Math.hypot(
        values[0].x - values[1].x,
        values[0].y - values[1].y
      );
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      renderer.domElement.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (pointers.size === 1) {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
      } else if (pointers.size === 2) {
        dragging = false;
        lastPinchDistance = pointerDistance();
      }
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!pointers.has(event.pointerId)) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (pointers.size === 2) {
        const distance = pointerDistance();
        if (lastPinchDistance > 0 && distance > 0) {
          spherical.radius = THREE.MathUtils.clamp(
            spherical.radius * (lastPinchDistance / distance),
            3.4,
            9
          );
          updateCamera();
        }
        lastPinchDistance = distance;
        return;
      }

      if (!dragging) return;

      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      lastX = event.clientX;
      lastY = event.clientY;

      spherical.theta -= dx * 0.006;
      spherical.phi = THREE.MathUtils.clamp(
        spherical.phi - dy * 0.006,
        0.42,
        1.49
      );
      updateCamera();
    });

    function releasePointer(event) {
      pointers.delete(event.pointerId);
      if (pointers.size === 0) dragging = false;
      if (pointers.size < 2) lastPinchDistance = 0;
    }

    renderer.domElement.addEventListener("pointerup", releasePointer);
    renderer.domElement.addEventListener("pointercancel", releasePointer);
    renderer.domElement.addEventListener("lostpointercapture", releasePointer);

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        spherical.radius = THREE.MathUtils.clamp(
          spherical.radius * Math.exp(event.deltaY * 0.001),
          3.4,
          9
        );
        updateCamera();
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("dblclick", resetCamera);

    function resetCamera() {
      target.set(0, 1.45, 0);
      spherical.set(5.5, 1.37, 0.72);
      updateCamera();
    }

    // Shelf animation.
    const shelfButton = document.getElementById("shelfButton");
    const resetButton = document.getElementById("resetButton");

    let shelfOpen = true;
    let shelfTargetAngle = -0.38;
    let shelfAngle = shelfTargetAngle;

    shelfButton.addEventListener("click", () => {
      shelfOpen = !shelfOpen;
      shelfTargetAngle = shelfOpen ? -0.38 : 0;
      shelfButton.textContent = shelfOpen
        ? "Close lower shelf"
        : "Open lower shelf";
    });

    resetButton.addEventListener("click", resetCamera);

    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        shelfButton.click();
      }
      if (event.key.toLowerCase() === "r") resetCamera();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      shelfAngle = THREE.MathUtils.lerp(
        shelfAngle,
        shelfTargetAngle,
        0.085
      );
      shelfPivot.rotation.x = shelfAngle;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
