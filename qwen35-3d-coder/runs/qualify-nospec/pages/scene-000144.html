<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ground-Mounted Photovoltaic Module</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dce5e8;
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    #scene:active {
      cursor: grabbing;
    }

    .title-card {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      max-width: min(360px, calc(100vw - 44px));
      padding: 16px 18px;
      color: #17252b;
      background: rgba(249, 252, 252, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(29, 48, 55, 0.14);
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: #527078;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #60747b;
      font-size: 13px;
      line-height: 1.45;
    }

    .views {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 10;
      display: flex;
      gap: 7px;
      padding: 7px;
      background: rgba(249, 252, 252, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(29, 48, 55, 0.13);
      backdrop-filter: blur(12px);
    }

    .views button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      color: #52666d;
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }

    .views button:hover,
    .views button:focus-visible {
      color: #173039;
      background: #e8eef0;
      outline: none;
    }

    .help {
      position: fixed;
      left: 22px;
      bottom: 20px;
      z-index: 10;
      padding: 9px 12px;
      color: #53676e;
      background: rgba(249, 252, 252, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 9px;
      box-shadow: 0 8px 24px rgba(29, 48, 55, 0.1);
      backdrop-filter: blur(10px);
      font-size: 11px;
      pointer-events: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      color: #466069;
      background: #dce5e8;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: opacity 400ms ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 650px) {
      .title-card {
        top: 12px;
        left: 12px;
        padding: 12px 14px;
      }

      .subtitle {
        display: none;
      }

      .views {
        top: auto;
        right: 12px;
        bottom: 12px;
      }

      .help {
        left: 12px;
        bottom: 64px;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Interactive 3D model of a ground-mounted photovoltaic module"></canvas>

  <section class="title-card">
    <div class="eyebrow">Renewable Energy Systems</div>
    <h1>Ground-Mounted PV Module</h1>
    <p class="subtitle">
      Tilted photovoltaic array with two aluminum rails, four threaded support struts,
      and paired concrete footings.
    </p>
  </section>

  <nav class="views" aria-label="Camera views">
    <button type="button" data-view="iso">Isometric</button>
    <button type="button" data-view="front">Front</button>
    <button type="button" data-view="service">Service</button>
  </nav>

  <div class="help">
    Drag to orbit · Shift/right-drag to pan · Scroll to zoom
  </div>

  <div id="loading">Building photovoltaic assembly…</div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const canvas = document.querySelector("#scene");
    const loading = document.querySelector("#loading");

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce5e8);
    scene.fog = new THREE.Fog(0xdce5e8, 16, 36);

    const camera = new THREE.PerspectiveCamera(
      43,
      window.innerWidth / window.innerHeight,
      0.05,
      100
    );

    const target = new THREE.Vector3(0, 2.35, 0);
    const spherical = new THREE.Spherical().setFromVector3(
      camera.position.clone().sub(target)
    );

    function updateCamera() {
      const offset = new THREE.Vector3().setFromSpherical(spherical);
      camera.position.copy(target).add(offset);
      camera.lookAt(target);
    }

    updateCamera();

    // Lighting
    const hemisphere = new THREE.HemisphereLight(0xf5fbff, 0x687068, 2.15);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0xfff7e9, 3.1);
    sun.position.set(-6, 10, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 25;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xc8e2ff, 0.8);
    fill.position.set(7, 5, -6);
    scene.add(fill);

    // Materials
    const silverMaterial = new THREE.MeshStandardMaterial({
      color: 0xb9c2c7,
      metalness: 0.88,
      roughness: 0.24
    });

    const aluminumMaterial = new THREE.MeshStandardMaterial({
      color: 0x8e9ba1,
      metalness: 0.78,
      roughness: 0.3
    });

    const steelMaterial = new THREE.MeshStandardMaterial({
      color: 0x4e5960,
      metalness: 0.72,
      roughness: 0.34
    });

    const darkMetalMaterial = new THREE.MeshStandardMaterial({
      color: 0x252d31,
      metalness: 0.48,
      roughness: 0.4
    });

    const knobMaterial = new THREE.MeshStandardMaterial({
      color: 0x171d20,
      metalness: 0.2,
      roughness: 0.58
    });

    const cableMaterial = new THREE.MeshStandardMaterial({
      color: 0x15191b,
      metalness: 0.08,
      roughness: 0.76
    });

    // Procedural concrete texture; no external image assets are required.
    function createConcreteTexture() {
      const size = 256;
      const concreteCanvas = document.createElement("canvas");
      concreteCanvas.width = concreteCanvas.height = size;
      const context = concreteCanvas.getContext("2d");

      context.fillStyle = "#a8a79f";
      context.fillRect(0, 0, size, size);

      for (let i = 0; i < 4200; i++) {
        const value = 115 + Math.floor(Math.random() * 85);
        const alpha = 0.025 + Math.random() * 0.08;
        const radius = 0.3 + Math.random() * 2.2;
        context.fillStyle = `rgba(${value},${value},${value - 4},${alpha})`;
        context.beginPath();
        context.arc(
          Math.random() * size,
          Math.random() * size,
          radius,
          0,
          Math.PI * 2
        );
        context.fill();
      }

      const texture = new THREE.CanvasTexture(concreteCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 2);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    // Procedural photovoltaic cell grid.
    function createPVTexture() {
      const width = 1024;
      const height = 640;
      const pvCanvas = document.createElement("canvas");
      pvCanvas.width = width;
      pvCanvas.height = height;
      const context = pvCanvas.getContext("2d");

      context.fillStyle = "#071a36";
      context.fillRect(0, 0, width, height);

      const columns = 16;
      const rows = 10;
      const cellWidth = width / columns;
      const cellHeight = height / rows;

      for (let row = 0; row < rows; row++) {
        for (let column = 0; column < columns; column++) {
          const x = column * cellWidth;
          const y = row * cellHeight;
          const tint = 35 + Math.floor(Math.random() * 25);
          const blue = 8 + tint;
          const green = 24 + tint * 0.55;

          context.fillStyle = `rgb(${blue},${green},${112 + tint})`;
          context.fillRect(x + 3, y + 3, cellWidth - 6, cellHeight - 6);

          context.strokeStyle = "rgba(135, 190, 225, 0.16)";
          context.lineWidth = 1;
          context.strokeRect(x + 4, y + 4, cellWidth - 8, cellHeight - 8);

          // Fine bus bars give the cells a photovoltaic appearance.
          for (let bus = 0; bus < 3; bus++) {
            context.strokeStyle = "rgba(145, 205, 235, 0.11)";
            context.beginPath();
            context.moveTo(x + 5 + bus * 8, y + 5);
            context.lineTo(x + cellWidth - 5 - bus * 8, y + cellHeight);
            context.stroke();
          }
        }
      }

      const texture = new THREE.CanvasTexture(pvCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const concreteMaterial = new THREE.MeshStandardMaterial({
      map: createConcreteTexture(),
      color: 0xffffff,
      roughness: 0.94,
      metalness: 0.01
    });

    const pvMaterial = new THREE.MeshPhysicalMaterial({
      map: createPVTexture(),
      color: 0xffffff,
      metalness: 0.08,
      roughness: 0.25,
      clearcoat: 0.55,
      clearcoatRoughness: 0.2
    });

    // Ground
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0xaeb7b7,
      roughness: 0.96,
      metalness: 0
    });

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      groundMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(24, 48, 0x718187, 0x9ca6a8);
    grid.position.y = 0.006;
    grid.material.transparent = true;
    grid.material.opacity = 0.13;
    scene.add(grid);

    // Utility helpers
    const Y_AXIS = new THREE.Vector3(0, 1, 0);

    function cylinderBetween(parent, start, end, radius, material, radialSegments = 18) {
      const direction = end.clone().sub(start);
      const length = direction.length();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material
      );

      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(Y_AXIS, direction.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    class HelixCurve extends THREE.Curve {
      constructor(radius, height, turns) {
        super();
        this.radius = radius;
        this.height = height;
        this.turns = turns;
      }

      getPoint(t, target = new THREE.Vector3()) {
        const angle = t * this.turns * Math.PI * 2;
        return target.set(
          Math.cos(angle) * this.radius,
          t * this.height,
          Math.sin(angle) * this.radius
        );
      }
    }

    function addFooting(x) {
      const group = new THREE.Group();
      group.position.x = x;
      scene.add(group);

      const block = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.36, 1.0),
        concreteMaterial
      );
      block.position.y = 0.18;
      block.castShadow = true;
      block.receiveShadow = true;
      group.add(block);

      const cap = new THREE.Mesh(
        new THREE.BoxGeometry(1.04, 0.08, 1.12),
        concreteMaterial
      );
      cap.position.y = 0.37;
      cap.castShadow = true;
      cap.receiveShadow = true;
      group.add(cap);

      const basePlate = new THREE.Mesh(
        new THREE.BoxGeometry(0.36, 0.06, 0.36),
        steelMaterial
      );
      basePlate.position.y = 0.46;
      basePlate.castShadow = true;
      group.add(basePlate);

      for (const boltX of [-0.12, 0.12]) {
        for (const boltZ of [-0.12, 0.12]) {
          const bolt = new THREE.Mesh(
            new THREE.CylinderGeometry(0.035, 0.035, 0.035, 6),
            steelMaterial
          );
          bolt.position.set(boltX, 0.505, boltZ);
          bolt.castShadow = true;
          group.add(bolt);
        }
      }
    }

    addFooting(-1.78);
    addFooting(1.78);

    // Photovoltaic module
    const panelGroup = new THREE.Group();
    panelGroup.position.set(0, 3.65, 0);
    panelGroup.rotation.x = -0.32;
    scene.add(panelGroup);

    const moduleWidth = 3.8;
    const moduleHeight = 2.4;

    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(moduleWidth + 0.2, moduleHeight + 0.2, 0.14),
      silverMaterial
    );
    frame.castShadow = true;
    frame.receiveShadow = true;
    panelGroup.add(frame);

    const cellPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(moduleWidth - 0.12, moduleHeight - 0.12),
      pvMaterial
    );
    cellPlane.position.z = 0.076;
    cellPlane.receiveShadow = true;
    panelGroup.add(cellPlane);

    const backPlate = new THREE.Mesh(
      new THREE.BoxGeometry(moduleWidth - 0.1, moduleHeight - 0.1, 0.035),
      darkMetalMaterial
    );
    backPlate.position.z = -0.086;
    panelGroup.add(backPlate);

    function addScrew(parent, x, y, z, back = false) {
      const screw = new THREE.Mesh(
        new THREE.CylinderGeometry(0.034, 0.034, 0.025, 12),
        steelMaterial
      );
      screw.position.set(x, y, z);
      screw.rotation.x = back ? -Math.PI / 2 : Math.PI / 2;
      screw.castShadow = true;
      parent.add(screw);
    }

    for (const x of [-moduleWidth / 2, moduleWidth / 2]) {
      for (const y of [-moduleHeight / 2, moduleHeight / 2]) {
        addScrew(panelGroup, x, y, 0.081);
        addScrew(panelGroup, x, y, -0.102, true);
      }
    }

    // Junction box mounted to the rear of the module.
    const junctionBody = new THREE.Mesh(
      new THREE.BoxGeometry(0.56, 0.43, 0.19),
      darkMetalMaterial
    );
    junctionBody.position.set(0.76, -0.04, -0.205);
    junctionBody.castShadow = true;
    panelGroup.add(junctionBody);

    const junctionLid = new THREE.Mesh(
      new THREE.BoxGeometry(0.59, 0.04, 0.21),
      steelMaterial
    );
    junctionLid.position.set(0.76, 0.205, -0.205);
    junctionLid.castShadow = true;
    panelGroup.add(junctionLid);

    addScrew(panelGroup, 0.61, 0.16, -0.312, true);
    addScrew(panelGroup, 0.91, 0.16, -0.312, true);

    // A short rear conduit makes the junction-box connection legible in service view.
    panelGroup.updateMatrixWorld(true);
    const conduitStart = panelGroup.localToWorld(
      new THREE.Vector3(0.76, -0.25, -0.30)
    );

    const conduitCurve = new THREE.CatmullRomCurve3([
      conduitStart,
      new THREE.Vector3(1.02, 3.28, -0.64),
      new THREE.Vector3(1.28, 2.45, -0.94),
      new THREE.Vector3(1.43, 0.95, -1.02),
      new THREE.Vector3(1.52, 0.1, -0.82)
    ]);

    const conduit = new THREE.Mesh(
      new THREE.TubeGeometry(conduitCurve, 48, 0.026, 8, false),
      cableMaterial
    );
    conduit.castShadow = true;
    scene.add(conduit);

    // Two longitudinal support rails.
    const railGeometry = new THREE.BoxGeometry(4.28, 0.12, 0.13);
    const clampGeometry = new THREE.BoxGeometry(0.28, 0.24, 0.24);

    for (const railZ of [-0.7, 0.7]) {
      const rail = new THREE.Mesh(railGeometry, aluminumMaterial);
      rail.position.set(0, 0.05, railZ);
      rail.castShadow = true;
      rail.receiveShadow = true;
      panelGroup.add(rail);

      for (const x of [-1.62, 1.62]) {
        const clamp = new THREE.Mesh(clampGeometry, steelMaterial);
        clamp.position.set(x, 0.05, railZ);
        clamp.castShadow = true;
        clamp.receiveShadow = true;
        panelGroup.add(clamp);
      }
    }

    panelGroup.updateMatrixWorld(true);

    // Four individually adjustable, threaded support struts.
    function createAdjustableStrut(top, bottom) {
      const group = new THREE.Group();
      scene.add(group);

      const direction = top.clone().sub(bottom);
      const totalLength = direction.length();
      direction.normalize();

      const lowerTop = bottom.clone().lerp(top, 0.58);
      const upperStart = bottom.clone().lerp(top, 0.48);

      cylinderBetween(
        group,
        bottom.clone().add(new THREE.Vector3(0, 0.025, 0)),
        lowerTop,
        0.075,
        aluminumMaterial
      );

      cylinderBetween(
        group,
        upperStart,
        top,
        0.055,
        steelMaterial
      );

      // Threaded section of the upper tube.
      const threadLength = totalLength * 0.44;
      const thread = new THREE.Mesh(
        new THREE.TubeGeometry(
          new HelixCurve(0.077, threadLength, 18),
          140,
          0.011,
          6,
          false
        ),
        darkMetalMaterial
      );
      thread.position.copy(lowerTop);
      thread.quaternion.setFromUnitVectors(Y_AXIS, direction);
      thread.castShadow = true;
      group.add(thread);

      // Collar at the telescoping joint.
      cylinderBetween(
        group,
        lowerTop.clone().addScaledVector(direction, -0.055),
        lowerTop.clone().addScaledVector(direction, 0.055),
        0.095,
        darkMetalMaterial
      );

      // Base plate and anchor bolt.
      const basePlate = new THREE.Mesh(
        new THREE.BoxGeometry(0.34, 0.055, 0.34),
        steelMaterial
      );
      basePlate.position.copy(bottom).add(new THREE.Vector3(0, 0.025, 0));
      basePlate.castShadow = true;
      group.add(basePlate);

      const anchor = new THREE.Mesh(
        new THREE.CylinderGeometry(0.045, 0.045, 0.045, 6),
        steelMaterial
      );
      anchor.position.copy(bottom).add(new THREE.Vector3(0, 0.06, 0));
      anchor.castShadow = true;
      group.add(anchor);

      // Adjustable top knob and wing.
      const knob = new THREE.Group();
      knob.position.copy(top);
      knob.quaternion.setFromUnitVectors(Y_AXIS, direction);
      group.add(knob);

      const knobBody = new THREE.Mesh(
        new THREE.CylinderGeometry(0.115, 0.115, 0.13, 18),
        knobMaterial
      );
      knobBody.position.y = 0.065;
      knobBody.castShadow = true;
      knob.add(knobBody);

      const knobWing = new THREE.Mesh(
        new THREE.BoxGeometry(0.34, 0.065, 0.1),
        knobMaterial
      );
      knobWing.position.set(0.17, 0.065, 0);
      knobWing.castShadow = true;
      knob.add(knobWing);

      // Short connector into the rail.
      cylinderBetween(
        group,
        top,
        top.clone().addScaledVector(direction, 0.1),
        0.07,
        steelMaterial
      );
    }

    for (const x of [-1.62, 1.62]) {
      for (const railZ of [-0.7, 0.7]) {
        const top = panelGroup.localToWorld(
          new THREE.Vector3(x, 0.16, railZ)
        );

        createAdjustableStrut(
          top,
          new THREE.Vector3(x, 0.49, railZ * 0.58)
        );
      }
    }

    // Direct camera controls: orbit, pan, wheel zoom, and touch pinch.
    const pointers = new Map();
    let dragMode = "orbit";
    let lastX = 0;
    let lastY = 0;
    let lastPinchDistance = 0;
    let cameraTween = null;

    function panCamera(dx, dy) {
      camera.updateMatrixWorld();

      const right = new THREE.Vector3().setFromMatrixColumn(
        camera.matrixWorld,
        0
      );
      const up = new THREE.Vector3().setFromMatrixColumn(
        camera.matrixWorld,
        1
      );
      const scale = spherical.radius * 0.00145;

      target.addScaledVector(right, -dx * scale);
      target.addScaledVector(up, dy * scale);

      target.x = THREE.MathUtils.clamp(target.x, -4, 4);
      target.y = THREE.MathUtils.clamp(target.y, 0.6, 5.2);
      target.z = THREE.MathUtils.clamp(target.z, -3, 3);
    }

    function pointerDistance() {
      const values = [...pointers.values()];
      if (values.length < 2) return 0;
      return Math.hypot(
        values[0].x - values[1].x,
        values[0].y - values[1].y
      );
    }

    canvas.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    canvas.addEventListener("pointerdown", (event) => {
      cameraTween = null;
      canvas.setPointerCapture(event.pointerId);

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (pointers.size === 1) {
        dragMode = event.button === 2 || event.shiftKey ? "pan" : "orbit";
        lastX = event.clientX;
        lastY = event.clientY;
      } else if (pointers.size === 2) {
        dragMode = "pinch";
        lastPinchDistance = pointerDistance();
      }
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!pointers.has(event.pointerId)) return;

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (pointers.size === 1) {
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        lastX = event.clientX;
        lastY = event.clientY;

        if (dragMode === "pan") {
          panCamera(dx, dy);
        } else {
          spherical.theta -= dx * 0.006;
          spherical.phi = THREE.MathUtils.clamp(
            spherical.phi - dy * 0.005,
            0.18,
            Math.PI / 2 - 0.025
          );
        }
      } else if (pointers.size === 2) {
        const distance = pointerDistance();
        if (lastPinchDistance > 0 && distance > 0) {
          spherical.radius = THREE.MathUtils.clamp(
            spherical.radius * (lastPinchDistance / distance),
            4.5,
            22
          );
        }
        lastPinchDistance = distance;
      }
    });

    function releasePointer(event) {
      pointers.delete(event.pointerId);

      if (pointers.size === 1) {
        const remaining = [...pointers.values()][0];
        lastX = remaining.x;
        lastY = remaining.y;
        dragMode = "orbit";
      } else if (pointers.size === 0) {
        dragMode = "orbit";
      }
    }

    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);

    canvas.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        cameraTween = null;
        spherical.radius = THREE.MathUtils.clamp(
          spherical.radius * Math.exp(event.deltaY * 0.001),
          4.5,
          22
        );
      },
      { passive: false }
    );

    function setView(position, lookTarget) {
      cameraTween = {
        start: performance.now(),
        fromSpherical: spherical.clone(),
        toSpherical: new THREE.Spherical().setFromVector3(
          position.clone().sub(lookTarget)
        ),
        fromTarget: target.clone(),
        toTarget: lookTarget.clone()
      };
    }

    const views = {
      iso: {
        position: new THREE.Vector3(7.4, 5.4, 9.2),
        target: new THREE.Vector3(0, 2.35, 0)
      },
      front: {
        position: new THREE.Vector3(0, 4.7, 10.8),
        target: new THREE.Vector3(0, 2.75, 0)
      },
      service: {
        position: new THREE.Vector3(-6.8, 3.7, -8.8),
        target: new THREE.Vector3(0, 2.75, 0)
      }
    };

    document.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => {
        const view = views[button.dataset.view];
        setView(view.position, view.target);
      });
    });

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      let handled = true;

      if (key === "arrowleft") spherical.theta += 0.08;
      else if (key === "arrowright") spherical.theta -= 0.08;
      else if (key === "arrowup") {
        spherical.phi = THREE.MathUtils.clamp(spherical.phi - 0.06, 0.18, 1.5);
      } else if (key === "arrowdown") {
        spherical.phi = THREE.MathUtils.clamp(spherical.phi + 0.06, 0.18, 1.5);
      } else if (key === "+" || key === "=") {
        spherical.radius = Math.max(4.5, spherical.radius * 0.9);
      } else if (key === "-") {
        spherical.radius = Math.min(22, spherical.radius * 1.1);
      } else if (key === "r") {
        setView(views.iso.position, views.iso.target);
      } else {
        handled = false;
      }

      if (handled) {
        event.preventDefault();
        cameraTween = null;
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let firstFrame = true;

    function animate(now) {
      requestAnimationFrame(animate);

      if (cameraTween) {
        const progress = Math.min(1, (now - cameraTween.start) / 1100);
        const eased = progress * progress * (3 - 2 * progress);

        spherical.copy(cameraTween.fromSpherical).lerp(
          cameraTween.toSpherical,
          eased
        );
        target.lerpVectors(
          cameraTween.fromTarget,
          cameraTween.toTarget,
          eased
        );

        const offset = new THREE.Vector3().setFromSpherical(spherical);
        camera.position.copy(target).add(offset);
        camera.lookAt(target);

        if (progress >= 1) cameraTween = null;
      }

      updateCamera();
      renderer.render(scene, camera);

      if (firstFrame) {
        firstFrame = false;
        loading.classList.add("hidden");
        setTimeout(() => loading.remove(), 450);
      }
    }

    requestAnimationFrame(animate);
  </script>
