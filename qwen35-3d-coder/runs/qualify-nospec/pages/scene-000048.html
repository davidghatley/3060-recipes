<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bamboo Box Kite</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #26332f;
      --muted: #60706a;
      --glass: rgba(255, 253, 246, 0.76);
      --line: rgba(38, 51, 47, 0.16);
      --accent: #b95c3f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 24% 12%, rgba(255, 247, 218, 0.9), transparent 28%),
        linear-gradient(180deg, #b9dce9 0%, #dce9e5 52%, #eddfbd 100%);
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      outline: none;
    }

    #scene canvas.dragging {
      cursor: grabbing;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 25%),
        radial-gradient(circle at center, transparent 55%, rgba(42, 57, 51, 0.12) 100%);
    }

    .heading {
      position: fixed;
      top: clamp(20px, 4vw, 48px);
      left: clamp(20px, 4vw, 52px);
      pointer-events: none;
      max-width: 360px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 300px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: clamp(0.86rem, 1.3vw, 1.12rem);
      line-height: 1.55;
    }

    .hint {
      position: fixed;
      top: clamp(20px, 4vw, 42px);
      right: clamp(20px, 4vw, 48px);
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: none;
    }

    .controls {
      position: fixed;
      right: clamp(16px, 3vw, 38px);
      bottom: clamp(16px, 3vw, 32px);
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--glass);
      box-shadow: 0 14px 40px rgba(42, 57, 51, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 13px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 750;
      cursor: pointer;
      transition:
        background 160ms ease,
        transform 160ms ease,
        border-color 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--line);
      background: white;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button[aria-pressed="true"] {
      border-color: rgba(185, 92, 63, 0.25);
      background: rgba(185, 92, 63, 0.12);
      color: #813f2b;
    }

    .credit {
      position: fixed;
      left: clamp(20px, 4vw, 52px);
      bottom: clamp(20px, 4vw, 42px);
      color: rgba(38, 51, 47, 0.55);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #dce9e5;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: opacity 500ms ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 680px) {
      .heading {
        max-width: 250px;
      }

      .subtitle {
        display: none;
      }

      .hint {
        top: auto;
        right: auto;
        bottom: 78px;
        left: 20px;
      }

      .credit {
        display: none;
      }

      .controls {
        right: 16px;
        bottom: 16px;
        left: 16px;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <main id="scene" aria-label="Interactive three-dimensional bamboo box kite"></main>
  <div class="vignette" aria-hidden="true"></div>

  <header class="heading">
    <p class="eyebrow">A traditional wind craft</p>
    <h1>Bamboo<br>Box Kite</h1>
    <p class="subtitle">
      A hand-framed silk kite with woven bamboo ribs, a paper lattice,
      and a flowing striped tail.
    </p>
  </header>

  <div class="hint">Drag to orbit · Scroll to zoom · Double-click to reset</div>

  <nav class="controls" aria-label="Scene controls">
    <button id="reset" type="button">Reset view</button>
    <button id="orbit" type="button" aria-pressed="false">Auto orbit</button>
  </nav>

  <div class="credit">Procedural scene · Three.js</div>
  <div id="loading">Preparing the scene</div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const mount = document.querySelector("#scene");
    const loading = document.querySelector("#loading");
    const resetButton = document.querySelector("#reset");
    const orbitButton = document.querySelector("#orbit");

    // ------------------------------------------------------------
    // Renderer and scene
    // ------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.domElement.setAttribute(
      "aria-label",
      "Bamboo box kite. Drag to orbit and scroll to zoom."
    );
    mount.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xc8dce6, 19, 43);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    // ------------------------------------------------------------
    // Custom camera controls
    // ------------------------------------------------------------

    const controls = {
      target: new THREE.Vector3(0, -0.18, 0),
      radius: 11.7,
      phi: 1.28,
      theta: 0.48,
      auto: false
    };

    const cameraOffset = new THREE.Vector3();

    function updateCamera() {
      cameraOffset.setFromSphericalCoords(
        controls.radius,
        controls.phi,
        controls.theta
      );
      camera.position.copy(controls.target).add(cameraOffset);
      camera.lookAt(controls.target);
    }

    function resetView() {
      controls.radius = 11.7;
      controls.phi = 1.28;
      controls.theta = 0.48;
      controls.target.set(0, -0.18, 0);
      updateCamera();
    }

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    const canvas = renderer.domElement;

    canvas.addEventListener("pointerdown", (event) => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add("dragging");
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const deltaX = event.clientX - lastX;
      const deltaY = event.clientY - lastY;

      lastX = event.clientX;
      lastY = event.clientY;

      controls.theta -= deltaX * 0.006;
      controls.phi = THREE.MathUtils.clamp(
        controls.phi + deltaY * 0.005,
        0.35,
        1.48
      );

      updateCamera();
    });

    function endDrag(event) {
      dragging = false;
      canvas.classList.remove("dragging");

      if (event.pointerId !== undefined && canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    }

    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    canvas.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        controls.radius = THREE.MathUtils.clamp(
          controls.radius * Math.exp(event.deltaY * 0.001),
          7,
          20
        );
        updateCamera();
      },
      { passive: false }
    );

    canvas.addEventListener("dblclick", resetView);

    window.addEventListener("keydown", (event) => {
      let handled = true;

      switch (event.key) {
        case "ArrowLeft":
          controls.theta += 0.08;
          break;
        case "ArrowRight":
          controls.theta -= 0.08;
          break;
        case "ArrowUp":
          controls.phi = THREE.MathUtils.clamp(controls.phi - 0.06, 0.35, 1.48);
          break;
        case "ArrowDown":
          controls.phi = THREE.MathUtils.clamp(controls.phi + 0.06, 0.35, 1.48);
          break;
        case "+":
        case "=":
          controls.radius = Math.max(7, controls.radius - 0.5);
          break;
        case "-":
          controls.radius = Math.min(20, controls.radius + 0.5);
          break;
        case "r":
        case "R":
          resetView();
          break;
        default:
          handled = false;
      }

      if (handled) {
        event.preventDefault();
        updateCamera();
      }
    });

    resetButton.addEventListener("click", resetView);

    orbitButton.addEventListener("click", () => {
      controls.auto = !controls.auto;
      orbitButton.setAttribute("aria-pressed", String(controls.auto));
      orbitButton.textContent = controls.auto ? "Stop orbit" : "Auto orbit";
    });

    updateCamera();

    // ------------------------------------------------------------
    // Lighting
    // ------------------------------------------------------------

    const hemisphere = new THREE.HemisphereLight(0xeaf7ff, 0x806444, 2.1);
    scene.add(hemisphere);

    const sunLight = new THREE.DirectionalLight(0xfff0cf, 3.2);
    sunLight.position.set(5.5, 10, 7);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -8;
    sunLight.shadow.camera.right = 8;
    sunLight.shadow.camera.top = 8;
    sunLight.shadow.camera.bottom = -8;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 30;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);
    scene.add(sunLight.target);

    const rimLight = new THREE.PointLight(0xffc987, 22, 18, 2);
    rimLight.position.set(-4, 2.5, 5);
    scene.add(rimLight);

    // ------------------------------------------------------------
    // Materials
    // ------------------------------------------------------------

    const bambooMaterial = new THREE.MeshStandardMaterial({
      color: 0xc99a4b,
      roughness: 0.58,
      metalness: 0.015
    });

    const bambooNodeMaterial = new THREE.MeshStandardMaterial({
      color: 0x80552a,
      roughness: 0.72
    });

    const frontClothMaterial = new THREE.MeshStandardMaterial({
      color: 0xc85e43,
      roughness: 0.86,
      side: THREE.DoubleSide
    });

    const sideClothMaterial = new THREE.MeshStandardMaterial({
      color: 0x547785,
      roughness: 0.88,
      side: THREE.DoubleSide
    });

    const backClothMaterial = new THREE.MeshStandardMaterial({
      color: 0xb84d38,
      roughness: 0.9,
      side: THREE.DoubleSide
    });

    const latticeMaterial = new THREE.MeshStandardMaterial({
      color: 0xe0b968,
      roughness: 0.55
    });

    const stringMaterial = new THREE.MeshStandardMaterial({
      color: 0x493d31,
      roughness: 0.95
    });

    const flagMaterials = [
      new THREE.MeshStandardMaterial({
        color: 0xc84f3d,
        roughness: 0.9,
        side: THREE.DoubleSide
      }),
      new THREE.MeshStandardMaterial({
        color: 0xf0dfb4,
        roughness: 0.92,
        side: THREE.DoubleSide
      })
    ];

    // ------------------------------------------------------------
    // Geometry helpers
    // ------------------------------------------------------------

    function addBamboo(start, end, radius = 0.075, material = bambooMaterial) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();

      const geometry = new THREE.CylinderGeometry(
        radius,
        radius,
        length,
        12
      );

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function addBambooNode(position, direction, radius) {
      const geometry = new THREE.TorusGeometry(
        radius * 1.025,
        radius * 0.21,
        6,
        14
      );

      const node = new THREE.Mesh(geometry, bambooNodeMaterial);
      node.position.copy(position);
      node.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 0, 1),
        direction.clone().normalize()
      );
      node.castShadow = true;
      return node;
    }

    function addJoint(position, radius = 0.095) {
      const joint = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 12, 9),
        bambooNodeMaterial
      );
      joint.position.copy(position);
      joint.castShadow = true;
      return joint;
    }

    function makeSaggingPanel(width, height, sag = 0.025) {
      const geometry = new THREE.PlaneGeometry(width, height, 14, 10);
      const positions = geometry.attributes.position;

      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const y = positions.getY(i);

        const edgeX = Math.max(0, 1 - Math.pow(x / (width / 2), 2));
        const edgeY = Math.max(0, 1 - Math.pow(y / (height / 2), 2));

        positions.setZ(
          i,
          -sag * edgeX * edgeY
        );
      }

      geometry.computeVertexNormals();
      return geometry;
    }

    function addPanel(
      width,
      height,
      position,
      rotationY,
      material,
      sag = 0.025
    ) {
      const geometry = makeSaggingPanel(width, height, sag);
      const panel = new THREE.Mesh(geometry, material);
      panel.position.copy(position);
      panel.rotation.y = rotationY;
      panel.castShadow = true;
      panel.receiveShadow = true;
      return panel;
    }

    function addDashedLine(points, dashSize = 0.055, gapSize = 0.035) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineDashedMaterial({
        color: 0xf4c5a3,
        dashSize,
        gapSize,
        transparent: true,
        opacity: 0.62
      });

      const line = new THREE.Line(geometry, material);
      line.computeLineDistances();
      return line;
    }

    function makeTube(points, radius = 0.012) {
      const curve = new THREE.CatmullRomCurve3(points);
      const geometry = new THREE.TubeGeometry(
        curve,
        40,
        radius,
        5,
        false
      );

      const mesh = new THREE.Mesh(geometry, stringMaterial);
      mesh.castShadow = true;
      return mesh;
    }

    // ------------------------------------------------------------
    // Bamboo box kite
    // ------------------------------------------------------------

    const kite = new THREE.Group();
    kite.position.set(0, 1.05, 0);
    kite.rotation.set(0, -0.12, -0.055);
    scene.add(kite);

    const halfWidth = 2.1;
    const halfHeight = 1.175;
    const halfDepth = 0.54;
    const frontZ = 0.56;
    const backZ = -0.56;

    // Outer rectangular frame: front and back.
    kite.add(
      addBamboo(
        new THREE.Vector3(-halfWidth, halfHeight, frontZ),
        new THREE.Vector3(halfWidth, halfHeight, frontZ)
      ),
      addBamboo(
        new THREE.Vector3(halfWidth, halfHeight, frontZ),
        new THREE.Vector3(-halfWidth, halfHeight, frontZ)
      ),
      addBamboo(
        new THREE.Vector3(-halfWidth, -halfHeight, frontZ),
        new THREE.Vector3(halfWidth, -halfHeight, frontZ)
      ),
      addBamboo(
        new THREE.Vector3(halfWidth, -halfHeight, frontZ),
        new THREE.Vector3(-halfWidth, -halfHeight, frontZ)
      ),
      addBamboo(
        new THREE.Vector3(-halfWidth, halfHeight, backZ),
        new THREE.Vector3(halfWidth, halfHeight, backZ)
      ),
      addBamboo(
        new THREE.Vector3(halfWidth, halfHeight, backZ),
        new THREE.Vector3(-halfWidth, halfHeight, backZ)
      ),
      addBamboo(
        new THREE.Vector3(-halfWidth, -halfHeight, backZ),
        new THREE.Vector3(halfWidth, -halfHeight, backZ)
      ),
      addBamboo(
        new THREE.Vector3(halfWidth, -halfHeight, backZ),
        new THREE.Vector3(-halfWidth, -halfHeight, backZ)
      )
    );

    // Side frame.
    kite.add(
      addBamboo(
        new THREE.Vector3(-halfWidth, halfHeight, -halfDepth),
        new THREE.Vector3(-halfWidth, halfHeight, halfDepth)
      ),
      addBamboo(
        new THREE.Vector3(-halfWidth, -halfHeight, -halfDepth),
        new THREE.Vector3(-halfWidth, -halfHeight, halfDepth)
      ),
      addBamboo(
        new THREE.Vector3(halfWidth, halfHeight, -halfDepth),
        new THREE.Vector3(halfWidth, halfHeight, halfDepth)
      ),
      addBamboo(
        new THREE.Vector3(halfWidth, -halfHeight, -halfDepth),
        new THREE.Vector3(halfWidth, -halfHeight, halfDepth)
      ),
      addBamboo(
        new THREE.Vector3(-halfWidth, halfHeight, -halfDepth),
        new THREE.Vector3(-halfWidth, halfHeight, halfDepth)
      ),
      addBamboo(
        new THREE.Vector3(-halfWidth, -halfHeight, -halfDepth),
        new THREE.Vector3(-halfWidth, -halfHeight, halfDepth)
      ),
      addBamboo(
        new THREE.Vector3(halfWidth, halfHeight, -halfDepth),
        new THREE.Vector3(halfWidth, halfHeight, halfDepth)
      ),
      addBamboo(
        new THREE.Vector3(halfWidth, -halfHeight, -halfDepth),
        new THREE.Vector3(halfWidth, -halfHeight, halfDepth)
      )
    );

    // Internal ribs dividing the front and back into four panels.
    for (const z of [frontZ, backZ]) {
      kite.add(
        addBamboo(
          new THREE.Vector3(-0.72, -halfHeight, z),
          new THREE.Vector3(-0.72, halfHeight, z)
        ),
        addBamboo(
          new THREE.Vector3(0.72, -halfHeight, z),
          new THREE.Vector3(0.72, halfHeight, z)
        ),
        addBamboo(
          new THREE.Vector3(-0.72, -0.43, z),
          new THREE.Vector3(0.72, -0.43, z)
        ),
        addBamboo(
          new THREE.Vector3(-0.72, 0.43, z),
          new THREE.Vector3(0.72, 0.43, z)
        )
      );
    }

    // Ribs visible on both sides of the box.
    for (const x of [-halfWidth, halfWidth]) {
      for (const z of [-0.25, 0.25]) {
        kite.add(
          addBamboo(
            new THREE.Vector3(x, -halfHeight, z),
            new THREE.Vector3(x, halfHeight, z)
          )
        );
      }

      kite.add(
        addBamboo(
          new THREE.Vector3(x, -halfHeight, -halfDepth),
          new THREE.Vector3(x, halfHeight, -halfDepth)
        ),
        addBamboo(
          new THREE.Vector3(x, -halfHeight, halfDepth),
          new THREE.Vector3(x, halfHeight, halfDepth)
        )
      );
    }

    // Front fabric panels around a central lattice opening.
    kite.add(
      addPanel(
        1.38,
        1.9,
        new THREE.Vector3(-1.41, 0, frontZ + 0.025),
        0,
        frontClothMaterial
      ),
      addPanel(
        1.38,
        1.9,
        new THREE.Vector3(1.41, 0, frontZ + 0.025),
        0,
        frontClothMaterial
      ),
      addPanel(
        1.44,
        0.52,
        new THREE.Vector3(0, 0.69, frontZ + 0.025),
        0,
        frontClothMaterial
      ),
      addPanel(
        1.44,
        0.52,
        new THREE.Vector3(0, -0.69, frontZ + 0.025),
        0,
        frontClothMaterial
      )
    );

    // Back fabric panels.
    kite.add(
      addPanel(
        1.38,
        1.9,
        new THREE.Vector3(-1.41, 0, -frontZ - 0.025),
        Math.PI,
        backClothMaterial
      ),
      addPanel(
        1.38,
        1.9,
        new THREE.Vector3(1.41, 0, -frontZ - 0.025),
        Math.PI,
        backClothMaterial
      ),
      addPanel(
        1.44,
        0.52,
        new THREE.Vector3(0, 0.69, -frontZ - 0.025),
        Math.PI,
        backClothMaterial
      ),
      addPanel(
        1.44,
        0.52,
        new THREE.Vector3(0, -0.69, -frontZ - 0.025),
        Math.PI,
        backClothMaterial
      )
    );

    // Side fabric panels.
    kite.add(
      addPanel(
        1.08,
        2.1,
        new THREE.Vector3(-halfWidth - 0.025, 0, 0),
        -Math.PI / 2,
        sideClothMaterial
      ),
      addPanel(
        1.08,
        2.1,
        new THREE.Vector3(halfWidth + 0.025, 0, 0),
        Math.PI / 2,
        sideClothMaterial
      )
    );

    // Subtle stitched seams on the fabric.
    kite.add(
      addDashedLine(
        new THREE.Vector3(-1.41, 0, frontZ + 0.075),
        new THREE.Vector3(-0.72, 0, frontZ + 0.075)
      ),
      addDashedLine(
        new THREE.Vector3(1.41, 0, frontZ + 0.075),
        new THREE.Vector3(0.72, 0, frontZ + 0.075)
      ),
      addDashedLine(
        new THREE.Vector3(0, 0, frontZ + 0.075),
        new THREE.Vector3(0, -0.43, frontZ + 0.075)
      ),
      addDashedLine(
        new THREE.Vector3(0, 0, frontZ + 0.075),
        new THREE.Vector3(0, 0.43, frontZ + 0.075)
      ),
      addDashedLine(
        new THREE.Vector3(-halfWidth - 0.075, 0, 0),
        new THREE.Vector3(-halfWidth - 0.075, -1.05, 0)
      ),
      addDashedLine(
        new THREE.Vector3(halfWidth + 0.075, 0, 0),
        new THREE.Vector3(halfWidth + 0.075, -1.05, 0)
      )
    );

    // Lattice in the center window.
    kite.add(
      addBamboo(
        new THREE.Vector3(-0.3, -0.3, frontZ + 0.075),
        new THREE.Vector3(-0.3, 0.3, frontZ + 0.075),
        0.035,
        latticeMaterial
      ),
      addBamboo(
        new THREE.Vector3(0.3, -0.3, frontZ + 0.075),
        new THREE.Vector3(0.3, 0.3, frontZ + 0.075),
        0.035,
        latticeMaterial
      ),

    const jointPositions = [

    for (const position of jointPositions) {

    const knotPosition = new THREE.Vector3(0, 1.82, 0.08);

    kite.add(
      makeTube(

        ],

      ),
      makeTube(
        [

        ],

    kite.add(

    const flags = [];

    for (let i = 0; i < 8; i++) {

      geometry.computeVertexNormals();

    function makeCloud(x, y, z, scale) {
      const cloud = new THREE.Group();

      const pieces = [
        [-1.1, 0, 0, 0.8],

        [0.5, 0.1, 0, 0.85],

        );
        puff.position.set(px, py, pz);

        cloud.add(puff);

      cloud.position.set(x, y, z);

    function animate() {

      const time = clock.getElapsedTime();

      if (controls.auto) {
        controls.theta += 0.0025;
        updateCamera();

      kite.rotation.z = -0.055 + Math.sin(time * 0.55) * 0.025;
      kite.rotation.x = Math.sin(time * 0.42) * 0.018;
      kite.position.y = 1.05 + Math.sin(time * 0.48) * 0.045;

      flags.forEach((flag, index) => {
        flag.rotation.y = Math.sin(time * 1.35 + index * 0.7) * 0.08;
        flag.rotation.z = Math.cos(time * 1.15 + index) * 0.055;

      if (firstFrame) {

        loading.classList.add("hidden");

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
