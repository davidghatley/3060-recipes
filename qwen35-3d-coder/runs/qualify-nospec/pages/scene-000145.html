<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Kite Shield — Three.js Scene</title>

  <style>
    :root {
      color-scheme: dark;
      --gold: #e7c36a;
      --ice: #8fe9ff;
      --text: #f1e6cf;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070914;
      font-family: Georgia, "Times New Roman", serif;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .title-card {
      position: fixed;
      top: clamp(24px, 5vw, 64px);
      left: clamp(24px, 5vw, 72px);
      z-index: 2;
      max-width: 430px;
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--gold);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(34px, 6vw, 76px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 340px;
      margin: 20px 0 0;
      color: rgba(241, 230, 207, 0.68);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      line-height: 1.7;
      letter-spacing: 0.08em;
    }

    .controls {
      position: fixed;
      left: clamp(24px, 5vw, 72px);
      bottom: clamp(24px, 4vw, 48px);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 18px;
      color: rgba(241, 230, 207, 0.55);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .controls span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .controls i {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
    }

    button {
      position: fixed;
      right: clamp(24px, 5vw, 64px);
      bottom: clamp(24px, 4vw, 48px);
      z-index: 3;
      padding: 12px 20px;
      border: 1px solid rgba(231, 195, 106, 0.45);
      border-radius: 999px;
      background: rgba(10, 12, 26, 0.72);
      color: var(--gold);
      font: 700 10px Arial, Helvetica, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition:
        background 200ms ease,
        border-color 200ms ease,
        transform 200ms ease;
    }

    button:hover {
      background: rgba(91, 72, 20, 0.65);
      border-color: rgba(231, 195, 106, 0.85);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 43%, transparent 35%, rgba(0, 0, 0, 0.28) 78%, rgba(0, 0, 0, 0.78) 100%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.22), transparent 24%, transparent 72%, rgba(0, 0, 0, 0.45));
    }

    @media (max-width: 700px) {
      .subtitle {
        max-width: 260px;
        font-size: 11px;
      }

      .controls {
        max-width: 170px;
        line-height: 1.8;
      }

      .controls .wheel-hint {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="stage"></div>

  <header class="title-card">
    <div class="eyebrow">Artyan Archive · Object 07</div>
    <h1>The Kite Shield</h1>
    <p class="subtitle">
      An ancient ward, bound with old steel and left to guard the threshold
      between the living world and the veil.
    </p>
  </header>

  <div class="vignette"></div>

  <div class="controls">
    <span><i></i> Drag to orbit</span>
    <span class="wheel-hint"><i></i> Scroll to zoom</span>
  </div>

  <button id="sigilButton" type="button">Awaken the sigil</button>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer and scene
    // -------------------------------------------------------------------------

    const stage = document.getElementById("stage");

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x070914, 0);
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x070914, 0.035);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    const target = new THREE.Vector3(0, 1.7, 0);
    let cameraRadius = 9.2;
    let cameraTheta = 0.24;
    let cameraPhi = 1.34;
    let lastInteraction = performance.now();

    function updateCamera() {
      const sinPhi = Math.sin(cameraPhi);

      camera.position.set(
        target.x + cameraRadius * sinPhi * Math.sin(cameraTheta),
        target.y + cameraRadius * Math.cos(cameraPhi),
        target.z + cameraRadius * sinPhi * Math.cos(cameraTheta)
      );

      camera.lookAt(target);
    }

    updateCamera();

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    const materials = {
      parchment: new THREE.MeshStandardMaterial({
        color: 0xc7b58b,
        roughness: 0.88,
        metalness: 0.02
      }),
      wood: new THREE.MeshStandardMaterial({
        color: 0x382218,
        roughness: 0.72,
        metalness: 0.08
      }),
      darkWood: new THREE.MeshStandardMaterial({
        color: 0x211711,
        roughness: 0.65,
        metalness: 0.12
      }),
      iron: new THREE.MeshStandardMaterial({
        color: 0x89939c,
        roughness: 0.34,
        metalness: 0.92
      }),
      darkIron: new THREE.MeshStandardMaterial({
        color: 0x252a31,
        roughness: 0.4,
        metalness: 0.88
      }),
      gold: new THREE.MeshStandardMaterial({
        color: 0xc99a3d,
        roughness: 0.28,
        metalness: 0.88
      }),
      leather: new THREE.MeshStandardMaterial({
        color: 0x241711,
        roughness: 0.92,
        metalness: 0.02
      }),
      tunic: new THREE.MeshStandardMaterial({
        color: 0x481d28,
        roughness: 0.9,
        metalness: 0.02
      }),
      cloak: new THREE.MeshStandardMaterial({
        color: 0x182c39,
        roughness: 0.96,
        metalness: 0.01
      }),
      skin: new THREE.MeshStandardMaterial({
        color: 0xb98264,
        roughness: 0.85
      }),
      steel: new THREE.MeshStandardMaterial({
        color: 0x9ba8ad,
        roughness: 0.22,
        metalness: 0.95
      }),
      rune: new THREE.MeshBasicMaterial({
        color: 0x83eaff,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
      })
    };

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0x8da8ff, 0x190b08, 1.25));

    const keyLight = new THREE.DirectionalLight(0xffd49a, 3.2);
    keyLight.position.set(4.5, 7, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x3b8fff, 18, 18, 2);
    rimLight.position.set(-4, 2.8, -2.5);
    scene.add(rimLight);

    const shieldLight = new THREE.PointLight(0xffc46b, 10, 9, 2);
    shieldLight.position.set(0, 0.25, 1.1);
    scene.add(shieldLight);

    // -------------------------------------------------------------------------
    // Sky dome and stars
    // -------------------------------------------------------------------------

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(38, 32, 18),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x050713) },
          horizonColor: { value: new THREE.Color(0x172347) },
          bottomColor: { value: new THREE.Color(0x090a12) }
        },
        vertexShader: `
          varying vec3 vWorldPosition;

          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 horizonColor;
          uniform vec3 bottomColor;
          varying vec3 vWorldPosition;

          void main() {
            float h = normalize(vWorldPosition).y * 0.5 + 0.5;
            vec3 lower = mix(bottomColor, horizonColor, smoothstep(0.0, 0.48, h));
            vec3 color = mix(lower, topColor, smoothstep(0.45, 1.0, h));
            gl_FragColor = vec4(color, 1.0);
          }
        `
      })
    );

    scene.add(sky);

    const starPositions = [];

    for (let i = 0; i < 650; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(THREE.MathUtils.randFloat(-0.1, 0.95));
      const radius = THREE.MathUtils.randFloat(13, 34);

      starPositions.push(
        radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(starPositions, 3)
    );

    const stars = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({
        color: 0xd9e8ff,
        size: 0.055,
        transparent: true,
        opacity: 0.85,
        depthWrite: false
      })
    );

    scene.add(stars);

    // -------------------------------------------------------------------------
    // Ground, platform, and runes
    // -------------------------------------------------------------------------

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 50),
      new THREE.MeshStandardMaterial({
        color: 0x090b13,
        roughness: 0.96,
        metalness: 0.05
      })
    );

    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.38;
    ground.receiveShadow = true;
    scene.add(ground);

    const platform = new THREE.Mesh(
      new THREE.CylinderGeometry(4.7, 5.15, 0.36, 64),
      new THREE.MeshStandardMaterial({
        color: 0x242732,
        roughness: 0.82,
        metalness: 0.18
      })
    );

    platform.position.y = -0.18;
    platform.receiveShadow = true;
    platform.castShadow = true;
    scene.add(platform);

    const platformEdge = new THREE.Mesh(
      new THREE.TorusGeometry(4.72, 0.055, 8, 96),
      materials.gold
    );

    platformEdge.rotation.x = Math.PI / 2;
    platformEdge.position.y = 0.015;
    scene.add(platformEdge);

    const runeRing = new THREE.Mesh(
      new THREE.TorusGeometry(3.18, 0.025, 8, 96),
      materials.rune
    );

    runeRing.rotation.x = Math.PI / 2;
    runeRing.position.y = 0.025;
    scene.add(runeRing);

    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const rune = new THREE.Mesh(
        new THREE.BoxGeometry(0.34, 0.025, 0.055),
        materials.rune
      );

      rune.position.set(
        Math.sin(angle) * 3.18,
        0.03,
        Math.cos(angle) * 3.18
      );

      rune.rotation.y = angle;
      scene.add(rune);
    }

    // Distant mountains.
    const mountainMaterial = new THREE.MeshStandardMaterial({
      color: 0x0b1020,
      roughness: 1
    });

    [
      [-11, -1.2, -15, 5.5, 3.8],
      [0, -1.4, -18, 7, 4.5],
      [12, -1.3, -16, 6, 4]
    ].forEach(([x, y, z, radius, height]) => {
      const mountain = new THREE.Mesh(
        new THREE.ConeGeometry(radius, height, 7),
        mountainMaterial
      );

      mountain.position.set(x, y + height / 2, z);
      mountain.rotation.y = Math.random() * Math.PI;
      scene.add(mountain);
    });

    // -------------------------------------------------------------------------
    // Helpers
    // -------------------------------------------------------------------------

    function cylinderBetween(start, end, radius, material, radialSegments = 12) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();

      const geometry = new THREE.CylinderGeometry(
        radius,
        radius,
        length,
        radialSegments
      );

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );

      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function makeStar(outerRadius, innerRadius, points) {
      const shape = new THREE.Shape();
      const radius = Math.PI * 2;

      for (let i = 0; i < points; i++) {
        const angle = (i / points) * radius;
        const r = i % 2 === 0 ? outerRadius : innerRadius;

        const x = Math.sin(angle) * r;
        const y = Math.cos(angle) * r;

        if (i === 0) {
          shape.moveTo(x, y);
        } else {
          shape.lineTo(x, y);
        }
      }

      shape.closePath();
      return shape;
    }

    // -------------------------------------------------------------------------
    // The adventurer
    // -------------------------------------------------------------------------

    const adventurer = new THREE.Group();
    adventurer.position.set(-2.35, 0, -1.45);
    adventurer.rotation.y = 0.28;
    scene.add(adventurer);

    const bootGeometry = new THREE.BoxGeometry(0.48, 0.28, 0.9);

    [-0.48, 0.48].forEach((x) => {
      const boot = new THREE.Mesh(bootGeometry, materials.darkIron);
      boot.position.set(x, 0.14, 0.15);
      boot.rotation.x = -0.08;
      boot.castShadow = true;
      boot.receiveShadow = true;
      adventurer.add(boot);

      const leg = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.2, 0.86, 10),
        materials.cloak
      );

      leg.position.set(x, 0.63, 0);
      leg.castShadow = true;
      adventurer.add(leg);
    });

    const torso = new THREE.Mesh(
      new THREE.CylinderGeometry(0.53, 0.72, 1.35, 14),
      materials.tunic
    );

    torso.position.y = 1.52;
    torso.castShadow = true;
    torso.receiveShadow = true;
    adventurer.add(torso);

    const shoulder = new THREE.Mesh(
      new THREE.SphereGeometry(0.58, 16, 12),
      materials.cloak
    );

    shoulder.scale.set(1.25, 0.75, 0.9);
    shoulder.position.y = 2.03;
    shoulder.castShadow = true;
    adventurer.add(shoulder);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.29, 18, 14),
      materials.skin
    );

    head.position.y = 2.38;
    head.castShadow = true;
    adventurer.add(head);

    const helmet = new THREE.Mesh(
      new THREE.ConeGeometry(0.64, 0.55, 14),
      materials.iron
    );

    helmet.position.y = 2.72;
    helmet.castShadow = true;
    adventurer.add(helmet);

    const eyeGeometry = new THREE.SphereGeometry(0.035, 10, 8);

    [-0.19, 0.19].forEach((x) => {
      const eye = new THREE.Mesh(eyeGeometry, materials.rune);
      eye.position.set(x, 2.39, 0.255);
      adventurer.add(eye);
    });

    // Arms and gauntlets reaching toward the shield.
    adventurer.add(
      cylinderBetween(
        new THREE.Vector3(-0.67, 1.72, 0),
        new THREE.Vector3(-1.12, 2.22, 0.02),
        0.18,
        materials.cloak
      )
    );

    adventurer.add(
      cylinderBetween(
        new THREE.Vector3(-1.12, 2.22, 0.02),
        new THREE.Vector3(-1.55, 2.02, 0.12),
        0.16,
        materials.cloak
      )
    );

    adventurer.add(
      cylinderBetween(
        new THREE.Vector3(0.58, 1.62, 0),
        new THREE.Vector3(1.12, 1.78, 0.08),
        0.18,
        materials.cloak
      )
    );

    adventurer.add(
      cylinderBetween(
        new THREE.Vector3(1.12, 1.78, 0.08),
        new THREE.Vector3(1.56, 1.58, 0.2),
        0.16,
        materials.cloak
      )
    );

    const gauntletGeometry = new THREE.CylinderGeometry(0.2, 0.24, 0.32, 12);

    [
      [new THREE.Vector3(-1.55, 2.02, 0.12), new THREE.Vector3(-1.75, 1.9, 0.16)],
      [new THREE.Vector3(1.56, 1.58, 0.2), new THREE.Vector3(1.78, 1.47, 0.24)]
    ].forEach(([start, end]) => {
      const gauntlet = new THREE.Mesh(gauntletGeometry, materials.iron);
      gauntlet.position.copy(start).add(end).multiplyScalar(0.5);
      gauntlet.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        new THREE.Vector3().subVectors(end, start).normalize()
      );
      gauntlet.castShadow = true;
      adventurer.add(gauntlet);
    });

    // Sword at the adventurer's side.
    const swordHandle = cylinderBetween(
      new THREE.Vector3(0.78, 1.28, 0.08),
      new THREE.Vector3(0.78, 0.72, 0.08),
      0.055,
      materials.wood
    );

    adventurer.add(swordHandle);

    const swordBlade = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 1.35, 0.07),
      materials.steel
    );

    swordBlade.position.set(0.78, 0.16, 0.08);
    swordBlade.rotation.z = -0.08;
    swordBlade.castShadow = true;
    adventurer.add(swordBlade);

    const swordGuard = new THREE.Mesh(
      new THREE.BoxGeometry(0.28, 0.09, 0.08),
      materials.gold
    );

    swordGuard.position.set(0.78, 0.49, 0.08);
    swordGuard.rotation.z = -0.08;
    adventurer.add(swordGuard);

    // -------------------------------------------------------------------------
    // Kite shield
    // -------------------------------------------------------------------------

    const shield = new THREE.Group();
    scene.add(shield);

    const shieldShape = new THREE.Shape();

    shieldShape.moveTo(0, 3.2);
    shieldShape.bezierCurveTo(2.25, 2.8, 2.55, 0.8, 2.35, -1.8);
    shieldShape.lineTo(0, -3.25);
    shieldShape.bezierCurveTo(-2.35, -1.8, -2.55, 0.8, -2.25, 2.8);
    shieldShape.closePath();

    const membrane = new THREE.Mesh(
      new THREE.ShapeGeometry(shieldShape, 24),
      materials.parchment
    );

    membrane.castShadow = true;
    membrane.receiveShadow = true;
    shield.add(membrane);

    const framePoints = shieldShape.getSpacedPoints(120);
    const uniqueFramePoints = [];

    for (const point of framePoints) {
      if (
        uniqueFramePoints.length === 0 ||
        uniqueFramePoints[uniqueFramePoints.length - 1]
          .distanceToSquared(point) > 0.0001
      ) {
        uniqueFramePoints.push(point.clone());
      }
    }

    const frameCurve = new THREE.CatmullRomCurve3(
      uniqueFramePoints,
      true,
      "centripetal"
    );

    const frame = new THREE.Mesh(
      new THREE.TubeGeometry(frameCurve, 180, 0.105, 8, true),
      materials.darkWood
    );

    frame.castShadow = true;
    frame.receiveShadow = true;
    shield.add(frame);

    const innerTrimPoints = uniqueFramePoints.map((point) => {
      const scaled = point.clone().multiplyScalar(0.87);
      scaled.z = 0.025;
      return scaled;
    });

    const innerTrimCurve = new THREE.CatmullRomCurve3(
      innerTrimPoints,
      true,
      "centripetal"
    );

    const innerTrim = new THREE.Mesh(
      new THREE.TubeGeometry(innerTrimCurve, 180, 0.025, 6, true),
      materials.gold
    );

    shield.add(innerTrim);

    // Rivets around the frame.
    const rivetGeometry = new THREE.SphereGeometry(0.065, 10, 8);

    for (let i = 0; i < uniqueFramePoints.length; i += 5) {
      const point = uniqueFramePoints[i];
      const rivet = new THREE.Mesh(rivetGeometry, materials.iron);
      rivet.position.set(point.x, point.y, 0.145);
      rivet.castShadow = true;
      shield.add(rivet);
    }

    // Leather reinforcement straps.
    shield.add(
      cylinderBetween(
        new THREE.Vector3(0, 2.88, 0.14),
        new THREE.Vector3(-0.68, 0.28, 0.19),
        0.055,
        materials.leather
      )
    );

    shield.add(
      cylinderBetween(
        new THREE.Vector3(0, 2.88, 0.14),
        new THREE.Vector3(0.68, 0.28, 0.19),
        0.055,
        materials.leather
      )
    );

    // Top carrying handle.
    shield.add(
      cylinderBetween(
        new THREE.Vector3(0, 3.02, 0.13),
        new THREE.Vector3(0, 3.58, 0.13),
        0.14,
        materials.wood,
        14
      )
    );

    const handleCap = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 12, 8),
      materials.wood
    );

    handleCap.position.set(0, 3.58, 0.13);
    handleCap.castShadow = true;
    shield.add(handleCap);

    // -------------------------------------------------------------------------
    // Central boss and glowing sigil
    // -------------------------------------------------------------------------

    const boss = new THREE.Group();
    boss.position.set(0, 0.18, 0.22);
    shield.add(boss);

    const bossBack = new THREE.Mesh(
      new THREE.CylinderGeometry(0.92, 1.03, 0.24, 32),
      materials.darkIron
    );

    bossBack.rotation.x = Math.PI / 2;
    bossBack.castShadow = true;
    boss.add(bossBack);

    const bossRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.79, 0.085, 10, 48),
      materials.gold
    );

    bossRing.position.z = 0.15;
    bossRing.castShadow = true;
    boss.add(bossRing);

    const bossFace = new THREE.Mesh(
      new THREE.CylinderGeometry(0.61, 0.68, 0.12, 32),
      materials.iron
    );

    bossFace.rotation.x = Math.PI / 2;
    bossFace.position.z = 0.19;
    bossFace.castShadow = true;
    boss.add(bossFace);

    const bossInset = new THREE.Mesh(
      new THREE.CylinderGeometry(0.39, 0.43, 0.08, 32),
      materials.darkIron
    );

    bossInset.rotation.x = Math.PI / 2;
    bossInset.position.z = 0.28;
    boss.add(bossInset);

    // Radial spikes.
    const spikeGeometry = new THREE.ConeGeometry(0.115, 0.46, 5);

    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const spike = new THREE.Mesh(spikeGeometry, materials.gold);

      spike.position.set(
        Math.sin(angle) * 0.88,
        Math.cos(angle) * 0.88,
        0.18
      );

      spike.rotation.z = angle;
      spike.castShadow = true;
      boss.add(spike);
    }

    // Six-point rune.
    const sigilShape = makeStar(0.34, 0.095, 12);

    const sigil = new THREE.Mesh(
      new THREE.ShapeGeometry(sigilShape),
      materials.rune
    );

    sigil.position.z = 0.36;
    boss.add(sigil);

    const sigilHalo = new THREE.Mesh(
      new THREE.TorusGeometry(0.48, 0.018, 6, 48),
      materials.rune
    );

    sigilHalo.position.z = 0.35;
    boss.add(sigilHalo);

    const bossLight = new THREE.PointLight(0x79e8ff, 4, 5, 2);
    bossLight.position.set(0, 0.18, 0.85);
    shield.add(bossLight);

    // -------------------------------------------------------------------------
    // Floating motes and fireflies
    // -------------------------------------------------------------------------

    const moteCount = 180;
    const motePositions = new Float32Array(moteCount * 3);
    const moteBase = new Float32Array(moteCount * 3);
    const motePhases = new Float32Array(moteCount);

    for (let i = 0; i < moteCount; i++) {
      const x = THREE.MathUtils.randFloat(-6, 6);
      const y = THREE.MathUtils.randFloat(-0.5, 6);
      const z = THREE.MathUtils.randFloat(-4, 4);

      motePositions[i * 3] = x;
      motePositions[i * 3 + 1] = y;
      motePositions[i * 3 + 2] = z;

      moteBase[i * 3] = x;
      moteBase[i * 3 + 1] = y;
      moteBase[i * 3 + 2] = z;

      motePhases[i] = Math.random() * Math.PI * 2;
    }

    const moteGeometry = new THREE.BufferGeometry();
    moteGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(motePositions, 3)
    );

    const motes = new THREE.Points(
      moteGeometry,
      new THREE.PointsMaterial({
        color: 0xbbe8ff,
        size: 0.045,
        transparent: true,
        opacity: 0.55,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );

    scene.add(motes);

    // -------------------------------------------------------------------------
    // Custom camera controls
    // -------------------------------------------------------------------------

    let dragging = false;
    let previousX = 0;
    let previousY = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      lastInteraction = performance.now();
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const deltaX = event.clientX - previousX;
      const deltaY = event.clientY - previousY;

      previousX = event.clientX;
      previousY = event.clientY;

      cameraTheta -= deltaX * 0.005;
      cameraPhi = THREE.MathUtils.clamp(
        cameraPhi - deltaY * 0.0045,
        0.72,
        1.72
      );

      lastInteraction = performance.now();
      updateCamera();
    });

    function endDrag(event) {
      dragging = false;

      if (
        event.pointerId !== undefined &&
        renderer.domElement.hasPointerCapture(event.pointerId)
      ) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointercancel", endDrag);

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();

        cameraRadius = THREE.MathUtils.clamp(
          cameraRadius * Math.exp(event.deltaY * 0.001),
          4.8,
          16
        );

        lastInteraction = performance.now();
        updateCamera();
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("dblclick", () => {
      cameraRadius = 9.2;
      cameraTheta = 0.24;
      cameraPhi = 1.34;
      target.set(0, 1.7, 0);
      lastInteraction = performance.now();
      updateCamera();
    });

    renderer.domElement.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    // -------------------------------------------------------------------------
    // UI interaction
    // -------------------------------------------------------------------------

    const sigilButton = document.getElementById("sigilButton");
    let sigilActive = false;

    sigilButton.addEventListener("click", () => {
      sigilActive = !sigilActive;
      sigilButton.textContent = sigilActive
        ? "Sigil awakened"
        : "Awaken the sigil";

      if (sigilActive) {
        target.set(0, 0.2, 0);
        cameraRadius = 6.1;
        lastInteraction = performance.now();
      }
    });

    // -------------------------------------------------------------------------
    // Animation
    // -------------------------------------------------------------------------

    const clock = new THREE.Clock();
    const moteAttribute = moteGeometry.getAttribute("position");

    function animate() {
      const elapsed = clock.getElapsedTime();

      // Gentle automatic orbit after a short pause.
      if (
        !dragging &&
        performance.now() - lastInteraction > 3500
      ) {
        cameraTheta += 0.00055;
        updateCamera();
      }

      // Pulsing central sigil.
      const pulse = 1 + Math.sin(elapsed * 2.15) * 0.055;
      boss.scale.setScalar(pulse);

      materials.rune.opacity = 0.72 + Math.sin(elapsed * 2.15) * 0.2;
      materials.rune.color.setHSL(
        0.52,
        0.9,
        0.66 + Math.sin(elapsed * 2.15) * 0.08
      );

      bossLight.intensity = 3.2 + Math.sin(elapsed * 2.15) * 1.4;
      shieldLight.intensity = 8 + Math.sin(elapsed * 1.7) * 2;

      // Firefly drift.
      for (let i = 0; i < moteCount; i++) {
        const phase = motePhases[i];

        moteAttribute.array[i * 3] =
          moteBase[i * 3] + Math.sin(elapsed * 0.45 + phase) * 0.18;

        moteAttribute.array[i * 3 + 1] =
          moteBase[i * 3 + 1] + Math.sin(elapsed * 0.7 + phase) * 0.28;

        moteAttribute.array[i * 3 + 2] =
          moteBase[i * 3 + 2] + Math.cos(elapsed * 0.38 + phase) * 0.14;
      }

      moteAttribute.needsUpdate = true;

      // Subtle adventurer and shield breathing.
      adventurer.position.y = Math.sin(elapsed * 1.15) * 0.025;
      shield.position.y = Math.sin(elapsed * 1.15 + 0.7) * 0.012;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // -------------------------------------------------------------------------
    // Resize
    // -------------------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
