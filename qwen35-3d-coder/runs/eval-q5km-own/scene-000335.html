<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buoy Tender — Working Deck</title>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(10, 25, 35, 0.78);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f4f7f8;
      --muted: #b9cbd2;
      --accent: #ff9f43;
      --accent-2: #65d4c4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #8fc4d8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    #scene canvas.dragging {
      cursor: grabbing;
    }

    .panel {
      position: fixed;
      z-index: 10;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    #info {
      top: 22px;
      left: 22px;
      width: min(350px, calc(100vw - 44px));
      padding: 20px;
      border-radius: 16px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      color: var(--accent-2);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 5px rgba(101, 212, 196, 0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 36px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 17px;
    }

    .status {
      padding: 7px 9px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      color: #dce7eb;
      background: rgba(255, 255, 255, 0.055);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #controls {
      bottom: 22px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px;
      border-radius: 14px;
      transform: translateX(-50%);
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 9px;
      padding: 10px 13px;
      color: #dce7eb;
      background: rgba(255, 255, 255, 0.07);
      font: inherit;
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
      transition:
        color 160ms ease,
        background 160ms ease,
        transform 160ms ease;
    }

    button:hover {
      color: white;
      background: rgba(255, 255, 255, 0.14);
    }

    button:active {
      transform: translateY(1px);
    }

    button.active {
      color: #172129;
      background: var(--accent);
    }

    #help {
      right: 22px;
      bottom: 22px;
      padding: 11px 14px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
      letter-spacing: 0.02em;
    }

    #label-crane,
    #label-deck {
      position: fixed;
      z-index: 5;
      top: 0;
      left: 0;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: white;
      background: rgba(9, 24, 33, 0.78);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      color: white;
      background: #102a38;
      transition: opacity 500ms ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .loader::before {
      content: "";
      display: block;
      width: 42px;
      height: 42px;
      margin: 0 auto 16px;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 700px) {
      #info {
        top: 12px;
        left: 12px;
        width: calc(100vw - 24px);
        padding: 15px;
      }

      .subtitle,
      .status-row {
        display: none;
      }

      #controls {
        bottom: 12px;
        width: calc(100vw - 24px);
        justify-content: center;
      }

      button {
        flex: 1;
        padding: 10px 7px;
      }

      #help {
        display: none;
      }

      #label-crane,
      #label-deck {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="scene"></div>

  <section id="info" class="panel">
    <div class="eyebrow">
      <span class="live-dot"></span>
      Live working deck
    </div>
    <h1>Buoy Tender</h1>
    <p class="subtitle">
      Class 07 offshore support vessel · stern lifting crane · active deck station
    </p>
    <div class="status-row">
      <span class="status">Crane online</span>
      <span class="status">340 kg load</span>
      <span class="status">Sea state 1.2</span>
    </div>
  </section>

  <div id="label-crane">Stern crane</div>
  <div id="label-deck">Working deck</div>

  <nav id="controls" class="panel" aria-label="Camera views">
    <button class="active" data-view="orbit">Orbit</button>
    <button data-view="stern">Stern</button>
    <button data-view="deck">Deck</button>
    <button data-view="top">Top</button>
    <button id="rotate">Auto orbit</button>
  </nav>

  <aside id="help" class="panel">
    Drag to orbit · Scroll to zoom<br />
    Double-click to reset
  </aside>

  <div id="loading">
    <div class="loader">Preparing scene</div>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer, scene, camera, and lighting
    // -------------------------------------------------------------------------

    const container = document.getElementById("scene");

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x9bc7d8, 28, 82);

    const camera = new THREE.PerspectiveCamera(
      43,
      window.innerWidth / window.innerHeight,
      0.1,
      160
    );

    const hemi = new THREE.HemisphereLight(0xcceeff, 0x36514a, 2.15);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1d2, 3.2);
    sun.position.set(9, 15, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -13;
    sun.shadow.camera.right = 13;
    sun.shadow.camera.top = 13;
    sun.shadow.camera.bottom = -13;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 45;
    sun.shadow.bias = -0.00025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x83c9e5, 0.8);
    fill.position.set(-10, 7, -8);
    scene.add(fill);

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    const materials = {
      hull: new THREE.MeshStandardMaterial({
        color: 0xf1efe5,
        roughness: 0.4,
        metalness: 0.08,
        side: THREE.DoubleSide
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xa9342c,
        roughness: 0.48,
        metalness: 0.05
      }),
      deck: new THREE.MeshStandardMaterial({
        color: 0x52666a,
        roughness: 0.82,
        metalness: 0.08
      }),
      darkDeck: new THREE.MeshStandardMaterial({
        color: 0x303c3f,
        roughness: 0.75
      }),
      white: new THREE.MeshStandardMaterial({
        color: 0xf8f7f0,
        roughness: 0.48,
        metalness: 0.08
      }),
      orange: new THREE.MeshStandardMaterial({
        color: 0xf17a24,
        roughness: 0.48,
        metalness: 0.12
      }),
      yellow: new THREE.MeshStandardMaterial({
        color: 0xf5c746,
        roughness: 0.52
      }),
      metal: new THREE.MeshStandardMaterial({
        color: 0x8b989c,
        roughness: 0.34,
        metalness: 0.78
      }),
      darkMetal: new THREE.MeshStandardMaterial({
        color: 0x263438,
        roughness: 0.4,
        metalness: 0.68
      }),
      glass: new THREE.MeshStandardMaterial({
        color: 0x173c4a,
        roughness: 0.18,
        metalness: 0.38
      }),
      rope: new THREE.MeshStandardMaterial({
        color: 0xc7b58d,
        roughness: 0.95
      }),
      skin: new THREE.MeshStandardMaterial({
        color: 0xc98f68,
        roughness: 0.8
      }),
      vest: new THREE.MeshStandardMaterial({
        color: 0xff9d32,
        roughness: 0.68
      }),
      navy: new THREE.MeshStandardMaterial({
        color: 0x173847,
        roughness: 0.78
      })
    };

    // -------------------------------------------------------------------------
    // Utility functions
    // -------------------------------------------------------------------------

    function addBox(parent, size, position, material, castShadow = true) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        material
      );
      mesh.position.copy(position);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(
      parent,
      radiusTop,
      radiusBottom,
      height,
      position,
      material,
      segments = 20,
      castShadow = true
    ) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          segments
        ),
        material
      );
      mesh.position.copy(position);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    const up = new THREE.Vector3(0, 1, 0);

    function cylinderBetween(parent, a, b, radius, material, segments = 12) {
      const direction = b.clone().sub(a);
      const length = direction.length();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radius,
          radius,
          length,
          segments
        ),
        material
      );

      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(up, direction.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function updateCylinderBetween(mesh, a, b) {
      const direction = b.clone().sub(a);
      const length = direction.length();

      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(up, direction.normalize());
      mesh.scale.set(1, length, 1);
    }

    function addRail(parent, points, height = 0.55) {
      const curve = new THREE.CatmullRomCurve3(points);
      const rail = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 100, 0.035, 7, false),
        materials.metal
      );
      rail.position.y = height;
      rail.castShadow = true;
      parent.add(rail);

      for (let i = 0; i < points.length; i += 4) {
        const p = points[i];
        cylinderBetween(
          parent,
          new THREE.Vector3(p.x, p.y, p.z),
          new THREE.Vector3(p.x, p.y + height, p.z),
          0.025,
          materials.metal,
          8
        );
      }
    }

    // -------------------------------------------------------------------------
    // Sky and distant environment
    // -------------------------------------------------------------------------

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(85, 32, 18),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x4d9fc4) },
          bottomColor: { value: new THREE.Color(0xd6e8e8) }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPosition;
          }
        `,
        fragmentShader: `
          varying vec3 vWorldPosition;
          uniform vec3 topColor;
          uniform vec3 bottomColor;
          void main() {
            float h = normalize(vWorldPosition).y;
            float blend = smoothstep(-0.15, 0.72, h);
            gl_FragColor = vec4(mix(bottomColor, topColor, blend), 1.0);
          }
        `
      })
    );
    scene.add(sky);

    const sunDisc = new THREE.Mesh(
      new THREE.SphereGeometry(3.5, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xfff0bf })
    );
    sunDisc.position.set(-30, 25, -48);
    scene.add(sunDisc);

    const cloudMaterial = new THREE.MeshBasicMaterial({
      color: 0xf5fbfb,
      transparent: true,
      opacity: 0.62,
      depthWrite: false
    });

    function addCloud(x, y, z, scale) {
      const cloud = new THREE.Group();
      const pieces = [
        [-1.2, 0, 0, 0.8],
        [-0.4, 0.25, 0, 1.1],
        [0.55, 0.1, 0, 0.9],
        [1.25, -0.05, 0, 0.65]
      ];

      for (const [px, py, pz, s] of pieces) {
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(s, 12, 8),
          cloudMaterial
        );
        puff.position.set(px, py, pz);
        puff.scale.y = 0.62;
        cloud.add(puff);
      }

      cloud.position.set(x, y, z);
      cloud.scale.setScalar(scale);
      scene.add(cloud);
    }

    addCloud(-18, 13, -38, 1.4);
    addCloud(20, 16, -45, 1.7);
    addCloud(31, 10, -25, 1.1);

    // -------------------------------------------------------------------------
    // Animated water
    // -------------------------------------------------------------------------

    const waterGeometry = new THREE.PlaneGeometry(100, 100, 100, 100);
    waterGeometry.rotateX(-Math.PI / 2);

    const waterMaterial = new THREE.MeshStandardMaterial({
      color: 0x287f9c,
      roughness: 0.28,
      metalness: 0.28,
      transparent: true,
      opacity: 0.94
    });

    const water = new THREE.Mesh(waterGeometry, waterMaterial);
    water.receiveShadow = true;
    scene.add(water);

    // -------------------------------------------------------------------------
    // Buoy tender
    // -------------------------------------------------------------------------

    const boat = new THREE.Group();
    boat.position.y = 0.08;
    scene.add(boat);

    const hullStations = [
      { z: -5.0, w: 1.08 },
      { z: -4.35, w: 1.55 },
      { z: -2.8, w: 1.88 },
      { z: 0.2, w: 1.95 },
      { z: 2.3, w: 1.82 },
      { z: 3.65, w: 1.38 },
      { z: 4.65, w: 0.72 },
      { z: 5.05, w: 0.08 }
    ];

    const hullSection = [
      { x: -0.96, y: 0.48 },
      { x: -0.94, y: 0.18 },
      { x: -0.72, y: -0.18 },
      { x: -0.38, y: -0.55 },
      { x: 0.0, y: -0.62 },
      { x: 0.38, y: -0.55 },
      { x: 0.72, y: -0.18 },
      { x: 0.94, y: 0.18 },
      { x: 0.96, y: 0.48 }
    ];

    function createHullGeometry() {
      const positions = [];
      const indices = [];

      for (const station of hullStations) {
        for (const point of hullSection) {
          positions.push(
            station.w * point.x,
            point.y,
            station.z
          );
        }
      }

      for (let i = 0; i < hullStations.length - 1; i++) {
        for (let j = 0; j < hullSection.length; j++) {
          const nextJ = (j + 1) % hullSection.length;
          const a = i * hullSection.length + j;
          const b = i * hullSection.length + nextJ;
          const c = (i + 1) * hullSection.length + nextJ;
          const d = (i + 1) * hullSection.length + j;

          indices.push(a, b, d, b, c, d);
        }
      }

      function addCap(stationIndex, reverse) {
        const contour = hullSection.map((point, index) => {
          const next = (index + 1) % hullSection.length;
          const a =
            stationIndex * hullSection.length + index;
          const b =
            stationIndex * hullSection.length + next;
          return new THREE.Vector2(
            (positions[a] + positions[b]) * 0.5,
            (positions[a + 1] + positions[b + 1]) * 0.5
          );
        });

        const centerIndex = positions.length / 3;
        positions.push(
          hullStations[stationIndex].w * 0,
          0,
          hullStations[stationIndex].z
        );

        const triangles = THREE.ShapeUtils.triangulateShape(contour, []);
        for (const triangle of triangles) {
          indices.push(
            centerIndex,
            triangle[0],
            triangle[1],
            centerIndex,
            triangle[1],
            triangle[2]
          );
        }
      }

      addCap(0, false);
      addCap(hullStations.length - 1, true);

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const hull = new THREE.Mesh(
      createHullGeometry(),
      materials.hull
    );
    hull.castShadow = true;
    hull.receiveShadow = true;
    boat.add(hull);

    // Red lower hull stripe.
    const stripePositions = [];
    const stripeIndices = [];

    for (const station of hullStations) {
      stripePositions.push(
        station.w * 0.952, 0.055, station.z,
        station.w * 0.952, 0.18, station.z
      );
    }

    for (let i = 0; i < hullStations.length - 1; i++) {
      const a = i * 2;
      stripeIndices.push(
        a, a + 1, a + 2,
        a + 1, a + 3, a + 2
      );
    }

    const stripeGeometry = new THREE.BufferGeometry();
    stripeGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(stripePositions, 3)
    );
    stripeGeometry.setIndex(stripeIndices);
    stripeGeometry.computeVertexNormals();

    const stripe = new THREE.Mesh(
      stripeGeometry,
      materials.red
    );
    stripe.castShadow = true;
    boat.add(stripe);

    // Main working deck.
    const deckShape = new THREE.Shape();
    deckShape.moveTo(-1.05, 4.55);
    deckShape.lineTo(-1.62, 3.75);
    deckShape.lineTo(-1.9, 1.7);
    deckShape.lineTo(-1.9, -1.0);
    deckShape.lineTo(-1.62, -3.75);
    deckShape.lineTo(1.05, -4.55);
    deckShape.lineTo(1.62, -3.75);
    deckShape.lineTo(1.9, -1.0);
    deckShape.lineTo(1.9, 1.7);
    deckShape.lineTo(1.55, 3.75);
    deckShape.lineTo(0.72, 4.55);
    deckShape.closePath();

    const deckGeometry = new THREE.ShapeGeometry(deckShape);
    deckGeometry.rotateX(-Math.PI / 2);

    const deck = new THREE.Mesh(deckGeometry, materials.deck);
    deck.position.y = 0.49;
    deck.receiveShadow = true;
    boat.add(deck);

    // Aft non-slip platform.
    addBox(
      boat,
      new THREE.Vector3(2.75, 0.16, 1.55),
      new THREE.Vector3(0, 0.55, -3.75),
      materials.darkDeck
    );

    // Deck edge and railings.
    const railPoints = [
      new THREE.Vector3(-1.88, 0.5, -4.15),
      new THREE.Vector3(-1.9, 0.5, -2.7),
      new THREE.Vector3(-1.9, 0.5, 0.1),
      new THREE.Vector3(-1.88, 0.5, 1.9),
      new THREE.Vector3(-1.45, 0.5, 3.45),
      new THREE.Vector3(-0.7, 0.5, 4.45),
      new THREE.Vector3(0.7, 0.5, 4.45),
      new THREE.Vector3(1.45, 0.5, 3.45),
      new THREE.Vector3(1.88, 0.5, 1.9),
      new THREE.Vector3(1.9, 0.5, 0.1),
      new THREE.Vector3(1.9, 0.5, -2.7),
      new THREE.Vector3(1.88, 0.5, -4.15)
    ];

    addRail(boat, railPoints, 0.56);

    // Bollards.
    function addBollard(x, z) {
      addCylinder(
        boat,
        0.11,
        0.15,
        0.3,
        new THREE.Vector3(x, 0.68, z),
        materials.darkMetal,
        12
      );
      addCylinder(
        boat,
        0.19,
        0.19,
        0.08,
        new THREE.Vector3(x, 0.85, z),
        materials.darkMetal,
        12
      );
    }

    addBollard(-1.25, -4.05);
    addBollard(1.25, -4.05);
    addBollard(-1.2, 3.8);
    addBollard(1.2, 3.8);

    // -------------------------------------------------------------------------
    // Wheelhouse and superstructure
    // -------------------------------------------------------------------------

    addBox(
      boat,
      new THREE.Vector3(2.28, 1.3, 2.75),
      new THREE.Vector3(0, 1.28, 0.55),
      materials.white
    );

    addBox(
      boat,
      new THREE.Vector3(2.42, 0.16, 2.9),
      new THREE.Vector3(0, 2.02, 0.55),
      materials.white
    );

    // Side windows.
    for (const side of [-1, 1]) {
      addBox(
        boat,
        new THREE.Vector3(0.035, 0.48, 1.42),
        new THREE.Vector3(side * 1.155, 1.58, 0.72),
        materials.glass
      );
    }

    // Forward window.
    addBox(
      boat,
      new THREE.Vector3(1.55, 0.48, 0.035),
      new THREE.Vector3(0, 1.58, 1.94),
      materials.glass
    );

    // Side door.
    addBox(
      boat,
      new THREE.Vector3(0.035, 1.08, 0.72),
      new THREE.Vector3(-1.16, 1.2, -0.83),
      materials.white

    // -------------------------------------------------------------------------

    function createWorker(x, z, rotation) {

        );

        arm.castShadow = true;

      return worker;
    }

    createWorker(-0.7, 1.65, -0.4);
    createWorker(0.72, -2.7, 0.5);

    // -------------------------------------------------------------------------
    // Wake and distant buoy
    // -------------------------------------------------------------------------

    const wakeMaterial = new THREE.MeshBasicMaterial({
      color: 0xe9f7f4,
      transparent: true,
      opacity: 0.16,
      depthWrite: false,

    });

    function addWake(z, scale) {

    addWake(-5.35, 3.4);

    const distantBuoy = new THREE.Group();

    addCylinder(

    distantBuoyTop.position.y = 0.64;

    // -------------------------------------------------------------------------
    // Custom camera controls
    // -------------------------------------------------------------------------

    class CameraRig {
      constructor(camera, domElement) {
        this.camera = camera;
        this.domElement = domElement;

        this.target = new THREE.Vector3(0, 1.1, -0.2);
        this.goalTarget = this.target.clone();

        this.spherical = new THREE.Spherical(17, 1.12, 2.55);
        this.goalSpherical = this.spherical.clone();

        this.dragging = false;
        this.lastX = 0;
        this.lastY = 0;
        this.autoRotate = false;

        this.bindEvents();
        this.update(0.016);
      }

      bindEvents() {
        this.domElement.addEventListener("pointerdown", (event) => {
          this.dragging = true;
          this.lastX = event.clientX;
          this.lastY = event.clientY;
          this.domElement.setPointerCapture(event.pointerId);
          this.domElement.classList.add("dragging");
        });

        this.domElement.addEventListener("pointermove", (event) => {
          if (!this.dragging) return;

          const dx = event.clientX - this.lastX;
          const dy = event.clientY - this.lastY;

          this.lastX = event.clientX;
          this.lastY = event.clientY;

          this.goalSpherical.theta -= dx * 0.006;
          this.goalSpherical.phi -= dy * 0.005;
          this.goalSpherical.phi = THREE.MathUtils.clamp(
            this.goalSpherical.phi,
            0.16,
            1.48
          );
        });

        const endDrag = (event) => {
          this.dragging = false;
          this.domElement.classList.remove("dragging");

          if (event.pointerId !== undefined &&
              this.domElement.hasPointerCapture(event.pointerId)) {
            this.domElement.releasePointerCapture(event.pointerId);
          }
        };

        this.domElement.addEventListener("pointerup", endDrag);
        this.domElement.addEventListener("pointercancel", endDrag);

        this.domElement.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            this.goalSpherical.radius *= Math.exp(event.deltaY * 0.001);
            this.goalSpherical.radius = THREE.MathUtils.clamp(
              this.goalSpherical.radius,
              7,
              36
            );
          },
          { passive: false }
        );

        this.domElement.addEventListener("dblclick", () => {
          this.setView("orbit");
        });
      }

      setView(name) {
        const views = {
          orbit: {
            target: new THREE.Vector3(0, 1.1, -0.2),
            spherical: new THREE.Spherical(17, 1.12, 2.55)
          },
          stern: {
            target: new THREE.Vector3(0, 1.35, -2.6),
            spherical: new THREE.Spherical(14.5, 1.16, 2.62)
          },
          deck: {
            target: new THREE.Vector3(0, 1.1, 1.25),
            spherical: new THREE.Spherical(10.8, 1.34, 2.3)
          },
          top: {
            target: new THREE.Vector3(0, 0, 0),
            spherical: new THREE.Spherical(18, 0.18, 0.05)
          }
        };

        const view = views[name];
        if (!view) return;

        this.goalTarget.copy(view.target);
        this.goalSpherical.copy(view.spherical);

        document.querySelectorAll("[data-view]").forEach((button) => {
          button.classList.toggle("active", button.dataset.view === name);
        });
      }

      update(delta) {
        if (this.autoRotate && !this.dragging) {
          this.goalSpherical.theta += delta * 0.085;
        }

        const smoothing = 1 - Math.exp(-7 * delta);
        this.spherical.radius = THREE.MathUtils.lerp(
          this.spherical.radius,
          this.goalSpherical.radius,
          smoothing
        );
        this.spherical.theta = THREE.MathUtils.lerp(
          this.spherical.theta,
          this.goalSpherical.theta,
          smoothing
        );
        this.spherical.phi = THREE.MathUtils.lerp(
          this.spherical.phi,
          this.goalSpherical.phi,
          smoothing
        );
        this.target.lerp(this.goalTarget, smoothing);

        this.spherical.makeSafe();

        this.camera.position
          .setFromSpherical(this.spherical)
          .add(this.target);

        this.camera.lookAt(this.target);
      }
    }

    const cameraRig = new CameraRig(camera, renderer.domElement);

    const viewButtons = [...document.querySelectorAll("[data-view]")];

    viewButtons.forEach((button) => {
      button.addEventListener("click", () => {
        cameraRig.setView(button.dataset.view);
      });
    });

    const rotateButton = document.getElementById("rotate");
    rotateButton.addEventListener("click", () => {
      cameraRig.autoRotate = !cameraRig.autoRotate;
      rotateButton.classList.toggle("active", cameraRig.autoRotate);
    });

    // -------------------------------------------------------------------------
    // Screen-space labels
    // -------------------------------------------------------------------------

    const craneLabel = document.getElementById("label-crane");
    const deckLabel = document.getElementById("label-deck");
    const labelPosition = new THREE.Vector3();

    function positionLabel(element, object) {
      object.getWorldPosition(labelPosition);
      labelPosition.project(camera);

      const visible = labelPosition.z > -1 && labelPosition.z < 1;
      element.style.display = visible ? "block" : "none";

      if (!visible) return;

      const x = (labelPosition.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-labelPosition.y * 0.5 + 0.5) * window.innerHeight;

      element.style.left = `${x}px`;
      element.style.top = `${y}px`;
    }

    // -------------------------------------------------------------------------
    // Resize and animation
    // -------------------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let frame = 0;

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      cameraRig.update(delta);

      // Gentle vessel motion.
      boat.position.y = 0.08 + Math.sin(elapsed * 0.72) * 0.035;
      boat.rotation.z = Math.sin(elapsed * 0.58) * 0.006;
      boat.rotation.x = Math.sin(elapsed * 0.46) * 0.004;

      // Crane hoisting and lowering cycle.
      const cranePhase = elapsed * 0.72;
      const hookHeight = 2.12 + Math.sin(cranePhase) * 0.48;

      hookGroup.position.set(0, hookHeight, -4.55);
      workingBuoy.position.set(0, hookHeight - 0.9, -4.55);
      workingBuoy.rotation.z = Math.sin(cranePhase) * 0.08;

      updateCylinderBetween(
        hoistCable,
        new THREE.Vector3(0, 4.18, -4.62),
        new THREE.Vector3(0, hookHeight, -4.55)
      );

      radar.rotation.y = elapsed * 0.55;

      // Water surface animation.
      const positions = waterGeometry.attributes.position;

      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const z = positions.getZ(i);

        const wave =
          Math.sin(x * 0.19 + elapsed * 0.8) * 0.075 +
          Math.sin(z * 0.27 - elapsed * 0.62) * 0.055 +
          Math.sin((x + z) * 0.43 + elapsed * 0.9) * 0.025;

        positions.setY(i, wave);
      }

      positions.needsUpdate = true;

      if (frame % 3 === 0) {
        waterGeometry.computeVertexNormals();
      }

      // Distant buoy bob.
      distantBuoy.position.y = Math.sin(elapsed * 0.7) * 0.045;

      positionLabel(craneLabel, hookGroup);
      positionLabel(deckLabel, boat);

      renderer.render(scene, camera);
      frame++;
    }

    renderer.setAnimationLoop(animate);

    requestAnimationFrame(() => {
      document.getElementById("loading").classList.add("hidden");
    });
  </script>
