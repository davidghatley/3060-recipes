<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bicycle Service Workshop</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171b1b;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .title-card {
      position: absolute;
      top: 22px;
      left: 22px;
      max-width: min(390px, calc(100vw - 44px));
      padding: 16px 18px;
      color: #f4eee0;
      background: rgba(20, 24, 24, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 12px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #e3ad4d;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 29px);
      line-height: 1.1;
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin: 7px 0 0;
      color: #b9c0bd;
      font-size: 12px;
      line-height: 1.45;
    }

    .controls {
      position: absolute;
      right: 20px;
      bottom: 20px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    button {
      appearance: none;
      padding: 10px 13px;
      color: #f2eee2;
      background: rgba(24, 29, 29, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover {
      background: rgba(47, 57, 56, 0.96);
      transform: translateY(-1px);
    }

    .help {
      position: absolute;
      left: 22px;
      bottom: 20px;
      padding: 9px 12px;
      color: #c4cacc;
      background: rgba(20, 24, 24, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      color: #e8e0d0;
      background: #171b1b;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: opacity 400ms ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .title-card {
        top: 12px;
        left: 12px;
        padding: 12px 14px;
      }

      .subtitle {
        display: none;
      }

      .help {
        left: 12px;
        bottom: 68px;
      }

      .controls {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="loading">Opening the workshop…</div>

  <div id="hud">
    <section class="title-card">
      <p class="eyebrow">Cycling Studio · Workshop 04</p>
      <h1>Bicycle Service</h1>
      <p class="subtitle">
        Repair stand, wheel truing station, hand tools, hanging tires,
        and organized parts bins.
      </p>
    </section>

    <div class="help">
      Drag to orbit · Wheel to zoom · Right-drag or Shift-drag to pan<br>
      Arrow keys rotate · + / − zoom · R resets the view
    </div>

    <nav class="controls" aria-label="Camera controls">
      <button id="resetView" type="button">Reset view</button>
      <button id="topView" type="button">Top view</button>
    </nav>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // ---------------------------------------------------------------------
    // Renderer, scene, and camera
    // ---------------------------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171b1b);
    scene.fog = new THREE.Fog(0x171b1b, 15, 30);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(
      43,
      window.innerWidth / window.innerHeight,
      0.08,
      80
    );

    const controls = {
      target: new THREE.Vector3(0, 1.55, -0.55),
      radius: 16.5,
      theta: 0.64,
      phi: 1.28
    };

    function updateCamera() {
      const sinPhi = Math.sin(controls.phi);

      camera.position.set(
        controls.target.x +
          controls.radius * sinPhi * Math.sin(controls.theta),
        controls.target.y + controls.radius * Math.cos(controls.phi),
        controls.target.z +
          controls.radius * sinPhi * Math.cos(controls.theta)
      );

      camera.lookAt(controls.target);
    }

    updateCamera();

    // ---------------------------------------------------------------------
    // Materials and geometry helpers
    // ---------------------------------------------------------------------

    const material = (color, roughness = 0.72, metalness = 0) =>
      new THREE.MeshStandardMaterial({ color, roughness, metalness });

    const M = {
      floor: material(0x303839, 0.96),
      wall: material(0x59615e, 0.92),
      trim: material(0x242a2a, 0.78),
      dark: material(0x171c1d, 0.68, 0.42),
      black: material(0x111515, 0.94),
      rubber: material(0x171a1a, 0.98),
      metal: material(0xaab4b1, 0.3, 0.72),
      brightMetal: material(0xd6dde0, 0.24, 0.8),
      wood: material(0x704327, 0.84),
      benchTop: material(0x8b5a36, 0.72),
      benchLeg: material(0x4b3020, 0.86),
      red: material(0xa8372c, 0.48, 0.18),
      teal: material(0x287c7b, 0.45, 0.18),
      yellow: material(0xd8a63b, 0.56),
      blue: material(0x294e60, 0.5, 0.2),
      cream: material(0xd8d0b7, 0.78),
      paper: material(0xe2d7b8, 0.9),
      green: material(0x355d43, 0.65),
      orange: material(0xc86832, 0.62),
      lamp: new THREE.MeshStandardMaterial({
        color: 0xffe5b2,
        emissive: 0xffc86b,
        emissiveIntensity: 2.2,
        roughness: 0.45
      })
    };

    function addBox(parent, size, position, mat, castShadow = true, receiveShadow = true) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        mat
      );
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(
      parent,
      radiusTop,
      radiusBottom,
      height,
      position,
      mat,
      segments = 16
    ) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        mat
      );
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addRod(parent, a, b, radius, mat) {
      const start = a.isVector3 ? a : new THREE.Vector3(...a);
      const end = b.isVector3 ? b : new THREE.Vector3(...b);
      const direction = end.clone().sub(start);
      const length = direction.length();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, 10),
        mat
      );

      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addTorus(
      parent,
      radius,
      tube,
      position,
      mat,
      radialSegments = 10,
      tubularSegments = 48
    ) {
      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(
          radius,
          tube,
          radialSegments,
          tubularSegments
        ),
        mat
      );
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addSphere(parent, radius, position, mat) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 16, 12),
        mat
      );
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // ---------------------------------------------------------------------
    // Workshop shell
    // ---------------------------------------------------------------------

    addBox(scene, [11.2, 0.24, 13.2], [0, -0.12, 0], M.floor);
    addBox(scene, [11.2, 6, 0.22], [0, 3, -6.15], M.wall);
    addBox(scene, [0.22, 6, 13.2], [-5.55, 3, 0], M.wall);
    addBox(scene, [0.22, 1.05, 13.2], [5.55, 0.525, 0], M.wall);

    // Low front wall on the right preserves the cutaway interior view.
    addBox(scene, [0.22, 1.05, 2.4], [5.55, 0.525, -4.55], M.wall);

    addBox(scene, [11, 0.12, 0.12], [0, 0.08, -5.98], M.trim);
    addBox(scene, [0.12, 0.12, 13], [-5.38, 0.08, 0], M.trim);
    addBox(scene, [0.12, 0.12, 13], [5.38, 0.08, 0], M.trim);

    // Floor lane markings.
    addBox(scene, [0.055, 0.012, 11.5], [-4.65, 0.012, 0.5], M.yellow, false, false);
    addBox(scene, [0.055, 0.012, 11.5], [4.65, 0.012, 0.5], M.yellow, false, false);

    // Wall columns and overhead beam.
    addBox(scene, [0.28, 5.8, 0.3], [-5.3, 2.9, -5.8], M.trim);
    addBox(scene, [0.28, 5.8, 0.3], [5.3, 2.9, -5.8], M.trim);
    addBox(scene, [10.8, 0.16, 0.22], [0, 5.55, -1.5], M.trim);

    // Ceiling lights.
    for (const z of [-2.8, 1.3]) {
      addBox(scene, [2.5, 0.12, 0.34], [-0.8, 5.35, z], M.dark);
      addBox(
        scene,
        [2.15, 0.055, 0.22],
        [-0.8, 5.25, z],
        M.lamp,
        false,
        false
      );

      const light = new THREE.PointLight(0xffd9a0, 24, 8, 2);
      light.position.set(-0.8, 4.95, z);
      scene.add(light);
    }

    // ---------------------------------------------------------------------
    // Pegboard panels and hand tools
    // ---------------------------------------------------------------------

    function makePegboardTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#9b7043";
      ctx.fillRect(0, 0, 512, 512);

      const cell = 24;
      const offset = 0;

      for (let row = 0; row < 23; row++) {
        for (let col = 0; col < 21; col++) {
          const x = col * cell + offset;
          const y = row * cell;
          const gradient = ctx.createRadialGradient(
            x + 3,
            y + 3,
            0,
            x,
            y,
            5
          );
          gradient.addColorStop(0, "rgba(35,24,13,0.88)");
          gradient.addColorStop(1, "rgba(35,24,13,0)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, y, 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.strokeStyle = "rgba(60,40,20,0.25)";
      ctx.lineWidth = 2;
      for (let i = 0; i <= 512; i += cell) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, 512);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(512, i);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const pegTexture = makePegboardTexture();

    function makePegboard(x, width, y, height) {
      addBox(
        scene,
        [width + 0.1, height + 0.1, 0.1],
        [x, y, -6.03],
        M.wood
      );

      const board = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshStandardMaterial({
          map: pegTexture,
          roughness: 1
        })
      );
      board.position.set(x, y, -5.965);
      board.receiveShadow = true;
      scene.add(board);
      return board;
    }

    makePegboard(-2.72, 3.35, 3.35, 2.25);
    makePegboard(3.05, 2.2, 3.35, 2.25);

    function addWrench(x, y, z) {
      addRod(scene, [x, y, z], [x, y + 0.28, z], 0.026, M.metal);
      addRod(scene, [x - 0.18, y + 0.25, z], [x, y + 0.43, z], 0.027, M.metal);
      addRod(scene, [x + 0.18, y + 0.25, z], [x, y + 0.43, z], 0.027, M.metal);
      addRod(scene, [x - 0.18, y + 0.25, z], [x, y + 0.12, z], 0.025, M.metal);
      addRod(scene, [x + 0.18, y + 0.25, z], [x, y + 0.12, z], 0.025, M.metal);
    }

    function addHammer(x, y, z) {
      addRod(scene, [x, y, z], [x, y + 0.46, z], 0.025, M.wood);
      addBox(scene, [0.28, 0.12, 0.12], [x, y + 0.5, z], M.metal);
      addBox(scene, [0.34, 0.06, 0.14], [x, y + 0.5, z], M.dark);
    }

    function addScrewdriver(x, y, z, color = M.red) {
      addCylinder(scene, 0.055, 0.07, 0.18, [x, y + 0.09, z], color);
      addRod(scene, [x, y + 0.18, z], [x, y + 0.55, z], 0.018, M.metal);
      addRod(scene, [x, y + 0.55, z], [x + 0.12, y + 0.55, z], 0.026, M.metal);
    }

    function addPliers(x, y, z) {
      addRod(scene, [x - 0.08, y, z], [x + 0.08, y + 0.28, z], 0.022, M.metal);
      addRod(scene, [x + 0.08, y, z], [x - 0.08, y + 0.28, z], 0.022, M.metal);
      addRod(scene, [x - 0.12, y, z], [x - 0.3, y - 0.12, z], 0.025, M.dark);
      addRod(scene, [x + 0.12, y, z], [x + 0.3, y - 0.12, z], 0.025, M.dark);
    }

    function addGlueBottle(x, y, z) {
      addCylinder(scene, 0.095, 0.11, 0.28, [x, y + 0.14, z], M.cream);
      addCylinder(scene, 0.06, 0.075, 0.09, [x, y + 0.34, z], M.red);
      addCylinder(scene, 0.055, 0.055, 0.025, [x, y + 0.405, z], M.dark);
    }

    function addSprayCan(x, y, z) {
      addCylinder(scene, 0.11, 0.13, 0.28, [x, y + 0.14, z], M.teal);
      addCylinder(scene, 0.035, 0.035, 0.13, [x, y + 0.34, z], M.metal);
      addRod(scene, [x, y + 0.41, z], [x + 0.1, y + 0.41, z], 0.02, M.black);
    }

    function addTorqueWrench(x, y, z) {
      addCylinder(scene, 0.085, 0.1, 0.25, [x, y + 0.12, z], M.yellow);
      addRod(scene, [x, y + 0.25, z], [x, y + 0.48, z], 0.025, M.dark);
      addRod(scene, [x, y + 0.48, z], [x + 0.18, y + 0.48, z], 0.027, M.metal);
    }

    const toolPositions = [
      [-3.75, 3.35],
      [-3.18, 3.35],
      [-2.62, 3.55],
      [-2.12, 3.35],
      [3.48, 3.35],
      [3.05, 3.62],
      [2.63, 3.35]
    ];

    toolPositions.forEach(([x, y], index) => {
      if (index === 0) addWrench(x, y, -5.82);
      if (index === 1) addHammer(x, y, -5.82);
      if (index === 2) addScrewdriver(x, y, -5.82, M.red);
      if (index === 3) addPliers(x, y, -5.82);
      if (index === 4) addGlueBottle(x, y, -5.82);
      if (index === 5) addSprayCan(x, y, -5.82);
      if (index === 6) addTorqueWrench(x, y, -5.82);
    });

    // Wall sign.
    function makeSignTexture(title, subtitle) {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#171d1d";
      ctx.fillRect(0, 0, 1024, 256);
      ctx.strokeStyle = "#d8a64f";
      ctx.lineWidth = 8;
      ctx.strokeRect(12, 12, 1000, 232);

      ctx.textAlign = "center";
      ctx.fillStyle = "#eee5d2";
      ctx.font = "700 76px sans-serif";
      ctx.fillText(title, 512, 112);

      ctx.fillStyle = "#b9b9a7";
      ctx.font = "500 30px sans-serif";
      ctx.fillText(subtitle, 512, 173);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(3.65, 0.92),
      new THREE.MeshBasicMaterial({
        map: makeSignTexture("BICYCLE SERVICE", "REPAIR  ·  TRUING  ·  FIT")
      })
    );
    sign.position.set(0, 4.28, -5.84);
    scene.add(sign);

    // ---------------------------------------------------------------------
    // Hanging tires
    // ---------------------------------------------------------------------

    function addHook(x, y, z) {
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(x + 0.55, y, z),
        new THREE.Vector3(x + 0.55, y + 0.1, z + 0.04),
        new THREE.Vector3(x + 0.45, y + 0.2, z + 0.08)
      ]);

      const hook = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 18, 0.018, 7, false),
        M.metal
      );
      hook.castShadow = true;
      scene.add(hook);
    }

    function makeHangingTire(x, labelX) {
      addHook(x, 3.68, -5.78);

      const tire = addTorus(
        scene,
        0.55,
        0.065,
        [x, 3.08, -5.52],
        M.rubber,
        12,
        56
      );
      tire.rotation.z = -0.08;

      addTorus(
        scene,
        0.485,
        0.027,
        [x, 3.08, -5.45],
        M.metal,
        10,
        48
      );

      addCylinder(
        scene,
        0.012,
        0.012,
        0.2,
        [x + 0.55, 3.61, -5.5],
        M.black,
        8
      );

      addBox(
        scene,
        [0.22, 0.1, 0.03],
        [labelX, 3.1, -5.43],
        M.yellow
      );
    }

    makeHangingTire(-0.25, -0.25);
    makeHangingTire(1.1, 1.1);

    // ---------------------------------------------------------------------
    // Workbench along the left wall
    // ---------------------------------------------------------------------

    const bench = new THREE.Group();
    scene.add(bench);

    addBox(bench, [2.45, 0.16, 5.8], [-3.8, 1.35, 0.15], M.benchTop);
    addBox(bench, [2.1, 0.12, 5.5], [-3.8, 0.35, 0.15], M.wood);

    for (const x of [-4.55, -3.05]) {
      for (const z of [-2.25, 2.55]) {
        addBox(bench, [0.16, 1.25, 0.16], [x, 0.62, z], M.benchLeg);
      }
    }

    // Drawer fronts on the camera-facing side.
    addBox(bench, [0.08, 0.62, 5.35], [-2.62, 0.72, 0.15], M.wood);
    for (let z = -1.95; z <= 2.2; z += 1.3) {
      addBox(bench, [0.045, 0.11, 0.42], [-2.56, 0.75, z], M.metal);
    }

    // Bench vise.
    addBox(bench, [0.42, 0.3, 0.5], [-3.8, 1.5, -1.65], M.dark);
    addRod(
      bench,
      [-4.03, 1.62, -1.65],
      [-4.03, 2.0, -1.65],
      0.055,
      M.metal
    );
    addRod(
      bench,
      [-4.03, 2.0, -1.65],
      [-3.62, 2.0, -1.65],
      0.055,
      M.metal
    );
    addRod(
      bench,
      [-3.62, 2.0, -1.65],
      [-3.62, 1.55, -1.65],
      0.055,
      M.metal
    );

    // Bench tools and parts.
    addCylinder(bench, 0.09, 0.11, 0.28, [-4.25, 1.5, 1.3], M.cream);
    addCylinder(bench, 0.06, 0.065, 0.09, [-4.25, 1.66, 1.3], M.red);

    addBox(bench, [0.38, 0.055, 0.24], [-3.05, 1.45, 1.9], M.dark);
    addBox(bench, [0.28, 0.04, 0.18], [-2.88, 1.49, 1.9], M.metal);

    // Coiled cable on the bench.
    const cable = addTorus(
      bench,
      0.22,
      0.025,
      [-3.95, 1.47, -0.5],
      M.black,
      8,
      36
    );
    cable.rotation.x = Math.PI / 2;

    // Floor mat.
    addBox(scene, [3.25, 0.025, 2.05], [-1.2, 0.025, 2.65], M.teal, false, true);
    for (const x of [-2.35, -0.05]) {
      addBox(scene, [0.035, 0.008, 1.85], [x, 0.042, 2.65], M.dark, false, false);
    }

    // Stool.
    const stool = new THREE.Group();
    stool.position.set(-3.8, 0, 3.55);
    scene.add(stool);

    addCylinder(stool, 0.38, 0.38, 0.12, [0, 0.72, 0], M.teal);
    for (let i = 0; i < 4; i++) {
      const angle = (i / 4) * Math.PI * 2;
      addRod(
        stool,
        [0, 0.68, 0],
        [Math.cos(angle) * 0.31, 0.08, Math.sin(angle) * 0.31],
        0.035,
        M.metal
      );
    }
    addCylinder(stool, 0.11, 0.11, 0.08, [0, 0.08, 0], M.dark);

    // ---------------------------------------------------------------------
    // Repair stand and bicycle frame
    // ---------------------------------------------------------------------

    const repairStand = new THREE.Group();
    repairStand.position.set(-1.15, 0, 0.15);
    scene.add(repairStand);

    addBox(repairStand, [1.05, 0.12, 0.85], [0, 0.1, -0.25], M.dark);
    addBox(repairStand, [0.72, 0.08, 0.6], [0, 0.19, -0.25], M.metal);
    addCylinder(repairStand, 0.075, 0.09, 2.72, [0, 1.52, -0.38], M.metal);
    addBox(repairStand, [0.55, 0.28, 0.3], [0, 2.84, -0.38], M.dark);

    addRod(
      repairStand,
      [0, 2.76, -0.38],
      [0, 1.35, 0.15],
      0.065,
      M.metal
    );

    addBox(repairStand, [0.34, 0.22, 0.24], [0, 1.35, 0.15], M.brightMetal);
    addBox(repairStand, [0.12, 0.18, 0.14], [0.12, 1.35, 0.15], M.dark);
    addBox(repairStand, [0.12, 0.18, 0.14], [-0.12, 1.35, 0.15], M.dark);

    const bike = new THREE.Group();
    bike.position.set(-1.15, 0, 0.15);
    scene.add(bike);

    const rearWheel = makeWheel(bike, 0, 0.64, -0.05, 0.64);
    const frontWheel = makeWheel(bike, 0, 0.64, 0.65, 0.64);

    // Bottom bracket, seat tube, top tube, and head tube.
    addRod(bike, [0, 1.35, 0], [0, 0.64, -0.05], 0.045, M.red);
    addRod(bike, [0, 1.35, 0], [0.02, 2.25, 0], 0.048, M.red);
    addRod(bike, [0.02, 2.25, 0], [0.22, 2.55, 0], 0.047, M.red);
    addRod(bike, [0.22, 2.48, 0], [0.22, 2.65, 0], 0.055, M.red);

    // Seat post and saddle.
    addRod(bike, [0.02, 2.25, 0], [0.02, 2.47, 0], 0.035, M.metal);
    addBox(bike, [0.27, 0.09, 0.16], [0.02, 2.49, 0], M.black);

    // Handlebar stem and crossbar.
    addRod(bike, [0.22, 2.61, 0], [0.22, 2.78, 0], 0.035, M.metal);
    addRod(bike, [0.22, 2.79, -0.48], [0.22, 2.79, 0.48], 0.027, M.dark);
    for (const z of [-0.48, 0.48]) {
      addRod(bike, [0.22, 2.79, z], [0.22, 2.66, z], 0.025, M.metal);
    }

    // Fork.
    addRod(bike, [0.22, 2.55, -0.08], [0.08, 0.64, 0.65], 0.026, M.metal);
    addRod(bike, [0.22, 2.55, 0.08], [0.08, 0.64, 0.65], 0.026, M.metal);
    addRod(bike, [0.22, 2.55, 0], [0.08, 0.64, 0.65], 0.035, M.metal);

    // Crank, chainring, pedals, and chain.
    const crank = addTorus(
      bike,
      0.13,
      0.018,
      [0, 1.35, 0],
      M.dark,
      8,
      28
    );
    crank.rotation.x = Math.PI / 2;

    addRod(bike, [0, 1.35, 0.1], [0, 1.35, 0.2], 0.018, M.metal);
    addBox(bike, [0.13, 0.045, 0.08], [0.2, 1.35, 0.2], M.black);
    addBox(bike, [0.13, 0.045, 0.08], [-0.2, 1.35, 0.2], M.black);

    // ---------------------------------------------------------------------
    // Wheel truing station
    // ---------------------------------------------------------------------

    const truingStand = new THREE.Group();
    truingStand.position.set(1.05, 0, 0.15);
    scene.add(truingStand);

    addBox(truingStand, [0.9, 0.12, 0.7], [0, 0.1, -0.25], M.dark);
    addBox(truingStand, [0.65, 0.08, 0.55], [0, 0.19, -0.25], M.metal);
    addCylinder(truingStand, 0.075, 0.09, 2.75, [0, 1.5, -0.48], M.metal);
    addBox(truingStand, [0.5, 0.26, 0.28], [0, 2.82, -0.48], M.dark);

    addRod(
      truingStand,
      [0, 2.75, -0.48],
      [0, 1.55, 0.15],
      0.06,
      M.metal
    );

    addBox(truingStand, [0.3, 0.2, 0.25], [0, 1.55, 0.15], M.brightMetal);
    addBox(truingStand, [0.1, 0.16, 0.14], [0.1, 1.55, 0.15], M.dark);
    addBox(truingStand, [0.1, 0.16, 0.14], [-0.1, 1.55, 0.15], M.dark);

    const truingWheel = makeWheel(truingStand, 0, 1.55, 0.15, 0.78);
    addBox(truingWheel, [0.07, 0.18, 0.08], [0.64, 0.18, 0], M.yellow);

    // Truing screw and hand lever.
    addRod(
      truingStand,
      [0, 1.55, 0.2],
      [0.38, 1.55, 0.2],
      0.025,
      M.brightMetal
    );
    addRod(
      truingStand,
      [0.34, 1.55, 0.2],
      [0.57, 1.68, 0.2],
      0.03,
      M.dark
    );
    addCylinder(
      truingStand,
      0.065,
      0.065,
      0.12,
      [0.57, 1.68, 0.2],
      M.metal
    );

    // ---------------------------------------------------------------------
    // Parts shelf and bins
    // ---------------------------------------------------------------------

    addBox(scene, [4.55, 0.12, 0.7], [2.15, 1.65, -5.35], M.wood);
    for (const x of [0.05, 4.25]) {
      addRod(
        scene,
        [x, 1.45, -5.62],
        [x, 1.75, -5.62],
        0.025,
        M.metal
      );
    }

    function makeBin(x, y, z, w, h, d, mat) {
      addBox(scene, [w, h, d], [x, y + h / 2, z], mat);
      addBox(scene, [w + 0.04, 0.06, d + 0.04], [x, y + h, z], mat);
      addBox(scene, [0.04, h, d], [x - w / 2, y + h / 2, z], mat);
      addBox(scene, [0.04, h, d], [x + w / 2, y + h / 2, z], mat);
      addBox(scene, [w, h, 0.04], [x, y + h / 2, z - d / 2], mat);
      addBox(scene, [w, h, 0.04], [x, y + h / 2, z + d / 2], mat);
    }

    const binMaterials = [M.green, M.blue, M.orange, M.teal];

    for (let i = 0; i < 4; i++) {
      const x = 0.55 + i * 1.08;
      makeBin(
        x,
        1.72,
        -5.35,
        0.82,
        0.42,
        0.48,
        binMaterials[i]
      );

      if (i % 2 === 0) {
        addBox(
          scene,
          [0.28, 0.18, 0.25],
          [x - 0.12, 1.98, -5.35],
          M.metal
        );
      } else {
        addCylinder(
          scene,
          0.09,
          0.1,
          0.2,
          [x + 0.12, 2.0, -5.35],
          M.cream
        );
      }
    }

    addBox(
      scene,
      [2.15, 0.48, 0.04],
      [2.15, 2.32, -5.76],
      M.dark
    );
    addBox(
      scene,
      [1.85, 0.26, 0.03],
      [2.15, 2.32, -5.73],
      M.yellow
    );

    // ---------------------------------------------------------------------
    // Additional workshop details
    // ---------------------------------------------------------------------

    // Tool chest.
    const toolChest = new THREE.Group();
    toolChest.position.set(3.85, 0, 2.55);
    scene.add(toolChest);

    addBox(toolChest, [1.25, 1.25, 0.62], [0, 0.62, 0], M.blue);
    for (let i = 0; i < 3; i++) {
      addBox(
        toolChest,
        [1.08, 0.34, 0.035],
        [0, 0.36 + i * 0.39, 0.325],
        M.blue
      );
      addBox(
        toolChest,
        [0.34, 0.045, 0.05],
        [0, 0.36 + i * 0.39, 0.36],
        M.metal
      );
    }
    addBox(toolChest, [0.48, 0.16, 0.08], [0, 1.34, 0.34], M.dark);
    addBox(toolChest, [0.34, 0.04, 0.03], [0, 1.34, 0.39], M.metal);

    // Cable coil and small parts on the floor.
    const floorCable = addTorus(
      scene,
      0.35,
      0.025,
      [3.4, 0.05, -2.1],
      M.black,
      8,
      36
    );
    floorCable.rotation.x = Math.PI / 2;

    for (let i = 0; i < 4; i++) {
      addBox(
        scene,
        [0.18, 0.12, 0.18],
        [2.75 + (i % 2) * 0.22, 0.08, -2.25 + Math.floor(i / 2) * 0.22],
        i % 2 ? M.green : M.orange
      );
    }

    // Wall-mounted service light.
    addBox(scene, [0.55, 0.16, 0.18], [-4.9, 3.95, -5.78], M.dark);
    addBox(
      scene,
      [0.4, 0.08, 0.1],
      [-4.9, 3.95, -5.68],
      M.lamp,
      false,
      false
    );

    // ---------------------------------------------------------------------
    // Lighting
    // ---------------------------------------------------------------------

    const hemisphere = new THREE.HemisphereLight(0xc6dde0, 0x2a2119, 1.35);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0xffe0ad, 3.1);
    sun.position.set(4.5, 8, 6);
    sun.target.position.set(0, 1.4, -1.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -10;
    sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10;
    sun.shadow.camera.bottom = -10;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 30;
    sun.shadow.bias = -0.00035;
    scene.add(sun);
    scene.add(sun.target);

    const coolFill = new THREE.DirectionalLight(0x9fc7d4, 1.1);
    coolFill.position.set(-7, 5, 2);
    scene.add(coolFill);

    const repairLight = new THREE.SpotLight(
      0xffd7a0,
      75,
      12,
      Math.PI / 5,
      0.55,
      1.5
    );
    repairLight.position.set(-1.5, 4.8, 1.5);
    repairLight.target.position.set(-1.15, 1.2, 0.15);
    repairLight.castShadow = true;
    repairLight.shadow.mapSize.set(1024, 1024);
    scene.add(repairLight);
    scene.add(repairLight.target);

    // ---------------------------------------------------------------------
    // Custom camera controls — no external controls module
    // ---------------------------------------------------------------------

    const canvas = renderer.domElement;
    const pointers = new Map();
    let lastPointer = { x: 0, y: 0 };
    let pinchDistance = 0;

    function pointerDistance() {
      const values = [...pointers.values()];
      if (values.length < 2) return 0;
      return Math.hypot(
        values[0].x - values[1].x,
        values[0].y - values[1].y
      );
    }

    function panCamera(dx, dy) {
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
      const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
      const scale = controls.radius * 0.00125;

      controls.target.addScaledVector(right, -dx * scale);
      controls.target.addScaledVector(up, dy * scale);
    }

    canvas.addEventListener("contextmenu", event => event.preventDefault());

    canvas.addEventListener("pointerdown", event => {
      canvas.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (pointers.size === 1) {
        lastPointer = {
          x: event.clientX,
          y: event.clientY
        };
      } else if (pointers.size === 2) {
        pinchDistance = pointerDistance();
      }
    });

    canvas.addEventListener("pointermove", event => {
      if (!pointers.has(event.pointerId)) return;

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (pointers.size === 1) {
        const dx = event.clientX - lastPointer.x;
        const dy = event.clientY - lastPointer.y;
        lastPointer = {
          x: event.clientX,
          y: event.clientY
        };

        if (event.shiftKey || event.buttons === 2) {
          panCamera(dx, dy);
        } else {
          controls.theta -= dx * 0.005;
          controls.phi = THREE.MathUtils.clamp(
            controls.phi - dy * 0.005,
            0.08,
            1.48
          );
        }
      } else if (pointers.size === 2) {
        const distance = pointerDistance();
        if (pinchDistance > 0 && distance > 0) {
          controls.radius = THREE.MathUtils.clamp(
            controls.radius * (pinchDistance / distance),
            7,
            25
          );
        }
        pinchDistance = distance;
      }
    });

    function releasePointer(event) {
      pointers.delete(event.pointerId);
      if (pointers.size === 1) {
        const remaining = [...pointers.values()][0];
        lastPointer = { x: remaining.x, y: remaining.y };
      }
      pinchDistance = pointers.size === 2 ? pointerDistance() : 0;
    }

    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);

    canvas.addEventListener(
      "wheel",
      event => {
        event.preventDefault();
        controls.radius = THREE.MathUtils.clamp(
          controls.radius * Math.exp(event.deltaY * 0.001),
          7,
          25
        );
      },
      { passive: false }
    );

    function resetView() {
      controls.target.set(0, 1.55, -0.55);
      controls.radius = 16.5;
      controls.theta = 0.64;
      controls.phi = 1.28;
    }

    document.getElementById("resetView").addEventListener("click", resetView);

    document.getElementById("topView").addEventListener("click", () => {
      controls.target.set(0, 1.4, -0.8);
      controls.radius = 17.5;
      controls.theta = 0;
      controls.phi = 0.12;
    });

    window.addEventListener("keydown", event => {
      switch (event.key) {
        case "ArrowLeft":
          controls.theta -= 0.08;
          break;
        case "ArrowRight":
          controls.theta += 0.08;
          break;
        case "ArrowUp":
          controls.phi = Math.max(0.08, controls.phi - 0.06);
          break;
        case "ArrowDown":
          controls.phi = Math.min(1.48, controls.phi + 0.06);
          break;
        case "+":
        case "=":
          controls.radius = Math.max(7, controls.radius * 0.9);
          break;
        case "-":
          controls.radius = Math.min(25, controls.radius * 1.1);
          break;
        case "r":
        case "R":
          resetView();
          break;
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // ---------------------------------------------------------------------
    // Animation
    // ---------------------------------------------------------------------

    const clock = new THREE.Clock();

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);

      truingWheel.rotation.z += dt * 0.16;

      updateCamera();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(() => {
      document.getElementById("loading").classList.add("hidden");
    });

    animate();
  </script>
</body>
</html>
