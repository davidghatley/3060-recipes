<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryogenic Dilution Refrigerator</title>

  <style>
    :root {
      color-scheme: dark;
      --cyan: #68e7ff;
      --cyan-soft: rgba(104, 231, 255, 0.18);
      --panel: rgba(9, 20, 30, 0.78);
      --border: rgba(137, 216, 238, 0.22);
      --text: #e8f7ff;
      --muted: #91aab6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, #152a39 0%, #08131d 48%, #03080d 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .title-block {
      position: absolute;
      top: 28px;
      left: 30px;
      max-width: 430px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 9px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 24px;
      height: 1px;
      content: "";
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 3.2vw, 46px);
      font-weight: 650;
      line-height: 1.05;
      letter-spacing: -0.035em;
      text-shadow: 0 3px 24px rgba(0, 0, 0, 0.55);
    }

    .subtitle {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .control-panel {
      position: absolute;
      right: 26px;
      bottom: 25px;
      width: min(310px, calc(100vw - 32px));
      padding: 16px;
      pointer-events: auto;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .control-row:last-child {
      margin-bottom: 0;
    }

    .control-row label {
      color: #c8dde7;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    output {
      color: var(--cyan);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      margin: 5px 0 15px;
      appearance: none;
      border-radius: 99px;
      background: linear-gradient(
        to right,
        var(--cyan) 0%,
        var(--cyan) var(--fill, 0%),
        rgba(137, 216, 238, 0.15) var(--fill, 0%),
        rgba(137, 216, 238, 0.15) 100%
      );
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 15px;
      height: 15px;
      appearance: none;
      border: 2px solid #dff8ff;
      border-radius: 50%;
      background: #36b9dd;
      box-shadow: 0 0 12px rgba(104, 231, 255, 0.65);
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 2px solid #dff8ff;
      border-radius: 50%;
      background: #36b9dd;
      box-shadow: 0 0 12px rgba(104, 231, 255, 0.65);
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    button {
      min-height: 34px;
      padding: 8px 10px;
      border: 1px solid rgba(137, 216, 238, 0.18);
      border-radius: 8px;
      background: rgba(122, 190, 210, 0.08);
      color: #cfefff;
      font: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 160ms ease;
    }

    button:hover {
      border-color: rgba(104, 231, 255, 0.55);
      background: rgba(104, 231, 255, 0.13);
      transform: translateY(-1px);
    }

    button.active {
      border-color: rgba(104, 231, 255, 0.55);
      background: rgba(104, 231, 255, 0.17);
      color: #ffffff;
    }

    .hint {
      position: absolute;
      left: 30px;
      bottom: 27px;
      color: rgba(177, 205, 218, 0.66);
      font-size: 10px;
      letter-spacing: 0.08em;
      line-height: 1.7;
      text-transform: uppercase;
    }

    .status {
      position: absolute;
      top: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #b9d5e3;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #65ffb4;
      box-shadow: 0 0 10px #65ffb4;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: #07111a;
      transition: opacity 500ms ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      color: var(--cyan);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
    }

    .loader::after {
      display: block;
      width: 120px;
      height: 1px;
      margin: 16px auto 0;
      content: "";
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: load 1.1s ease-in-out infinite;
    }

    @keyframes load {
      0%,
      100% {
        opacity: 0.25;
        transform: scaleX(0.45);
      }
      50% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    @media (max-width: 700px) {
      .title-block {
        top: 20px;
        left: 20px;
      }

      .subtitle {
        max-width: 280px;
      }

      .status {
        top: 20px;
        right: 20px;
      }

      .control-panel {
        right: 16px;
        bottom: 16px;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="scene"></div>

  <div class="hud">
    <div class="title-block">
      <div class="eyebrow">Cryogenic Systems / DR-01</div>
      <h1>Dilution Refrigerator</h1>
      <p class="subtitle">
        Multi-stage thermal vessel with insulated plate stacks, vacuum jacket,
        service harness, and low-temperature instrumentation.
      </p>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      <span>SYSTEM READY · 2.0 K</span>
    </div>

    <div class="hint">
      Drag to orbit<br />
      Right-drag or Shift-drag to pan<br />
      Scroll to zoom
    </div>

    <div class="control-panel">
      <div class="control-row">
        <label for="spread">Plate separation</label>
        <output id="spreadValue" for="spread">0%</output>
      </div>
      <input
        id="spread"
        type="range"
        min="0"
        max="100"
        value="0"
        aria-label="Plate separation"
      />

      <div class="button-row">
        <button id="spreadToggle" type="button">Assemble plates</button>
        <button id="orbitToggle" class="active" type="button">Auto orbit</button>
        <button id="labelsToggle" class="active" type="button">Labels</button>
        <button id="resetView" type="button">Reset view</button>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="loader">INITIALIZING CRYOGENIC SYSTEM</div>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const sceneHost = document.getElementById("scene");
    const loading = document.getElementById("loading");

    // -------------------------------------------------------------------------
    // Renderer, camera, and scene
    // -------------------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    sceneHost.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x08131d, 0.034);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    // -------------------------------------------------------------------------
    // Procedural environment map for metallic surfaces
    // -------------------------------------------------------------------------

    function createEnvironmentTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 512;

      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, "#6c8ba5");
      gradient.addColorStop(0.42, "#182935");
      gradient.addColorStop(0.72, "#071019");
      gradient.addColorStop(1, "#020508");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 1024, 512);

      const lights = [
        [170, 120, 210, "#d9f3ff"],
        [720, 90, 260, "#8bdfff"],
        [490, 340, 180, "#ffffff"],
        [930, 320, 130, "#67dfff"]
      ];

      for (const [x, y, w, color] of lights) {
        const glow = ctx.createRadialGradient(x, y, 0, x, y, w);
        glow.addColorStop(0, color);
        glow.addColorStop(0.25, `${color}88`);
        glow.addColorStop(1, `${color}00`);
        ctx.fillStyle = glow;
        ctx.fillRect(x - w, y - w, w * 2, w * 2);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.mapping = THREE.EquirectangularReflectionMapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const environmentTexture = createEnvironmentTexture();
    const pmrem = new THREE.PMREMGenerator(renderer);
    const environmentTarget = pmrem.fromEquirectangular(environmentTexture);
    scene.environment = environmentTarget.texture;
    environmentTexture.dispose();
    pmrem.dispose();

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    const materials = {
      enamel: new THREE.MeshPhysicalMaterial({
        color: 0xe3eaed,
        metalness: 0.18,
        roughness: 0.28,
        clearcoat: 0.72,
        clearcoatRoughness: 0.25,
        envMapIntensity: 0.85
      }),
      white: new THREE.MeshStandardMaterial({
        color: 0xdde5e8,
        metalness: 0.12,
        roughness: 0.4,
        envMapIntensity: 0.7
      }),
      steel: new THREE.MeshStandardMaterial({
        color: 0xaebbc3,
        metalness: 0.9,
        roughness: 0.24,
        envMapIntensity: 1.35
      }),
      brushed: new THREE.MeshStandardMaterial({
        color: 0x71818b,
        metalness: 0.86,
        roughness: 0.36,
        envMapIntensity: 1.15
      }),
      darkMetal: new THREE.MeshStandardMaterial({
        color: 0x25323b,
        metalness: 0.78,
        roughness: 0.32,
        envMapIntensity: 1.0
      }),
      black: new THREE.MeshStandardMaterial({
        color: 0x090d10,
        metalness: 0.35,
        roughness: 0.55
      }),
      rubber: new THREE.MeshStandardMaterial({
        color: 0x11171b,
        metalness: 0.05,
        roughness: 0.9
      }),
      cyan: new THREE.MeshStandardMaterial({
        color: 0x43c9e8,
        emissive: 0x0b6c83,
        emissiveIntensity: 0.7,
        metalness: 0.45,
        roughness: 0.3
      }),
      green: new THREE.MeshStandardMaterial({
        color: 0x73ffb1,
        emissive: 0x165f2b,
        emissiveIntensity: 1.4,
        roughness: 0.25
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xff6555,
        emissive: 0x6a170c,
        emissiveIntensity: 0.55,
        roughness: 0.35
      }),
      amber: new THREE.MeshStandardMaterial({
        color: 0xffb647,
        emissive: 0x6a3b05,
        emissiveIntensity: 0.55,
        roughness: 0.35
      }),
      blue: new THREE.MeshStandardMaterial({
        color: 0x4c8cff,
        emissive: 0x12366f,
        emissiveIntensity: 0.65,
        roughness: 0.32
      }),
      purple: new THREE.MeshStandardMaterial({
        color: 0xa465ff,
        emissive: 0x24104b,
        emissiveIntensity: 0.6,
        roughness: 0.32
      }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0x8adfff,
        transparent: true,
        opacity: 0.08,
        roughness: 0.1,
        metalness: 0,
        transmission: 0.35,
        thickness: 0.2,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    };

    // -------------------------------------------------------------------------
    // Geometry helpers
    // -------------------------------------------------------------------------

    function mesh(geometry, material, position, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      if (position) object.position.set(...position);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function cylinder(
      radiusTop,
      radiusBottom,
      height,
      material,
      position,
      segments = 64,
      parent = scene
    ) {
      return mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          segments
        ),
        material,
        position,
        parent
      );
    }

    function torus(radius, tube, material, position, rotation = null, parent = scene) {
      return mesh(
        new THREE.TorusGeometry(radius, tube, 10, 64),
        material,
        position,
        parent
      );
    }

    function tube(points, radius, material, parent = scene, segments = 72) {
      const curve = new THREE.CatmullRomCurve3(
        points.map((point) => new THREE.Vector3(...point)),
        false,
        "catmullrom",
        0.25
      );
      return mesh(
        new THREE.TubeGeometry(curve, segments, radius, 8, false),
        material,
        null,
        parent
      );
    }

    function flange(position, axis, radius = 0.14, parent = scene) {
      const flangeMesh = cylinder(
        radius,
        radius,
        0.075,
        materials.brushed,
        position,
        40,
        parent
      );

      if (axis === "x") flangeMesh.rotation.z = Math.PI / 2;
      if (axis === "z") flangeMesh.rotation.x = Math.PI / 2;
      return flangeMesh;
    }

    function annularPlateGeometry(outerRadius, innerRadius, depth) {
      const shape = new THREE.RingGeometry(innerRadius, outerRadius, 96);
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        steps: 1,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: 0.018,
        bevelThickness: 0.018,
        curveSegments: 96
      });
      geometry.rotateX(-Math.PI / 2);
      return geometry;
    }

    function makeLabelTexture(title, subtitle = "") {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      const gradient = ctx.createLinearGradient(0, 0, 1024, 256);
      gradient.addColorStop(0, "#102b39");
      gradient.addColorStop(0.5, "#071722");
      gradient.addColorStop(1, "#030b11");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 1024, 256);

      ctx.strokeStyle = "#68e7ff";
      ctx.lineWidth = 5;
      ctx.strokeRect(12, 12, 1000, 232);

      ctx.textAlign = "center";
      ctx.fillStyle = "#dff8ff";
      ctx.font = "700 76px Arial";
      ctx.fillText(title, 512, 112);

      if (subtitle) {
        ctx.fillStyle = "#68e7ff";
        ctx.font = "500 30px Arial";
        ctx.fillText(subtitle, 512, 174);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function makeDisplayTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 768;
      canvas.height = 320;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#06131b";
      ctx.fillRect(0, 0, 768, 320);

      ctx.strokeStyle = "#1b3946";
      ctx.lineWidth = 8;
      ctx.strokeRect(14, 14, 740, 292);

      ctx.fillStyle = "#68e7ff";
      ctx.font = "700 48px monospace";
      ctx.fillText("THERMAL CONTROL", 42, 72);

      ctx.fillStyle = "#dff8ff";
      ctx.font = "700 112px monospace";
      ctx.fillText("2.00 K", 42, 190);

      ctx.fillStyle = "#68e7ff";
      ctx.font = "500 28px monospace";
      ctx.fillText("DILUTION", 42, 245);
      ctx.fillText("VACUUM", 42, 278);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeCalloutTexture(title, subtitle) {
      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 160;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, 640, 160);
      ctx.fillStyle = "rgba(5, 18, 27, 0.82)";
      ctx.strokeStyle = "rgba(104, 231, 255, 0.55)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(8, 8, 624, 144, 22);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#dff8ff";
      ctx.font = "700 39px Arial";
      ctx.fillText(title, 320, 66);

      ctx.fillStyle = "#68e7ff";
      ctx.font = "500 24px Arial";
      ctx.fillText(subtitle, 320, 111);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function addCallout(title, subtitle, position, target, labelIndex) {
      const material = new THREE.SpriteMaterial({
        map: makeCalloutTexture(title, subtitle),
        transparent: true,
        depthTest: false,
        depthWrite: false
      });

      const sprite = new THREE.Sprite(material);
      sprite.position.set(...position);
      sprite.scale.set(2.15, 0.54, 1);
      sprite.renderOrder = 20;
      scene.add(sprite);

      const geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(...position),
        new THREE.Vector3(...target)
      ]);

      const line = new THREE.Line(
        geometry,
        new THREE.LineBasicMaterial({
          color: 0x68e7ff,
          transparent: true,
          opacity: 0.45,
          depthTest: false
        })
      );
      line.renderOrder = 19;
      scene.add(line);

      const labels.push(sprite, line);
    }

    // -------------------------------------------------------------------------
    // Lighting and stage
    // -------------------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0xbfe8ff, 0x10151b, 1.65));

    const keyLight = new THREE.DirectionalLight(0xe9f7ff, 3.4);
    keyLight.position.set(4.5, 7, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 18;
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x42bfff, 2.2);
    rimLight.position.set(-5, 3.5, -4);
    scene.add(rimLight);

    const warmLight = new THREE.PointLight(0xffb46b, 24, 9, 2);
    warmLight.position.set(3.5, 2.4, 3.5);
    scene.add(warmLight);

    const cyanLight = new THREE.PointLight(0x35d9ff, 28, 10, 2);
    cyanLight.position.set(-2.5, 3.7, 2.5);
    scene.add(cyanLight);

    const stage = cylinder(
      4.25,
      4.4,
      0.16,
      new THREE.MeshStandardMaterial({
        color: 0x0b151d,
        metalness: 0.35,
        roughness: 0.66
      }),
      [0, -0.09, 0],
      96
    );

    const grid = new THREE.GridHelper(18, 36, 0x284554, 0x16303d);
    grid.position.y = 0.012;
    grid.material.transparent = true;
    grid.material.opacity = 0.34;
    scene.add(grid);

    for (const radius of [1.75, 2.8, 3.8]) {
      const ring = mesh(
        new THREE.RingGeometry(radius, radius + 0.018, 128),
        new THREE.MeshBasicMaterial({
          color: 0x315466,
          transparent: true,
          opacity: 0.35,
          side: THREE.DoubleSide
        }),
        [0, 0.02, 0]
      );
      ring.rotation.x = -Math.PI / 2;
      ring.castShadow = false;
      ring.receiveShadow = false;
    }

    // -------------------------------------------------------------------------
    // Refrigerator assembly
    // -------------------------------------------------------------------------

    const refrigerator = new THREE.Group();
    refrigerator.rotation.y = -0.05;
    scene.add(refrigerator);

    // Lower supports and base.
    cylinder(1.92, 2.0, 0.18, materials.darkMetal, [0, 0.12, 0], 80, refrigerator);
    cylinder(1.78, 1.88, 0.18, materials.brushed, [0, 0.31, 0], 80, refrigerator);
    cylinder(1.62, 1.68, 0.12, materials.steel, [0, 0.43, 0], 80, refrigerator);

    // Lower vessel and thermal insulation.
    cylinder(1.43, 1.48, 0.76, materials.enamel, [0, 0.8, 0], 80, refrigerator);
    cylinder(1.55, 1.55, 0.42, materials.white, [0, 1.31, 0], 80, refrigerator);

    // Lower stack of separate metal plates.
    const lowerPlates = [];
    const lowerPlateMaterials = [
      materials.brushed,
      materials.steel,
      materials.brushed,
      materials.steel
    ];

    for (let i = 0; i < 5; i++) {
      const baseY = 1.55 + i * 0.13;
      const plate = mesh(
        annularPlateGeometry(1.64, 1.485, 0.105),
        [lowerPlateMaterials[i % 2], materials.darkMetal],
        [0, baseY, 0],
        refrigerator
      );

      const hub = cylinder(
        0.31,
        0.31,
        0.14,
        materials.darkMetal,
        [0, baseY + 0.025, 0],
        40,
        refrigerator
      );

      for (let j = 0; j < 8; j++) {
        const angle = (j / 8) * Math.PI * 2 + Math.PI / 8;
        const bolt = cylinder(
          0.035,
          0.035,
          0.045,
          materials.steel,
          [
            Math.cos(angle) * 1.56,
            baseY + 0.075,
            Math.sin(angle) * 1.56
          ],
          12,
          refrigerator
        );
        bolt.castShadow = false;
      }

      lowerPlates.push({
        mesh: plate,
        baseY,
        sign: 1
      });
    }

    // Upper vessel and insulation.
    cylinder(1.43, 1.48, 0.56, materials.enamel, [0, 2.3, 0], 80, refrigerator);
    cylinder(1.55, 1.55, 0.3, materials.white, [0, 2.63, 0], 80, refrigerator);

    // Upper stack of separate metal plates.
    const upperPlates = [];
    const upperPlateMaterials = [
      materials.steel,
      materials.brushed,
      materials.steel,
      materials.brushed
    ];

    for (let i = 0; i < 5; i++) {
      const baseY = 2.79 + i * 0.13;
      const plate = mesh(
        annularPlateGeometry(1.64, 1.485, 0.105),
        [upperPlateMaterials[i % 2], materials.darkMetal],
        [0, baseY, 0],
        refrigerator
      );

      const hub = cylinder(
        0.31,
        0.31,
        0.14,
        materials.darkMetal,
        [0, baseY + 0.025, 0],
        40,
        refrigerator
      );

      for (let j = 0; j < 8; j++) {
        const angle = (j / 8) * Math.PI * 2 + Math.PI / 8;
        const bolt = cylinder(
          0.035,
          0.035,
          0.045,
          materials.steel,
          [
            Math.cos(angle) * 1.56,
            baseY + 0.075,
            Math.sin(angle) * 1.56
          ],
          12,
          refrigerator
        );
        bolt.castShadow = false;
      }

      upperPlates.push({
        mesh: plate,
        baseY,
        sign: 1
      });
    }

    // Top cap, feedthrough, and dome.
    cylinder(1.64, 1.58, 0.17, materials.darkMetal, [0, 3.46, 0], 80, refrigerator);
    cylinder(0.34, 0.42, 0.34, materials.brushed, [0, 3.69, 0], 48, refrigerator);

    const dome = mesh(
      new THREE.SphereGeometry(
        1.64,
        80,
        28,
        0,
        Math.PI * 2,
        0,
        Math.PI / 2
      ),
      materials.enamel,
      [0, 3.56, 0],
      refrigerator
    );
    dome.scale.y = 0.34;

    // Front identification plate.
    const idTexture = makeLabelTexture(
      "DILUTION REFRIGERATOR",
      "DR-01  ·  2.0 K  ·  ULTRA LOW TEMPERATURE"
    );

    const idMaterial = new THREE.MeshBasicMaterial({
      map: idTexture,
      transparent: true
    });

    const idPlate = mesh(
      new THREE.PlaneGeometry(1.8, 0.45),
      idMaterial,
      [0, 3.23, 1.475],
      refrigerator
    );
    idPlate.castShadow = false;

    // Instrumentation panel.
    const panel = mesh(
      new THREE.BoxGeometry(0.94, 1.18, 0.15),
      materials.darkMetal,
      [-0.57, 2.25, 1.49],
      refrigerator
    );

    const panelInset = mesh(
      new THREE.BoxGeometry(0.82, 1.02, 0.035),
      materials.brushed,
      [-0.57, 2.25, 1.58],
      refrigerator
    );

    const displayTexture = makeDisplayTexture();
    const display = mesh(
      new THREE.PlaneGeometry(0.62, 0.28),
      new THREE.MeshBasicMaterial({ map: displayTexture }),
      [-0.61, 2.68, 1.615],
      refrigerator
    );
    display.castShadow = false;

    // Analog temperature gauge.
    const gaugeHousing = cylinder(
      0.18,
      0.18,
      0.08,
      materials.steel,
      [-1.03, 2.31, 1.62],
      48,
      refrigerator
    );
    gaugeHousing.rotation.x = Math.PI / 2;

    const gaugeFace = mesh(
      new THREE.CircleGeometry(0.15, 48),
      new THREE.MeshStandardMaterial({
        color: 0xf0f4ed,
        roughness: 0.55,
        metalness: 0.1
      }),
      [-1.03, 2.31, 1.665],
      refrigerator
    );

    const tickGeometry = new THREE.BufferGeometry().setFromPoints([]);
    const tickPositions = [];
    for (let i = 0; i <= 12; i++) {
      const angle = THREE.MathUtils.lerp(-2.25, 2.25, i / 12);
      const inner = 0.085;
      const outer = 0.135;
      tickPositions.push(
        -1.03 + Math.cos(angle) * inner,
        2.31 + Math.sin(angle) * inner,
        1.67,
        -1.03 + Math.cos(angle) * outer,
        2.31 + Math.sin(angle) * outer,
        1.67
      );
    }
    tickGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(tickPositions, 3)
    );

    refrigerator.add(
      new THREE.LineSegments(
        tickGeometry,
        new THREE.LineBasicMaterial({ color: 0x26343b })
      )
    );

    const needlePivot = new THREE.Group();
    needlePivot.position.set(-1.03, 2.31, 1.685);
    needlePivot.rotation.z = -0.55;
    refrigerator.add(needlePivot);

    mesh(
      new THREE.BoxGeometry(0.012, 0.105, 0.012),
      materials.red,
      [0, 0.045, 0],
      needlePivot
    );

    const needleHub = cylinder(
      0.025,
      0.025,
      0.018,
      materials.black,
      [-1.03, 2.31, 1.69],
      20,
      refrigerator
    );
    needleHub.rotation.x = Math.PI / 2;

    // Control knob and status buttons.
    const knob = cylinder(
      0.095,
      0.095,
      0.09,
      materials.black,
      [-0.24, 2.25, 1.61],
      32,
      refrigerator
    );
    knob.rotation.x = Math.PI / 2;

    mesh(
      new THREE.SphereGeometry(0.035, 20, 12),
      materials.green,
      [-0.24, 2.55, 1.61],
      refrigerator
    );

    mesh(
      new THREE.SphereGeometry(0.035, 20, 12),
      materials.red,
      [-0.24, 1.95, 1.61],
      refrigerator
    );

    // Small ventilation slots.
    for (let i = 0; i < 4; i++) {
      mesh(
        new THREE.BoxGeometry(0.3, 0.025, 0.018),
        materials.black,
        [-0.57, 1.99 + i * 0.075, 1.605],
        refrigerator
      );
    }

    // Service pipes and flanges.
    const upperPipePoints = [
      [0, 3.61, 0],
      [0.28, 3.61, 0],
      [0.28, 3.38, 0],
      [0.28, 3.08, 0],
      [0.28, 2.72, 0],
      [0.28, 2.48, 0]
    ];

    const lowerPipePoints = [
      [0, 1.1, 0],
      [0.28, 1.1, 0],
      [0.28, 0.91, 0],
      [0.28, 0.7, 0],
      [0.28, 0.49, 0]
    ];

    tube(upperPipePoints, 0.075, materials.brushed, refrigerator, 90);
    tube(lowerPipePoints, 0.065, materials.brushed, refrigerator, 70);

    flange([0.28, 3.38, 0], "x", 0.1, refrigerator);
    flange([0.28, 2.72, 0], "x", 0.09, refrigerator);
    flange([0.28, 0.91, 0], "x", 0.085, refrigerator);
    flange([0.28, 0.49, 0], "x", 0.08, refrigerator);

    // Valve assembly.
    const valveWheel = torus(
      0.13,
      0.022,
      materials.red,
      [0.36, 3.38, 0],
      [0, Math.PI / 2, 0],
      refrigerator
    );

    const valveStem = cylinder(
      0.025,
      0.025,
      0.2,
      materials.steel,
      [0.36, 3.38, 0],
      20,
      refrigerator
    );
    valveStem.rotation.x = Math.PI / 2;

    // Lower service port and fittings.
    const lowerPort = cylinder(
      0.16,
      0.16,
      0.26,
      materials.brushed,
      [1.47, 1.1, 0],
      40,
      refrigerator
    );
    lowerPort.rotation.z = Math.PI / 2;

    const lowerCap = cylinder(
      0.12,
      0.12,
      0.1,
      materials.darkMetal,
      [1.67, 1.1, 0],
      32,
      refrigerator
    );
    lowerCap.rotation.z = Math.PI / 2;

    // -------------------------------------------------------------------------
    // Control cabinet and wiring harness
    // -------------------------------------------------------------------------

    const controlCabinet = new THREE.Group();
    controlCabinet.position.set(2.48, 1.22, 0.35);
    refrigerator.add(controlCabinet);

    mesh(
      new THREE.BoxGeometry(0.84, 1.18, 0.6),
      materials.white,
      [0, 0, 0],
      controlCabinet
    );

    mesh(
      new THREE.BoxGeometry(0.72, 0.94, 0.04),
      materials.brushed,
      [0, 0, 0.315],
      controlCabinet
    );

    const cabinetDisplay = mesh(
      new THREE.PlaneGeometry(0.48, 0.22),
      new THREE.MeshBasicMaterial({
        map: displayTexture,
        transparent: true
      }),
      [0, 0.2, 0.34],
      controlCabinet
    );
    cabinetDisplay.castShadow = false;

    const cabinetLED = mesh(
      new THREE.SphereGeometry(0.045, 18, 10),
      materials.green,
      [0.22, -0.2, 0.35],
      controlCabinet
    );

    const cabinetKnob = cylinder(
      0.065,
      0.065,
      0.07,
      materials.black,
      [-0.2, -0.2, 0.36],
      24,
      controlCabinet
    );
    cabinetKnob.rotation.x = Math.PI / 2;

    // Cable ties around the harness.
    const cableTieMaterial = materials.black;

    function addCableTie(position, rotation = [0, 0, 0]) {
      const tie = mesh(
        new THREE.BoxGeometry(0.09, 0.045, 0.055),
        cableTieMaterial,
        position,
        refrigerator
      );
      tie.rotation.set(...rotation);
    }

    const wireColors = [
      materials.cyan,
      materials.amber,
      materials.red,
      materials.blue,
      materials.purple,
      materials.green
    ];

    const upperWirePaths = [
      [
        [2.25 + i * 0.07, 1.52 + i * 0.055, 0.66],
        [1.98, 2.02, 0.91],
        [1.65, 2.58, 1.18],
        [1.48, 3.13, 1.34],
        [1.34, 3.72, 1.22]
      ],
      [
        [2.42 + i * 0.065, 1.34 + i * 0.045, 0.66],
        [2.05, 1.88, 0.95],
        [1.68, 2.5, 1.2],
        [1.49, 3.16, 1.37],
        [1.32, 3.76, 1.25]
      ],
      [
        [2.3 + i * 0.05, 1.16 + i * 0.04, 0.66],
        [1.92, 1.67, 0.98],
        [1.55, 2.35, 1.22],
        [1.4, 3.02, 1.36],
        [1.26, 3.68, 1.28]
      ]
    ];

    const lowerWirePaths = [
      [
        [2.32 + i * 0.07, 0.82 + i * 0.045, 0.66],
        [1.98, 1.03, 0.92],
        [1.6, 1.34, 1.19],
        [1.47, 1.14, 1.35],
        [1.35, 1.08, 1.4]
      ],
      [
        [2.48 + i * 0.06, 0.67 + i * 0.035, 0.66],
        [2.04, 0.89, 0.96],
        [1.62, 1.19, 1.22],
        [1.48, 1.08, 1.38],
        [1.37, 1.03, 1.42]
      ],
      [
        [2.25 + i * 0.045, 0.52 + i * 0.03, 0.66],
        [1.88, 0.72, 0.98],
        [1.49, 0.96, 1.24],
        [1.39, 1.04, 1.4],
        [1.34, 1.01, 1.44]
      ]
    ];

    for (const path of upperWirePaths) {
      tube(path, 0.026, wireColors[path.length - 1], refrigerator, 90);
    }

    for (const path of lowerWirePaths) {
      tube(path, 0.023, wireColors[path.length - 1], refrigerator, 80);
    }

    // Main power conduit.
    tube(
      [
        [2.48, 1.68, 0.67],
        [2.0, 1.92, 0.92],
        [1.58, 2.35, 1.25],
        [1.48, 2.85, 1.38]
      ],
      0.052,
      materials.black,
      refrigerator,
      80
    );

    // Additional service cables.
    tube(
      [
        [2.45, 0.58, 0.67],
        [2.05, 0.82, 0.94],
        [1.62, 1.18, 1.24],
        [1.49, 1.42, 1.4]
      ],
      0.032,
      materials.black,
      refrigerator,
      75
    );

    // Harness clamps.
    const clampPositions = [
      [2.02, 1.9, 0.93],
      [1.7, 2.48, 1.18],
      [1.49, 2.95, 1.35],
      [1.96, 1.08, 0.94],
      [1.62, 1.35, 1.2],
      [1.49, 1.43, 1.4]
    ];

    for (const position of clampPositions) {
      addCableTie([...position], [0.15, 0.3, 0]);
    }

    // -------------------------------------------------------------------------
    // Labels and callouts
    // -------------------------------------------------------------------------

    addCallout(
      "DILUTION PLATE STACK",
      "MOVABLE THERMAL STAGES",
      [0.15, 4.9, 0.45],
      [0.15, 3.65, 0],
      0
    );

    addCallout(
      "THERMAL INSULATION",
      "VACUUM JACKET / 85 K",
      [-1.95, 2.55, 0.55],
      [-1.3, 2.3, 0],
      1
    );

    addCallout(
      "SERVICE HARNESS",
      "POWER / TEMPERATURE / CONTROL",
      [2.95, 1.45, 0.95],
      [2.48, 1.22, 0.35],
      2
    );

    // -------------------------------------------------------------------------
    // Custom camera controls: orbit, pan, zoom, keyboard, and touch
    // -------------------------------------------------------------------------

    const controls = {
      theta: 0.72,
      phi: 1.18,
      radius: 7.35,
      target: new THREE.Vector3(0, 1.95, 0),
      targetGoal: new THREE.Vector3(0, 1.95, 0),
      autoOrbit: true,
      labelsVisible: true
    };

    const spherical = new THREE.Spherical();
    const pointer = new Map();
    let dragMode = "orbit";
    let lastPointer = { x: 0, y: 0 };
    let pinchDistance = 0;

    const canvas = renderer.domElement;
    canvas.addEventListener("contextmenu", (event) => event.preventDefault());

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      pointer.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (pointer.size === 1) {
        dragMode =
          event.button === 2 || event.shiftKey ? "pan" : "orbit";
        lastPointer = { x: event.clientX, y: event.clientY };
      } else if (pointer.size === 2) {
        const points = [...pointer.values()];
        pinchDistance = Math.hypot(
          points[0].x - points[1].x,
          points[0].y - points[1].y
        );
        dragMode = "pinch";
      }
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!pointer.has(event.pointerId)) return;

      pointer.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (dragMode === "pinch" && pointer.size >= 2) {
        const points = [...pointer.values()];
        const distance = Math.hypot(
          points[0].x - points[1].x,
          points[0].y - points[1].y
        );

        if (pinchDistance > 0) {
          controls.radiusGoal = THREE.MathUtils.clamp(
            controls.radiusGoal * (pinchDistance / distance),
            4.2,
            12
          );
        }

        pinchDistance = distance;
        return;
      }

      const dx = event.clientX - lastPointer.x;
      const dy = event.clientY - lastPointer.y;
      lastPointer = { x: event.clientX, y: event.clientY };

      if (dragMode === "orbit") {
        controls.thetaGoal = THREE.MathUtils.clamp(
          controls.thetaGoal - dx * 0.006,
          -Math.PI * 0.8,
          Math.PI * 0.8
        );
        controls.phiGoal = THREE.MathUtils.clamp(
          controls.phiGoal - dy * 0.006,
          0.35,
          Math.PI * 0.78
        );
      } else if (dragMode === "pan") {
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);

        const right = new THREE.Vector3()
          .crossVectors(forward, camera.up)
          .normalize();

        const up = new THREE.Vector3()
          .crossVectors(right, forward)
          .normalize();

        const panScale = controls.radius * 0.0013;

        controls.targetGoal
          .addScaledVector(right, -dx * panScale)
          .addScaledVector(up, dy * panScale);

        controls.targetGoal.y = THREE.MathUtils.clamp(
          controls.targetGoal.y,
          0.3,
          4.2
        );
      }
    });

    function endPointer(event) {
      pointer.delete(event.pointerId);
      if (pointer.size === 0) {
        dragMode = "orbit";
      } else if (pointer.size === 1) {
        const remaining = [...pointer.values()][0];
        lastPointer = { x: remaining.x, y: remaining.y };
        dragMode = "orbit";
      }
    }

    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);

    canvas.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        controls.radiusGoal = THREE.MathUtils.clamp(
          controls.radiusGoal * Math.exp(event.deltaY * 0.001),
          4.2,
          12
        );
      },
      { passive: false }
    );

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (key === "arrowleft") controls.thetaGoal += 0.1;
      if (key === "arrowright") controls.thetaGoal -= 0.1;
      if (key === "arrowup") controls.phiGoal -= 0.08;
      if (key === "arrowdown") controls.phiGoal += 0.08;
      if (key === "+" || key === "=") controls.radiusGoal -= 0.25;
      if (key === "-") controls.radiusGoal += 0.25;
      if (key === "r") resetView();
    });

    function resetView() {
      controls.thetaGoal = 0.72;
      controls.phiGoal = 1.18;
      controls.radiusGoal = 7.35;
      controls.targetGoal.set(0, 1.95, 0);
    }

    // -------------------------------------------------------------------------
    // UI controls
    // -------------------------------------------------------------------------

    const spreadInput = document.getElementById("spread");
    const spreadValue = document.getElementById("spreadValue");
    const spreadToggle = document.getElementById("spreadToggle");
    const orbitToggle = document.getElementById("orbitToggle");
    const labelsToggle = document.getElementById("labelsToggle");
    const resetButton = document.getElementById("resetView");

    let targetSpread = 0;
    let currentSpread = 0;

    function updateSpreadUI() {
      const percent = Math.round(targetSpread * 100);
      spreadValue.textContent = `${percent}%`;
      spreadInput.style.setProperty("--fill", `${percent}%`);
    }

    spreadInput.addEventListener("input", () => {
      targetSpread = Number(spreadInput.value) / 100;
      spreadToggle.textContent =
        targetSpread > 0.01 ? "Assemble plates" : "Spread layers";
      updateSpreadUI();
    });

    spreadToggle.addEventListener("click", () => {
      targetSpread = targetSpread > 0.01 ? 0 : 0.88;
      spreadToggle.textContent =
        targetSpread > 0.01 ? "Assemble plates" : "Spread layers";
      updateSpreadUI();
    });

    orbitToggle.addEventListener("click", () => {
      controls.autoOrbit = !controls.autoOrbit;
      orbitToggle.classList.toggle("active", controls.autoOrbit);
    });

    labelsToggle.addEventListener("click", () => {
      controls.labelsVisible = !controls.labelsVisible;
      labelsToggle.classList.toggle("active", controls.labelsVisible);
      labels.forEach((item) => {
        item.visible = controls.labelsVisible;
      });
    });

    resetButton.addEventListener("click", resetView);
    updateSpreadUI();

    // -------------------------------------------------------------------------
    // Animation
    // -------------------------------------------------------------------------

    const clock = new THREE.Clock();
    let firstFrame = true;

    renderer.setAnimationLoop(() => {
      const delta = Math.min(clock.getDelta(), 0.05);
      const damping = 1 - Math.exp(-delta * 10);

      if (controls.autoOrbit) {
        controls.thetaGoal += delta * 0.16;
      }

      controls.theta = THREE.MathUtils.lerp(
        controls.theta,
        controls.thetaGoal,
        damping
      );
      controls.phi = THREE.MathUtils.lerp(
        controls.phi,
        controls.phiGoal,
        damping
      );
      controls.radius = THREE.MathUtils.lerp(
        controls.radius,
        controls.radiusGoal,
        damping
      );
      controls.target.lerp(controls.targetGoal, damping);

      // Exploded layer animation.
      currentSpread = THREE.MathUtils.lerp(
        currentSpread,
        targetSpread,
        damping
      );

      for (const plate of lowerPlates) {
        plate.mesh.position.y =
          plate.baseY - currentSpread * 0.12 * (plate.sign || 1);
      }

      for (const plate of upperPlates) {
        plate.mesh.position.y =
          plate.baseY + currentSpread * 0.12 * (plate.sign || 1);
      }

      // Gentle status-light pulse.
      materials.green.emissiveIntensity =
        1.25 + Math.sin(clock.elapsedTime * 2.2) * 0.25;

      // Camera position and look target.
      spherical.set(controls.radius, controls.phi, controls.theta);
      camera.position.setFromSpherical(spherical).add(controls.target);
      camera.lookAt(controls.target);

      // Subtle gauge movement.
      needlePivot.rotation.z = -0.55 + Math.sin(clock.elapsedTime * 0.7) * 0.025;

      renderer.render(scene, camera);

      if (firstFrame) {
        firstFrame = false;
        loading.classList.add("hidden");
        setTimeout(() => loading.remove(), 600);
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
